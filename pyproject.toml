[project]
name = "cuecut"
version = "0.1.0"
description = "Narrated presentation videos: a markdown script, a cloned voice, HTML scenes cut to the word."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["playwright>=1.50", "static-ffmpeg>=2.7"]

[project.scripts]
cuecut = "cuecut.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "ty"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
