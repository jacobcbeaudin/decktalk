[project]
name = "decktalk"
version = "0.2.0"
description = "Narrated presentations, cut to the word. A markdown script, an ElevenLabs voice, and HTML slides go in, and one mp4 comes out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Jacob Beaudin" }]
keywords = [
    "presentation",
    "narration",
    "elevenlabs",
    "video",
    "slides",
    "text-to-speech",
    "markdown",
    "video-generation",
    "explainer-video",
    "lesson",
    "screencast",
    "word-timestamps",
    "playwright",
    "ffmpeg",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["playwright>=1.50", "static-ffmpeg>=2.7"]

[project.urls]
Homepage = "https://decktalk.app"
Repository = "https://github.com/jacobcbeaudin/decktalk"
Documentation = "https://docs.decktalk.app"
Issues = "https://github.com/jacobcbeaudin/decktalk/issues"
Changelog = "https://github.com/jacobcbeaudin/decktalk/blob/main/CHANGELOG.md"

[project.scripts]
decktalk = "decktalk.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "ty>=0.0.1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # generated CSS and SVG strings

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs headless Chromium (run `decktalk setup` first)",
    "media: runs the ffmpeg that `decktalk setup` fetches",
]
addopts = "-m 'not browser and not media'"
