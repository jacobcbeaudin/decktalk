[project]
name = "decktalk"
version = "0.3.0"
description = "Every picture lands on its word, and you edit the video like a doc. DeckTalk turns a markdown script, HTML slides, and your voice into one narrated mp4, for technical tutorials, product demos, and lessons."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Jacob Beaudin" }]
keywords = [
    "presentation",
    "narration",
    "elevenlabs",
    "video",
    "slides",
    "text-to-speech",
    "markdown",
    "video-generation",
    "explainer-video",
    "lesson",
    "screencast",
    "word-timestamps",
    "playwright",
    "ffmpeg",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["playwright>=1.50,<2"]

[project.urls]
Homepage = "https://decktalk.ai"
Repository = "https://github.com/jacobcbeaudin/decktalk"
Documentation = "https://docs.decktalk.ai"
Issues = "https://github.com/jacobcbeaudin/decktalk/issues"
Changelog = "https://github.com/jacobcbeaudin/decktalk/blob/main/CHANGELOG.md"

[project.scripts]
decktalk = "decktalk.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

# `uv build` reads the working tree, so a Finder sidecar next to the template would ship in a wheel
# cut from a laptop. tests/test_wheel.py checks the built wheel against the files git tracks.
[tool.uv.build-backend]
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    "ruff>=0.11",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # generated CSS and SVG strings

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs headless Chromium (run `decktalk setup` first)",
    "media: runs the ffmpeg that `decktalk setup` fetches",
    "e2e: builds the pipeline fixture in tests/e2e with Chromium and ffmpeg, about a minute",
    "scaffold: builds the whole scaffold project, about twenty minutes",
]
# A bare `pytest` runs the unit suite alone. Pass -m to pick the slower suites, as scripts/check.py does.
addopts = "-m 'not browser and not media and not e2e and not scaffold' --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["decktalk"]

[tool.coverage.report]
# The floor is the whole suite measured on Linux with `-m 'not scaffold'`, rounded down. Raise it when coverage grows.
fail_under = 82
show_missing = false
skip_empty = true
