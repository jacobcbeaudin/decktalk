[project]
name = "decktalk"
version = "0.1.0"
description = "Narrated presentation videos: a markdown script, a cloned voice, HTML scenes cut to the word."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jacob Beaudin" }]
keywords = ["presentation", "narration", "elevenlabs", "video", "slides", "text-to-speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["playwright>=1.50", "static-ffmpeg>=2.7"]

[project.urls]
Homepage = "https://decktalk.app"
Repository = "https://github.com/jacobcbeaudin/decktalk"

[project.scripts]
decktalk = "decktalk.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "ty"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs headless Chromium (run `decktalk setup` first)"]
addopts = "-m 'not browser'"
