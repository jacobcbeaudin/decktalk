[project]
name = "decktalk"
version = "0.6.0"
description = "Every picture lands on its word: DeckTalk turns a markdown script, HTML slides and your voice into one narrated mp4."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Jacob Beaudin" }]
keywords = [
    "presentation",
    "narration",
    "elevenlabs",
    "video",
    "slides",
    "text-to-speech",
    "markdown",
    "video-generation",
    "explainer-video",
    "lesson",
    "screencast",
    "word-timestamps",
    "playwright",
    "ffmpeg",
    "tutorial",
    "narrated-video",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    # File fingerprints hash a large recording or film on every core. 1.0 is the first stable release.
    "blake3>=1.0",
    # 3.20.1 is the first release that refuses to follow a `build/.lock` planted as a link.
    "filelock>=3.20.1",
    # conda-forge's playwright-python does not pin the Node driver it runs, and the two must be one
    # release, so DeckTalk names one minor and a conda recipe pins both to it. Renovate moves the minor.
    "playwright>=1.64,<1.65",
    "pydantic>=2.11",
    # typer 0.26 itself needs 13.8, so a lower floor here names a version no install can reach.
    "rich>=13.8",
    "tomlkit>=0.13",
    # 0.26 is the first release with its own copy of Click, which the command line subclasses, so
    # Click itself is not a dependency.
    "typer>=0.26",
]

[project.urls]
Homepage = "https://decktalk.ai"
Repository = "https://github.com/jacobcbeaudin/decktalk"
Documentation = "https://docs.decktalk.ai"
Issues = "https://github.com/jacobcbeaudin/decktalk/issues"
Changelog = "https://github.com/jacobcbeaudin/decktalk/blob/main/CHANGELOG.md"

[project.scripts]
decktalk = "decktalk.cli:main"

[build-system]
# Hatchling is the backend Pixi documents for a Python project. 1.27 is the first release that
# writes the `license-files` of `[project]` as PEP 639 was accepted.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# A wheel is built from the files on disk, so a Finder sidecar next to the template would ship in a
# wheel cut from a laptop. tests/contract/test_wheel.py checks the built wheel against the files git
# tracks, and reads these patterns from here. The runtime ships as the two bundles the build writes,
# so the TypeScript they are built from and the compiler's own configuration stay out of the wheel:
# a wheel carries what DeckTalk runs.
[tool.hatch.build.targets.wheel]
packages = ["src/decktalk"]
exclude = ["**/.DS_Store", "**/runtime/src/**", "**/tsconfig.json"]

# The sdist is the package source, its metadata and its licenses, which hatchling always adds. The
# wheel is built from the sdist, so nothing outside `src/decktalk` can reach a wheel through it.
[tool.hatch.build.targets.sdist]
only-include = ["src/decktalk"]
exclude = ["**/.DS_Store"]

[dependency-groups]
dev = [
    # Property tests draw the cases a hand-written list would miss.
    "hypothesis>=6.168",
    # A renderer's output is held as literal text in its test. CI only compares, and a person writes
    # one with `pytest -p no:xdist --inline-snapshot=create,fix <file>`.
    "inline-snapshot>=0.35",
    # The generated pages whose shape is mostly prose render from templates that read as the page does.
    "jinja2>=3.1",
    # Every command's output and every setting's default are validated against the committed schemas.
    "jsonschema>=4.23",
    # install.sh branches on `[ -t 1 ]`, so its test runs it under a terminal and sends the Ctrl-C.
    "pexpect>=4.9.0",
    # The wheel row and the release build with the hatchling pixi.lock pins, without network, rather
    # than with one fetched into an isolated environment. Its floor has one home, `[build-system]`, and
    # `python -m build --no-isolation` refuses a hatchling below it.
    "build>=1.2",
    "hatchling",
    # check_wheel.py compares the tag with the wheel as two PEP 440 versions, never as two strings.
    "packaging>=24",
    "pytest>=8",
    "pytest-cov>=6",
    # A loopback listener whose request log a "reaches nothing" test asserts is empty.
    "pytest-httpserver>=1.1.5",
    "pytest-timeout>=2.3",
    # The unit row runs under `-n auto`, which halves the time every push waits on.
    "pytest-xdist>=3.6",
    # Page front matter and `ci.yml` are read as YAML rather than searched as text.
    "pyyaml>=6",
    "ruff>=0.16.8",
    # The import-layer test asks the import graph for its cycles rather than walking edges by hand.
    "rustworkx>=0.17",
    "ty>=0.0.83",
]

# Pixi owns the environment and the wheel is the product. `[project]` and the dev group above say
# what DeckTalk needs. The tables below say what a contributor's machine and every CI leg need
# beside it, and pixi.lock pins all of it for four platforms: the Python, Node, the git hook runner,
# the workflow auditor and every Python package. Two things a check runs come from elsewhere, each
# with one pin: the hooks config names the two hooks prek fetches for itself, and `decktalk install`
# fetches Chromium and ffmpeg as a user's machine fetches them.
[tool.pixi.workspace]
# One channel, so every package comes from one community build and one solver judges them together.
channels = ["conda-forge"]
# The three platforms CI runs, and the Intel Mac a contributor may still have.
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
# Pixi 0.84.0 changed how pixi.lock hashes a package, so an older Pixi reads this lock as stale. This
# is also the one home of the Pixi version CI runs: tests/scripts/test_check.py holds the
# `pixi-version` of every setup-pixi step in ci.yml and release.yml to this number.
requires-pixi = ">=0.84.1"
# pixi-build is how `pixi build` and `pixi publish` turn this project into the conda package users
# install with `pixi global install`. It is a preview feature, so Pixi asks for it by name.
preview = ["pixi-build"]

# What every environment but `plan` installs beside its Python.
[tool.pixi.dependencies]
# The floor package.json sets in `engines`, and the line every row that runs JavaScript tests on.
# `node --test` reads a directory differently on Node 24 and later, so a newer line is a different
# check. Node runs esbuild, TypeScript, Biome and release-please, and package-lock.json pins those.
nodejs = ">=22.18,<23"
# Runs .pre-commit-config.yaml, as the git hooks and as the lint row. `pixi run setup` installs the
# hooks from this copy, so the hook a commit runs and the lint row CI runs are one version.
# conda-forge builds every prek release, and the hooks config states this line as its minimum.
prek = ">=0.5.9,<0.6"
# The workflow auditor the lint row runs over .github/workflows. A new release can add an audit, so
# pixi.lock pins it and a bump is a pull request of its own.
zizmor = ">=1.32,<2"

# The package itself, installed from this checkout in editable mode, so every command imports the
# working tree. Pixi reads `[project.dependencies]` for what it needs and pins those in pixi.lock.
[tool.pixi.pypi-dependencies]
decktalk = { path = ".", editable = true }

# One Python per environment, because the unit row runs on every Python `requires-python` admits and
# the classifiers list. scripts/check.py names each environment from its Python: `py313` for 3.13.
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# `dev` is the dependency group above, which Pixi turns into a feature of the same name. The three
# Pythons never share a solve-group, because one solve cannot hold two Python lines.
[tool.pixi.environments]
# The floor is the default, so a bare `pixi install` gives a contributor the oldest Python a user may
# have, and check.py names the floor's environment `default`.
default = ["py312", "dev"]
py313 = ["py313", "dev"]
py314 = ["py314", "dev"]
# A Python and nothing else, for the CI job that only reads the check table. check.py imports
# nothing outside the standard library, so this job installs no package and no Node.
plan = { features = ["py312"], no-default-feature = true }

# Each task is a short name for a command whose home is elsewhere, and adds nothing of its own.
# Arguments pass through, so `pixi run check --fast` is `python scripts/check.py --fast`.
[tool.pixi.tasks]
check = { cmd = "python scripts/check.py", description = "Run the check table in scripts/check.py, with every argument passed through" }
# Once per clone. `check --setup` runs every preparation the table names, which is `npm ci` and
# `decktalk install`, and then prek writes the git hooks. `npm ci` comes first, because the Biome hook
# runs from node_modules.
setup = { cmd = "prek install", depends-on = [{ task = "check", args = ["--setup"] }], description = "Once per clone: the Node packages, Chromium, ffmpeg and the git hooks" }

# The conda package users install with `pixi global install`, built by `pixi build` and published by
# release.yml's `conda` job. pixi-build-python builds the wheel with the hatchling `[build-system]`
# names and reads name, version, license files and `[project.dependencies]` from `[project]`, so
# this table holds only what a conda package says differently from a wheel.
[tool.pixi.package.build]
# 0.* is the line Pixi's docs name, and pixi-build is preview, so a new major may change the config.
backend = { name = "pixi-build-python", version = "0.*" }

[tool.pixi.package.build.config]
# Pure Python, so one package serves every platform conda-forge builds Playwright for.
noarch = true
# `[project.dependencies]` and `[build-system]` become the conda run and host dependencies only with
# the mapping on, which Pixi leaves off by default.
ignore-pypi-mapping = false
# The PyPI name `playwright` is the Python client, and on conda-forge `playwright` is the Node
# driver it runs, so the client is renamed here and the driver is named in the table below.
pypi-conda-map = { playwright = "playwright-python" }

# The wheel bundles the Node driver its client calls, and the conda client does not pin the driver
# it runs (conda-forge/playwright-python-feedstock#19). A driver of another minor fails at the first
# launch, so the driver is held to the minor `[project.dependencies]` names for the client.
# scripts/check_playwright_pair.py holds the two ranges equal and confirms conda-forge has both.
[tool.pixi.package.run-dependencies]
playwright = ">=1.64,<1.65"
# CI tests Python 3.12 to 3.14, and `pixi global install` takes the newest Python the channels hold,
# so the package admits only the Pythons CI tests. The upper bound moves when py315 joins the matrix.
python = ">=3.12,<3.15"

[tool.ruff]
line-length = 120
# The three roots a module is imported from, so `decktalk`, the suite's `support` and every script
# sort as first-party without a list of names that a new script would have to join by hand.
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP",
    "ANN401",   # a parameter typed Any accepts anything, so the caller learns nothing from the signature
    "ARG",      # an argument nothing reads is either dead or a signature that no longer fits
    "BLE001",   # a bare `except Exception` swallows the failure the error codes exist to name
    "C901",     # a branch count above the default is a function that wants to be two
    "PLC0415",  # an import inside a function hides a dependency from the layering guard
    "PLR0915",  # a statement count above the default is a function that wants to be two
    "PLW1510",  # a `subprocess.run` with no `check` ignores the return code, which is must 4
    "RUF046",   # `int()` around a value that is already an int is a cast that means nothing
    "RUF100",   # a `noqa` for a rule that no longer fires hides the next finding on that line
]

[tool.ruff.lint.per-file-ignores]
# This one reads TOML, whose values are `Any` before they are checked. Typing the parameter as
# anything narrower would be a claim the file has not made yet, which is what it exists to make.
"src/decktalk/tomlmap/*.py" = ["ANN401"]
# A test replaces a seam with a lambda of the real signature and reads only the arguments it judges,
# so ARG005 there measures the seam rather than the test. ARG still holds over every other argument.
"tests/**" = ["ARG005"]

[tool.ruff.lint.flake8-annotations]
# `**kwargs: Any` on a helper that forwards keywords to a typed call says nothing false, and the
# typed call still checks them. ANN401 still holds over every named parameter and return.
allow-star-arg-any = true

[tool.ruff.lint.flake8-unused-arguments]
# A fake of a third-party seam takes the arguments the real one takes, and reads the ones it judges.
ignore-variadic-names = true

[tool.ty.environment]
# pytest puts scripts/ on the path so a test imports the script it tests by name, and ty reads the
# same root, so those imports resolve to the scripts rather than to nothing.
extra-paths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two modules of the tree are named plan.py, so their mirrored test files share a basename.
consider_namespace_packages = true
# tests/ is on the path, so `tests/support/` is imported as `support.<module>` from anywhere in the suite.
# scripts/ is on it too, so a test imports the script it tests by name, as the scripts import each other.
pythonpath = ["tests", "scripts"]
# A test still running after two minutes has hung, so every thread's stack is printed to say where.
faulthandler_timeout = 120
# Every marker names its tool in its first clause, so `pytest --markers` lists what each suite needs.
markers = [
    "browser: needs the headless Chromium that `decktalk install` fetches",
    "media: needs the ffmpeg that `decktalk install` fetches",
    "e2e: needs Chromium and ffmpeg, and builds the pipeline fixture in tests/e2e, about a minute",
    "scaffold: needs Chromium and ffmpeg, and records every packaged project several times over without a voice",
    "platform: needs the machine it runs on, whose filesystem and fetched toolchain are what it asserts",
    "wheel: needs the wheel `python -m build` writes into dist/, and is given to tests/contract/test_wheel.py by its path",
]
# Selection is `tests/conftest.py`'s collection hook rather than an `-m` here, because a person's own
# `-m` replaces this line whole and would admit every suite it did not name.
addopts = "--strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["decktalk"]
# Playwright runs every synchronous call on a greenlet, so without this every line after the first
# page call inside a browser test reads as dead and the floor would be blind to the recorder.
concurrency = ["thread", "greenlet"]
# The e2e suite drives the command line as a subprocess, and a subprocess that starts coverage with
# `COVERAGE_PROCESS_START` writes its own data file. Without a suffix per process those files would
# be one name that every process overwrites, and `coverage combine` is what puts them back together.
parallel = true

# There is no `fail_under` here. The one floor is `scripts/coverage-floor.json`, which is measured
# from a real run and gated by `scripts/check_coverage.py`, and a second floor typed into this file
# would be a number nobody measured that fails `coverage report` on its own.
[tool.coverage.report]
skip_empty = true
