<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">DeckTalk</title>
  <desc id="d">Three slides cross-fade while a narration line lights up word by word under a moving playhead.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .word { font: 600 34px "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b9c2cf; }
      .mark { font: 800 64px "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b0f14; letter-spacing: -2px; }
      .sub { font: 500 22px "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5b6573; }
      .card { fill: #ffffff; stroke: #e3e7ee; stroke-width: 2; }
      .line { fill: #d5dbe5; }
      .accent { fill: #1f9d55; }
      .axis { stroke: #e3e7ee; stroke-width: 2; }
      /* three slides, one visible at a time, each fading up and sliding 16px */
      .slide { opacity: 0; animation: slide 9s linear infinite; }
      .s2 { animation-delay: 3s; } .s3 { animation-delay: 6s; }
      @keyframes slide {
        0%   { opacity: 0; transform: translateX(16px); }
        4%   { opacity: 1; transform: translateX(0); }
        30%  { opacity: 1; transform: translateX(0); }
        34%  { opacity: 0; transform: translateX(-16px); }
        100% { opacity: 0; transform: translateX(-16px); }
      }
      /* the narration line: words light up as the playhead passes, then reset with the slides */
      .w { animation: lit 9s linear infinite; }
      @keyframes lit { 0% { fill: #b9c2cf; } 100% { fill: #b9c2cf; } }
      .w1 { animation-name: w1; } .w2 { animation-name: w2; } .w3 { animation-name: w3; }
      .w4 { animation-name: w4; } .w5 { animation-name: w5; } .w6 { animation-name: w6; }
      .w7 { animation-name: w7; } .w8 { animation-name: w8; } .w9 { animation-name: w9; }
      @keyframes w1 { 0%,7%  { fill:#b9c2cf } 8%,96%  { fill:#0b0f14 } 100% { fill:#b9c2cf } }
      @keyframes w2 { 0%,15% { fill:#b9c2cf } 16%,96% { fill:#0b0f14 } 100% { fill:#b9c2cf } }
      @keyframes w3 { 0%,25% { fill:#b9c2cf } 26%,96% { fill:#0b0f14 } 100% { fill:#b9c2cf } }
      @keyframes w4 { 0%,36% { fill:#b9c2cf } 37%,96% { fill:#0b0f14 } 100% { fill:#b9c2cf } }
      @keyframes w5 { 0%,44% { fill:#b9c2cf } 45%,96% { fill:#0b0f14 } 100% { fill:#b9c2cf } }
      @keyframes w6 { 0%,55% { fill:#b9c2cf } 56%,96% { fill:#0b0f14 } 100% { fill:#b9c2cf } }
      @keyframes w7 { 0%,65% { fill:#b9c2cf } 66%,96% { fill:#1f9d55 } 100% { fill:#b9c2cf } }
      @keyframes w8 { 0%,74% { fill:#b9c2cf } 75%,96% { fill:#1f9d55 } 100% { fill:#b9c2cf } }
      @keyframes w9 { 0%,84% { fill:#b9c2cf } 85%,96% { fill:#1f9d55 } 100% { fill:#b9c2cf } }
      .head { animation: head 9s linear infinite; }
      @keyframes head { 0% { transform: translateX(0); } 96% { transform: translateX(820px); } 100% { transform: translateX(820px); } }
      .beat { animation: beat 9s linear infinite; }
      @keyframes beat { 0%,7% { opacity: 0 } 8%,9% { opacity: 1 } 10%,15% { opacity: 0 } 16%,17% { opacity: 1 } 18%,25% { opacity:0 } 26%,27% {opacity:1} 28%,36% {opacity:0} 37%,38% {opacity:1} 39%,44% {opacity:0} 45%,46% {opacity:1} 47%,55% {opacity:0} 56%,57% {opacity:1} 58%,65% {opacity:0} 66%,67% {opacity:1} 68%,74% {opacity:0} 75%,76% {opacity:1} 77%,84% {opacity:0} 85%,86% {opacity:1} 87%,100% {opacity:0} }
    </style>
  </defs>
  <rect class="bg" width="1200" height="340" rx="24"/>

  <!-- wordmark -->
  <text class="mark" x="72" y="128">DeckTalk</text>
  <text class="sub" x="74" y="166">Narrated presentations, cut to the word.</text>

  <!-- the slide stack: three cards in the same place, cross-fading -->
  <g transform="translate(780 44)">
    <g class="slide s1">
      <rect class="card" width="348" height="196" rx="16"/>
      <rect class="accent" x="28" y="30" width="120" height="14" rx="7"/>
      <rect class="line" x="28" y="62" width="260" height="10" rx="5"/>
      <rect class="line" x="28" y="84" width="220" height="10" rx="5"/>
      <rect class="line" x="28" y="106" width="240" height="10" rx="5"/>
      <rect class="accent" x="28" y="146" width="72" height="22" rx="11" opacity="0.85"/>
    </g>
    <g class="slide s2">
      <rect class="card" width="348" height="196" rx="16"/>
      <line class="axis" x1="28" y1="150" x2="320" y2="150"/>
      <line class="axis" x1="28" y1="40" x2="28" y2="150"/>
      <path d="M28,142 C90,138 150,110 210,72 S300,40 320,36" fill="none" stroke="#1f9d55" stroke-width="5" stroke-linecap="round"/>
      <rect class="line" x="28" y="166" width="180" height="10" rx="5"/>
    </g>
    <g class="slide s3">
      <rect class="card" width="348" height="196" rx="16"/>
      <rect class="line" x="28" y="34" width="292" height="12" rx="6"/>
      <rect class="accent" x="28" y="70" width="60" height="60" rx="12"/>
      <rect class="line" x="104" y="76" width="200" height="10" rx="5"/>
      <rect class="line" x="104" y="98" width="160" height="10" rx="5"/>
      <rect class="line" x="104" y="120" width="180" height="10" rx="5"/>
      <rect class="line" x="28" y="154" width="120" height="10" rx="5"/>
    </g>
  </g>

  <!-- the narration line and playhead -->
  <g transform="translate(72 296)">
    <line x1="0" y1="-30" x2="1056" y2="-30" stroke="#e3e7ee" stroke-width="2"/>
    <g class="head"><rect x="-1" y="-42" width="2" height="24" fill="#1f9d55"/><circle class="beat" cx="0" cy="-30" r="5" fill="#1f9d55"/></g>
    <text y="0">
      <tspan class="word w w1" x="0">Write</tspan>
      <tspan class="word w w2" dx="12">the</tspan>
      <tspan class="word w w3" dx="12">script.</tspan>
      <tspan class="word w w4" dx="20">Speak</tspan>
      <tspan class="word w w5" dx="12">it.</tspan>
      <tspan class="word w w6" dx="20">Every</tspan>
      <tspan class="word w w7" dx="12">cut</tspan>
      <tspan class="word w w8" dx="12">on</tspan>
      <tspan class="word w w9" dx="12">a word.</tspan>
    </text>
  </g>
</svg>
