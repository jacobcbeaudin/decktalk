<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timing test</title>
<style>
  /* No web fonts, no canvas, no SVG and no transitions: every reveal is a solid block that appears on its frame. */
  html, body { margin: 0; background: #ffffff; color: #0a0a0a; font-family: Arial, sans-serif; }
  body { width: 100vw; height: 100vh; overflow: hidden; }
  #dt-pan > .dt-slide.dt-first { animation: none; }
  .t-title { position: absolute; left: 120px; top: 80px; margin: 0; font: 700 64px/1.1 Arial, sans-serif; }
  .t-block { position: absolute; width: 520px; height: 300px; border-radius: 24px; }
  .t-bar { position: absolute; left: 120px; width: 1680px; height: 180px; border-radius: 24px; }
</style>
</head>
<body>
<script src="decktalk-runtime.js"></script>
<script>
DeckTalk.scene(1, { name: "Blocks", steps: [
  { id: "1.1", hold: 12, cues: { "1.1first": 1, "1.1second": 3, "1.1third": 5, "1.1fourth": 7 }, render: () => `
    <div class="slide">
      <p class="t-title">Blocks</p>
      <div class="t-block" data-cue="1.1first" data-fx="none" style="left: 120px; top: 260px; background: #2c1fea"></div>
      <div class="t-block" data-cue="1.1second" data-fx="none" style="left: 760px; top: 260px; background: #0a0a0a"></div>
      <div class="t-block" data-cue="1.1third" data-fx="none" style="left: 120px; top: 660px; background: #e5484d"></div>
      <div class="t-block" data-cue="1.1fourth" data-fx="none" style="left: 760px; top: 660px; background: #30a46c"></div>
    </div>` },
]});

DeckTalk.scene(2, { name: "Bars", steps: [
  { id: "2.1", hold: 12, cues: { "2.1one": 1, "2.1two": 3, "2.1three": 5 }, render: () => `
    <div class="slide">
      <p class="t-title">Bars</p>
      <div class="t-bar" data-cue="2.1one" data-fx="none" style="top: 260px; background: #2c1fea"></div>
      <div class="t-bar" data-cue="2.1two" data-fx="none" style="top: 500px; background: #0a0a0a"></div>
      <div class="t-bar" data-cue="2.1three" data-fx="none" style="top: 740px; background: #e5484d"></div>
    </div>` },
]});
</script>
</body>
</html>
