<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The landing</title>
<script src="/__decktalk/decktalk-runtime.js"></script>
<script src="voice.js"></script>
<style>
  /* The v3 p1 prototype, the waveform landing, ported to a DeckTalk page. The voice line scrolls under
     a fixed playhead at the speed of speech, drawn every frame from the section second and declared as
     a region, so verify masks it. Each picture lands on its word as a reveal, which verify measures. */
  :root { --bg: #15110e; --text: #f5eee4; --text-2: #c3b7a8; --text-3: #9a8e80; --dim: #6a5f54; --voice: #f2b441; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, sans-serif; }
  body { width: 100vw; height: 100vh; overflow: hidden; }
  #dt-canvas { background: var(--bg); }
  .pane, .outline, .chip, .eyebrow { position: absolute; margin: 0; box-sizing: border-box; }
  .eyebrow { left: 400px; top: 38px; font: 500 20px/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
  .pane { left: 400px; top: 92px; width: 1120px; height: 630px; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .pane img { width: 100%; height: 100%; display: block; }
  .outline { border: 4px solid var(--voice); border-radius: 18px; }
  .chip { top: 600px; height: 84px; padding: 22px 30px; border-radius: 14px; background: var(--voice); color: var(--bg); font: 700 36px/1 ui-sans-serif, system-ui, sans-serif; }
  #voice { position: absolute; left: 0; top: 760px; width: 1920px; height: 300px; }
</style>
</head>
<body>

<div data-scene="1" data-name="The landing">
  <template data-slide="1.1" data-preview-seconds="8" data-describe="a film in its pane, with the voice line scrolling beneath it">
    <p class="eyebrow">Larkbill · 2 · Send</p>
    <div class="pane"><img src="film.jpg" alt=""></div>
    <div class="outline" style="left: 1286px; top: 589px; width: 160px; height: 80px" data-in="click" data-in-style="pop"
         data-describe="the Send button, outlined on its word"></div>
    <div class="chip" style="left: 1560px; top: 120px" data-in="click" data-in-style="rise" data-describe="">Send</div>
    <div class="outline" style="left: 960px; top: 112px; width: 500px; height: 70px" data-in="client" data-in-style="pop"
         data-describe="the client's name, outlined on its word"></div>
    <div class="chip" style="left: 1560px; top: 240px" data-in="client" data-in-style="rise" data-describe="">Client</div>
    <canvas id="voice" width="1920" height="300"></canvas>
  </template>
</div>

<script>
  // The voice line: one hairline every 3 px from the real take's envelope, the section's own words at
  // their seconds, and the cue ticks, scrolling under a fixed playhead at 340 px a second. Everything
  // on it is a function of the section second alone, which is what lets the recorder step it.
  const PX_PER_SECOND = 340, HEAD = 960, MID = 140, AMP = 62;
  let ctx = null;
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  DeckTalk.frame((t) => {
    ctx = ctx || document.getElementById("voice")?.getContext("2d");
    if (!ctx) return;
    const C = { text: css("--text"), text2: css("--text-2"), text3: css("--text-3"), dim: css("--dim"), voice: css("--voice") };
    const cues = Object.entries(DeckTalk.cues).sort((a, b) => a[1] - b[1]);
    const landed = [...cues].reverse().find(([, at]) => t >= at);
    const xOf = (second) => HEAD + (second - t) * PX_PER_SECOND;
    ctx.clearRect(0, 0, 1920, 300);
    for (let x = 0; x < 1920; x += 3) {
      const second = t + (x - HEAD) / PX_PER_SECOND;
      const i = second * VOICE.rate;
      if (i < 0 || i >= VOICE.env.length - 1) continue;
      const e = VOICE.env[Math.floor(i)] + (VOICE.env[Math.floor(i) + 1] - VOICE.env[Math.floor(i)]) * (i % 1);
      const h = Math.max(1.5, Math.pow(e, 0.8) * AMP);
      const lit = landed && second >= landed[1] && second <= landed[1] + 0.6;
      ctx.fillStyle = rgba(lit ? C.voice : x <= HEAD ? C.text2 : C.dim, x <= HEAD || lit ? 0.95 : 0.6);
      ctx.fillRect(x, MID - h, 2, h * 2);
    }
    ctx.font = "500 28px ui-sans-serif, system-ui, sans-serif";
    for (const word of DeckTalk.words) {
      const x = xOf(word.at);
      if (x < -200 || x > 2000) continue;
      ctx.fillStyle = rgba(word.at <= t ? C.text : C.text3, 0.9);
      ctx.fillText(word.word, x, MID + AMP + 64);
    }
    for (const [, at] of cues) {
      const x = xOf(at);
      ctx.fillStyle = rgba(landed && landed[1] === at ? C.voice : C.text3, 0.9);
      ctx.beginPath(); ctx.arc(x, MID - AMP - 18, 5, 0, 7); ctx.fill();
    }
    ctx.fillStyle = rgba(C.text, 0.85);
    ctx.fillRect(HEAD - 1, MID - AMP - 40, 2, AMP * 2 + 80);
  }, { region: "#voice" });
</script>

</body>
</html>
