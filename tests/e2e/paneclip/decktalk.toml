# A film in a pane: a page section plays a clip with its own sound inside a pane it draws around and over.

[project]
name = "paneclip"
script = "script.md"
cues = "cues.json"
build = "build"

[[section]]
number = 1
chapter = "A film in a pane"
page = "deck/index.html"
scene = "1"
record_margin_seconds = 0.3

# The clip the pane plays, made at build time, because a test ships no video.
[[clip]]
file = "deck/clips/tone.mp4"
command = ["{python}", "clips/make_clip", "{out}", "{landings}", "{ffmpeg}", "{fps}"]

[narration]
tail_seconds = 1.0

[voices.narrator]
provider = "elevenlabs"
id = ""
