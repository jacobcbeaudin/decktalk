#:schema https://decktalk.ai/schema/decktalk-1.json
# The pipeline fixture. tests/e2e/test_pipeline.py copies it to tests/out/e2e/pipeline, adds the runtime and
# KaTeX, generates the clip and the beds with ffmpeg, and builds it without voice in about twenty seconds of video.
# Every page is still, and every reveal is a solid block that snaps in on its frame, so a hosted runner
# has almost nothing to draw while a cue lands. The five sections cover a shared chapter, a seam, a
# B-roll clip with dips, a held page with an ambience bed and an equation, and a missing optional clip.

[project]
name = "pipeline"

[video]
preset = "veryfast"

[[section]]
number = 1
chapter = "Blocks"
page = "deck/index.html"
scene = "1"

[[section]]
number = 2
chapter = "Blocks"            # the same chapter as section 1, so the two share one chapter
page = "deck/index.html"
scene = "2"
seamless = true               # scene 2 opens on scene 1's last frame

[[section]]
number = 3
chapter = "B-roll"
clip = "media/broll.mp4"      # generated by the test: 2.5 s of 1280x720 at 30 fps with a tone

[[section]]
number = 4
chapter = "Equation"
page = "deck/index.html"
scene = "3"
hold_seconds = 0.5
ambience = true

[[section]]
number = 5
chapter = "Missing"
clip = "media/missing.mp4"    # never exists, so its slate plays
optional = true
slate_seconds = 1

[transition]
dips = [[2, 3], [3, 4]]

[mix]
music = "media/music.mp3"
music_markers = "media/markers.json"
ambience = "media/ambience.mp3"
ambience_db = -32             # well under the -24 dBFS clicks, so the a/v check still finds each click

[[mix.effects]]
file = "media/tick.mp3"
section = 1
cue = "1.1:second"
db = -30
offset = 0.4                  # outside the click search window of the cued word
caption = "a tick lands"      # the caption files carry the whole soundtrack, not only the speech
