<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipeline fixture</title>
<link rel="stylesheet" href="./katex/katex.min.css">
<script src="./katex/katex.min.js"></script>
<style>
  /* No web fonts, no canvas, no SVG and no transitions: every reveal is a solid block that appears on its frame. */
  html, body { margin: 0; background: #ffffff; color: #0a0a0a; font-family: Arial, sans-serif; }
  body { width: 100vw; height: 100vh; overflow: hidden; }
  #dt-pan > .dt-slide.dt-first { animation: none; }
  .t-title { position: absolute; left: 120px; top: 80px; margin: 0; font: 700 64px/1.1 Arial, sans-serif; }
  .t-block { position: absolute; width: 480px; height: 300px; border-radius: 24px; }
  .t-bar { position: absolute; left: 120px; width: 1680px; height: 180px; border-radius: 24px; }
  .t-card { position: absolute; left: 120px; top: 240px; width: 1680px; height: 360px; border-radius: 24px;
            background: #0a0a0a; color: #ffffff; display: flex; align-items: center; justify-content: center;
            font-size: 96px; }
</style>
</head>
<body>
<script src="decktalk-runtime.js"></script>
<script>
const block = (cue, x, y, color) =>
  `<div class="t-block" ${cue ? `data-cue="${cue}" data-fx="none"` : ""} style="left: ${x}px; top: ${y}px; background: ${color}"></div>`;

// Scene 2 opens on scene 1's last frame. Its title and its three blocks are drawn under the stage as soon as
// the page loads, so the first recorded frame already carries them, whether or not the runtime has mounted
// the step by then. The same layer shows when the step is frozen for a screenshot or a preflight frame.
const query = new URLSearchParams(location.search);
if (query.get("scene") === "2" || (query.get("step") || "").startsWith("2.")) {
  const under = document.createElement("div");
  under.innerHTML = `<p class="t-title">Blocks</p>
    ${block("", 120, 260, "#2c1fea")}${block("", 720, 260, "#0a0a0a")}${block("", 120, 660, "#e5484d")}`;
  document.body.appendChild(under);
}

DeckTalk.scene(1, { name: "Blocks", steps: [
  { id: "1.1", hold: 8, cues: { "1.1first": 1, "1.1second": 3, "1.1third": 5 }, render: () => `
    <div class="slide">
      <p class="t-title">Blocks</p>
      ${block("1.1first", 120, 260, "#2c1fea")}
      ${block("1.1second", 720, 260, "#0a0a0a")}
      ${block("1.1third", 120, 660, "#e5484d")}
    </div>` },
]});

DeckTalk.scene(2, { name: "Blocks", steps: [
  { id: "2.1", hold: 8, cues: { "2.1fourth": 1, "2.1fifth": 3 }, render: () => `
    <div class="slide">
      ${block("2.1fourth", 1320, 260, "#30a46c")}
      ${block("2.1fifth", 720, 660, "#f5a524")}
    </div>` },
]});

DeckTalk.scene(3, { name: "Equation", steps: [
  { id: "3.1", hold: 8, cues: { "3.1eq": 1, "3.1bar": 3 }, render: () => `
    <div class="slide">
      <p class="t-title">Equation</p>
      <div class="t-card" data-cue="3.1eq" data-fx="none">
        <span data-tex="\\int_0^1 x^2 \\, dx = \\frac{1}{3}" data-display>the integral of x squared from zero to one is one third</span>
      </div>
      <div class="t-bar" data-cue="3.1bar" data-fx="none" style="top: 700px; background: #2c1fea"></div>
    </div>` },
]});
</script>
</body>
</html>
