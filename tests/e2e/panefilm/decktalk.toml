# A DeckTalk film in a pane: the film in film/, built at build time by the [[clip]] below, plays in a pane of
# this project's one page section.

[project]
name = "panefilm"
script = "script.md"
cues = "cues.json"
build = "build"

[[section]]
number = 1
chapter = "A built film in a pane"
page = "deck/index.html"
scene = "1"
tail_seconds = 5.0

[[clip]]
file = "deck/clips/film.mp4"
command = ["{python}", "deck/make_film", "{out}", "{landings}", "{words}"]

[output]
captioned = true

[voices.narrator]
provider = "elevenlabs"
id = ""
