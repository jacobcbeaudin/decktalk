<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>

<!-- The runtime is the only script this page needs. Every reveal below is an attribute, and the one
     handler at the foot of the file is there to show what a handler is for. -->
<script src="./decktalk-runtime.js"></script>

<style>
  /* Bundled OFL fonts (deck/fonts/), so a recorder with no network never falls back to Helvetica. */
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 100 900; font-display: block; src: url("./fonts/InterTight-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: block; src: url("./fonts/Inter-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: block; src: url("./fonts/JetBrainsMono-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  /* Tokens. The accent belongs only to labels and to the thing being revealed right now. */
  :root {
    --ground: #ffffff; --ink: #0a0a0a; --mute: #71717a; --hair: #e4e4e7;
    --block: #f4f4f5; --accent: #2c1fea; --good: #22c55e; --set-aside: #52525b;
    --sans: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --tight: "Inter Tight", "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { width: 100vw; height: 100vh; overflow: hidden; }
  #dt-stage { background: var(--ground); }

  /* Everything is placed absolutely on the 1920 by 1080 stage, so one reveal never moves another.
     Every revealed shape is filled rather than outlined, because `decktalk check` compares frames on
     brightness alone and a thin outline changes too few pixels to be seen. */
  .l-eyebrow, .l-head, .l-card, .l-pill, .l-strip, .l-row, .l-meter, .l-hill, .l-steps, .l-slider, .l-grid {
    position: absolute; margin: 0; box-sizing: border-box;
  }
  .l-eyebrow { left: 120px; top: 76px; font: 600 24px/32px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  .l-head { left: 120px; top: 150px; width: 1680px; font: 600 88px/1.08 var(--tight); letter-spacing: -.03em; }
  .l-head .l-rule { margin-top: 24px; width: 820px; height: 12px; background: var(--accent); }

  .l-card { padding: 30px 38px; border-radius: 20px; background: var(--ink); color: #fff; font: 500 44px/56px var(--sans); }
  .l-card .l-k { font: 600 26px/34px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #a9a9ff; }
  .l-card.grey { background: var(--mute); }
  .l-card.grey .l-k { color: #e4e4e7; }

  .l-pill { padding: 22px 44px; border-radius: 999px; background: var(--accent); color: #fff; font: 700 56px/1.1 var(--tight); }
  .l-strip { left: 120px; width: 1680px; padding: 28px 40px; border-radius: 18px; background: var(--ink); color: #fff; font: 600 50px/60px var(--sans); }

  /* Scene 1.1: four examples, arriving one after another from a single cue. */
  .l-row { display: flex; gap: 24px; }
  .l-tile { width: 372px; height: 260px; border-radius: 20px; background: var(--block); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .l-tile .l-face { width: 150px; height: 150px; border-radius: 24px; background: var(--accent); }
  .l-tile .l-word { font: 600 34px/40px var(--sans); color: var(--mute); }

  /* Scene 1.2: the loop, the knobs, the guess and the meter. */
  .l-step { list-style: none; margin: 0 0 18px 0; padding: 22px 34px; width: 900px; border-radius: 16px; background: var(--ink); color: #fff; font: 500 42px/52px var(--sans); }
  .l-knobs { position: absolute; left: 1120px; top: 320px; display: flex; gap: 28px; }
  .l-knob { width: 120px; height: 120px; border-radius: 999px; border: 12px solid var(--ink); }
  .l-meter { left: 1120px; top: 740px; width: 680px; height: 90px; border-radius: 12px; background: var(--accent); }

  /* The guess card is the one place this deck hands its own stylesheet a change at a cue, which is
     what data-class is for. The transition below is the span the runtime measures, and the reduced
     render drops it, or the page earns PAGE_CLASS_NOT_REDUCED. */
  .l-guess { position: absolute; left: 1120px; top: 490px; width: 680px; padding: 30px 38px; border-radius: 20px;
             background: var(--block); font: 700 72px/1.1 var(--mono);
             transition: background-color .2s ease, color .2s ease; }
  .l-guess.stale { background: var(--set-aside); color: var(--hair); }
  .l-guess.live { background: var(--good); color: #052e16; }
  :where(.dt-reduced) .l-guess { transition-duration: 0s; }

  /* Scene 1.4: the error as a hill, and the steps down it. */
  .l-hill { left: 120px; top: 340px; width: 1120px; height: 400px; background: var(--mute);
           clip-path: path("M0,0 C240,120 520,330 1120,400 L1120,400 L0,400 Z"); }
  .l-mark { position: absolute; left: 130px; top: 300px; width: 130px; height: 130px; border-radius: 999px; background: var(--accent); }
  .l-steps { left: 1320px; top: 340px; display: flex; flex-direction: column; gap: 18px; width: 480px; }
  .l-steps span { display: block; height: 96px; border-radius: 12px; background: var(--ink); }

  /* Scene 1.5: one slider, whose thumb the page's own handler moves. */
  .l-slider { left: 120px; top: 520px; width: 1680px; height: 40px; border-radius: 999px; background: var(--block); }
  .l-thumb { position: absolute; top: -60px; left: 760px; width: 160px; height: 160px; border-radius: 999px; background: var(--accent); }

  /* Scene 1.6: the knobs as a grid of numbers. */
  .l-grid { left: 120px; top: 380px; display: grid; grid-template-columns: repeat(4, 200px); gap: 16px; }
  .l-grid b { display: block; height: 120px; border-radius: 14px; background: var(--ink); color: #fff; font: 600 48px/120px var(--mono); text-align: center; }
</style>
</head>

<body>

<!-- One scene, six slides, and every reveal written as an attribute. A moment is the local name of a
     cue, so data-in="guess" inside <template data-slide="1.2"> is the cue 1.2:guess that cues.json
     gives a spoken phrase. Nothing here writes a second. -->

<div data-scene="1" data-name="How a model learns">

  <template data-slide="1.1" data-hold="18" data-describe="examples in place of rules, which is machine learning">
    <p class="l-eyebrow">How a model learns</p>

    <div class="l-head" data-in="question" data-describe="the question, how does a model learn">
      How does a model learn?
      <div class="l-rule"></div>
    </div>

    <!-- data-stagger spreads one cue over a container's children. The whole spread is the step times
         the children after the first, plus the entrance, and it has to stay under half a second or
         the cue can no longer be measured, which is what PAGE_STAGGER_OVERRUN names. -->
    <div class="l-row" style="left: 120px; top: 420px" data-in="examples" data-in-style="fade" data-stagger="0.04"
         data-describe="four examples, each a picture and the word that goes with it">
      <div class="l-tile"><span class="l-face"></span><span class="l-word">cat</span></div>
      <div class="l-tile"><span class="l-face"></span><span class="l-word">dog</span></div>
      <div class="l-tile"><span class="l-face"></span><span class="l-word">bird</span></div>
      <div class="l-tile"><span class="l-face"></span><span class="l-word">fish</span></div>
    </div>

    <!-- The rules card arrives, and it leaves again on the cue that names what is left. -->
    <div class="l-card" style="left: 120px; top: 700px; width: 1120px" data-in="rules" data-out="name"
         data-describe="a card of rules written out by hand"
         data-describe-out="the hand-written rules drop away">
      <div class="l-k">the other way</div>
      rules a person writes out by hand
    </div>

    <p class="l-pill" style="left: 120px; top: 740px" data-in="name" data-in-style="pop"
       data-describe="the term, machine learning">machine learning</p>
  </template>

  <template data-slide="1.2" data-hold="22" data-describe="the loop a model learns by, one example at a time">
    <p class="l-eyebrow">The loop</p>

    <div class="l-head" data-in="box" data-describe="the heading, a model is a box of knobs">
      A box of knobs.
      <div class="l-rule"></div>
    </div>

    <div class="l-knobs">
      <span class="l-knob"></span><span class="l-knob"></span><span class="l-knob"></span>
    </div>

    <!-- data-steps turns a list into a walk: each child comes to the front as it arrives and the
         ones before it step back, from the cues the children already declare. -->
    <ul style="position: absolute; left: 120px; top: 400px; margin: 0; padding: 0" data-steps>
      <li class="l-step" data-in="guess" data-describe="step one, the model guesses">It guesses.</li>
      <li class="l-step" data-in="error" data-describe="step two, a meter shows how wrong the guess was">A meter shows the error.</li>
      <li class="l-step" data-in="nudge" data-describe="step three, learning nudges the knobs">Learning nudges the knobs.</li>
      <li class="l-step" data-in="right" data-describe="step four, the next guess is right">It guesses again, and it is right.</li>
    </ul>

    <!-- data-class hands the page's own stylesheet a change at a cue, and data-describe-class is the
         sentence the transcript prints for it, which is why neither may be written without the other. -->
    <p class="l-guess" data-in="guess"
       data-class="nudge:stale|right:live"
       data-describe-class="nudge:the answer is set aside while the knobs turn|right:the answer turns green, because it now matches the example"
       data-describe="the model's answer for this example">cat</p>

    <div class="l-meter" data-in="error" data-describe="the error meter, filled to how wrong the guess was"></div>
  </template>

  <template data-slide="1.3" data-hold="14" data-describe="why every knob is given a direction at once">
    <p class="l-eyebrow">The direction</p>

    <div class="l-head" data-in="which" data-describe="the question, which way should each knob turn">
      Which way should each knob turn?
      <div class="l-rule"></div>
    </div>

    <div class="l-card grey" style="left: 120px; top: 440px; width: 1680px; height: 220px" data-in="one"
         data-out="instead" data-out-style="fall"
         data-describe="turning one knob at a time, and the billions of tries it would take"
         data-describe-out="the slow way falls away">
      <div class="l-k">one knob at a time</div>
      billions of tries for every step
    </div>

    <!-- data-swaps holds the leaving element in place until its replacement has arrived, so the two
         cards are read as one thing changing rather than as a gap. -->
    <div class="l-card" style="left: 120px; top: 440px; width: 1680px; height: 220px" data-in="instead" data-swaps
         data-describe="one round of maths, giving every knob a direction at once">
      <div class="l-k">every knob at once</div>
      one round of maths, one direction each
    </div>
  </template>

  <!-- data-enter says how a slide replaces the one before it. This one cuts, because the picture
       changes completely and a crossfade would read as a dissolve rather than as a new idea. -->
  <template data-slide="1.4" data-hold="20" data-enter="cut" data-describe="the error drawn as a hill the model walks down">
    <p class="l-eyebrow">Downhill</p>

    <div class="l-head" data-in="hill" data-describe="the heading, picture the error as a hill">
      Picture the error as a hill.
      <div class="l-rule"></div>
    </div>

    <!-- data-in-seconds governs the entrance alone, in steps of one captured frame. -->
    <div class="l-hill" data-in="hill" data-in-style="settle" data-in-seconds="0.44"
         data-describe="the hill, whose height is the error"></div>

    <span class="l-mark" data-in="stands" data-in-style="pop"
          data-describe="a marker where the model stands on the hill"></span>

    <div class="l-steps" data-in="downhill" data-in-style="fade"
         data-describe="the steps downhill, each one shorter than the one before">
      <span style="width: 460px"></span>
      <span style="width: 340px"></span>
      <span style="width: 240px"></span>
      <span style="width: 160px"></span>
    </div>

    <p class="l-pill" style="left: 120px; top: 790px" data-in="gradient" data-in-style="pop"
       data-describe="the term, gradient descent">gradient descent</p>
  </template>

  <!-- data-owns lists the local names of cues no attribute mentions, because a handler serves them.
       It is the one way a slide declares a cue it draws with script of its own. -->
  <template data-slide="1.5" data-hold="14" data-owns="long short" data-describe="one setting, deciding how long each step is">
    <p class="l-eyebrow">The step size</p>

    <div class="l-head" data-in="setting" data-describe="the heading, one setting decides how long each step is">
      One setting decides the step.
      <div class="l-rule"></div>
    </div>

    <div class="l-slider"><span class="l-thumb"></span></div>
  </template>

  <template data-slide="1.6" data-hold="16" data-describe="the knobs as grids of numbers, and the chips that multiply them">
    <p class="l-eyebrow">Inside</p>

    <div class="l-head" data-in="inside" data-describe="the heading, the knobs are grids of numbers">
      The knobs are grids of numbers.
      <div class="l-rule"></div>
    </div>

    <div class="l-grid" data-in="inside" data-in-style="fade" data-describe="a grid of numbers, which is what a layer of knobs is">
      <b>0.4</b><b>-1.0</b><b>1.5</b><b>0.2</b>
      <b>1.0</b><b>0.5</b><b>-0.5</b><b>1.1</b>
      <b>-1.5</b><b>1.0</b><b>0.5</b><b>-0.3</b>
    </div>

    <!-- data-count grows the first number in the text from zero, so the figure the voice says and
         the figure on screen land on the same word. -->
    <p class="l-pill" style="left: 1060px; top: 420px" data-in="billion" data-count="first"
       data-describe="the count of knobs a large model holds">400 billion knobs</p>

    <p class="l-strip" style="top: 800px" data-in="chips"
       data-describe="the closing line, chips multiply whole grids at once">
      Chips multiply whole grids at once.
    </p>
  </template>

</div>

<script>
// Slide 1.5 declares two cues in data-owns and serves them here. A handler takes the wire id, which
// is the slide and the local name, because a handler may be registered anywhere in the deck.
const step = (left) => (slide) => {
  const thumb = slide.querySelector(".l-thumb");
  if (thumb) thumb.style.left = left;
};
DeckTalk.on("1.5:long", step("1500px")).on("1.5:short", step("90px"));
</script>

</body>
</html>
