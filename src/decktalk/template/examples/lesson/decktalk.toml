#:schema https://raw.githubusercontent.com/jacobcbeaudin/decktalk/main/schemas/v1/decktalk.json
# The lesson example: one section, one page and one long scene, written in markup.
# `decktalk init --example lesson DIR` writes it. Run `decktalk schema setting` for every key.

[project]
name = "__NAME__"
script = "script.md"
cues = "cues.json"
build = "build"

[[section]]
number = 1
chapter = "How a model learns"
page = "deck/lesson.html"
scene = "1"
record_margin_seconds = 0.3   # recorded past the narration, so the cut never lands on a frame that was never drawn
hold_seconds = 1.5

[narration]
tail_seconds = 1.3

[voice]
provider = "elevenlabs"
id = ""   # the voice that reads the script, a published name rather than a secret, so commit it
speed = 1.0

[elevenlabs]
dollars_per_1000_characters = 0.30   # what your plan charges, which is what `decktalk check` prices the narration at
stability = 0.55
similarity_boost = 0.75

[transition]
dips = []
dip_seconds = 0.15

[audio]
target_lufs = -16
true_peak_max_dbtp = -1.5
