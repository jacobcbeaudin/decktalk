#:schema https://raw.githubusercontent.com/jacobcbeaudin/decktalk/main/schemas/v1/decktalk.json
# The interview example: a narrator and a guest, three sections, the second a dialogue.
# `decktalk init --example interview DIR` writes it. Run `decktalk schema setting` for every key.

[project]
name = "__NAME__"
script = "script.md"
cues = "cues.json"
build = "build"

[[section]]
number = 1
chapter = "Welcome"
page = "deck/index.html"
scene = "1"

[[section]]
number = 2
chapter = "The interview"
page = "deck/index.html"
scene = "2"

[[section]]
number = 3
chapter = "Close"
page = "deck/index.html"
scene = "3"
hold_seconds = 1.5     # the last frame holds this long after the narration

[narration]
tail_seconds = 1.3  # silence kept after the last word of a section, so a cut breathes
voice = "narrator"  # the default voice, which reads every section no [voice NAME] line names

# One [voices.NAME] table per voice, each with the provider's id of that voice. Both ids are empty
# until you set them, so a build without spending plays a placeholder for every turn.
[voices.narrator]
provider = "elevenlabs"
id = ""   # the narrator's voice id, a published name rather than a secret, so commit it
speed = 1.0

[voices.guest]
provider = "elevenlabs"
id = ""   # the guest's voice id, which DECKTALK_VOICES_GUEST_ID overrides
speed = 1.0

[elevenlabs]   # every ElevenLabs voice's defaults, and what the plan charges
dollars_per_1000_characters = 0.30   # what your plan charges, which is what `decktalk check` prices the narration at
stability = 0.55
similarity_boost = 0.75

[transition]
dips = []
dip_seconds = 0.15

[audio]
target_lufs = -16
true_peak_max_dbtp = -1.5
