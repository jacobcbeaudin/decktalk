# DeckTalk project. Paths are relative to this directory.
# Full reference: https://docs.decktalk.app/concepts/project-file

[project]
name = "__NAME__"
script = "script.md"   # narration, where "## N. Title" sections are the cut points
cues = "cues.json"     # which spoken phrase each visual lands on
build = "build"        # everything generated, and git-ignored

[narration]
min_tail_seconds = 1.3    # silence kept after the last word of a section, so a cut breathes rather than sits.
                          # 1.3 at -35 dB leaves at least 0.9 s under -45 dB in the loudness-normalized video.

[voice]
# model = "eleven_multilingual_v2"   # the tool's default, which you can override per project here
stability = 0.55
similarity_boost = 0.75
style = 0.0
speaker_boost = true
speed = 1.0

# One [[section]] per "## N." section of the script, in order. A section is either a
# `page` (an HTML scene recorded and cut to the narration) or a `clip` (your own video
# with its own audio, where a titled slate plays if the file is missing).

# To open with a clip of your own, put the video at media/open.mp4, remove the leading
# "# " from the five lines below, add a "## 0. On camera" heading above section 1 in
# script.md, and set dips = [[0, 1]] under [transition] so the cut out of the clip dips
# to black.
# [[section]]
# number = 0
# title = "On camera"
# clip = "media/open.mp4"
# slate_seconds = 6       # a titled slate plays for this long when the file is missing

[[section]]
number = 1
title = "Open"
page = "deck/index.html"
scene = 1
extra_seconds = 0.3     # recorded past the narration, so the cut never lands on a frame that was never drawn

[[section]]
number = 2
title = "How it works"
page = "deck/index.html"
scene = 2

[[section]]
number = 3
title = "How AI learns"
page = "deck/lesson.html"   # any page in deck/ can hold scenes, and each section names its page
scene = 3

# The edit steps out of the presentation: a page, the BEFORE clip, a page, the AFTER clip, and a page. Sections
# 4 to 8 all carry the title "The edit", so they share one chapter.
#
# The scaffold ships no clip files, because a clip carries a real voice. Both clip sections are optional, so a
# fresh build plays a titled slate in each and still passes --strict. The pages around them show stills of the
# demo video from deck/edit/, which match this scaffold's Open and lesson. After you voice the video, cut each
# clip from your own build: the page's last frame, with the Open playing in the player's video area at 384, 72,
# 1152 by 648. Write its words file, so the speech inside it gets captions. Then delete `optional`.
# https://docs.decktalk.app/guides/clip-section#fill-the-edits-two-clips has the commands.

[[section]]
number = 4
title = "The edit"
page = "deck/index.html"
scene = 4               # step out: the lesson shrinks into a player, then back to the start
ambience = false        # true plays the ambience bed under this section

[[section]]
number = 5
title = "The edit"
clip = "media/edit-before.mov"          # BEFORE: the Open as first built, inside the player
words = "media/edit-before.words.json"  # the words spoken inside the clip, for the captions
slate_seconds = 4.36    # the demo's BEFORE clip is 4.36 s, so the slate keeps its timing
optional = true         # plays the slate under --strict until the clip is in place

[[section]]
number = 6
title = "The edit"
page = "deck/index.html"
scene = 6               # one word and one cue line, the build, and the new start

[[section]]
number = 7
title = "The edit"
clip = "media/edit-after.mov"           # AFTER: the Open rebuilt with one more count, inside the player
words = "media/edit-after.words.json"   # the words spoken inside the clip, for the captions
slate_seconds = 5.04    # the demo's AFTER clip is 5.04 s
optional = true

[[section]]
number = 8
title = "The edit"
page = "deck/index.html"
scene = 7               # before and after, the check, and the step back in. A scene keeps its number in its page
                        # when the section numbers around it change, so section 8 plays scene 7.

[[section]]
number = 9
title = "Close"
page = "deck/index.html"
scene = 5
extra_seconds = 2
hold_seconds = 2.5       # the last frame holds after the narration. Any page section can hold, and lead_seconds
                         # adds silence before a section's first word.

[transition]
dips = []               # boundaries that dip to black, as [from, to] pairs. Omit the key to dip at every cut.
dip_seconds = 0.15
page_fades_in = true    # pages fade themselves up, so no fade-in is added on their side

[mix]
# Voice only. To add a music bed, run `decktalk soundscape` with [soundscape.music] below uncommented,
# then uncomment `underscore` here. `ambience` works the same way with [soundscape.ambience].
# underscore = "build/music/underscore.mp3"
underscore_db = -24
underscore_duck_db = -6    # under speech
underscore_fade_in = 2
underscore_fade_out = 3
markers = "media/markers.json"
# ambience = "build/sfx/ambience.mp3"
ambience_db = -20
# [[mix.sfx]]
# file = "build/sfx/tick.mp3"
# section = 1
# cue = "1.1one"
# db = -16

[mix.loudnorm]
I = -16
TP = -1.5
LRA = 11

# Commented out so no `decktalk soundscape` run spends music credits by accident.
# [soundscape.music]
# prompt = "calm, minimal instrumental underscore for a lesson: soft piano and warm pads, slow, no drums, no melody hooks, unobtrusive under a narrator"
# seconds = 120
# force_instrumental = true

# [soundscape.ambience]
# text = "quiet lecture hall room tone, distant HVAC, no voices, steady"
# duration_seconds = 25

# [soundscape.sfx.tick]
# text = "soft interface click, single, short, no reverb"

# Tool tuning lives in tables named after the settings sections and can also be set
# with DECKTALK_<TABLE>_<FIELD> environment variables. Examples:
# [video]
# preset = "veryfast"     # faster drafts
# [record]
# settle_seconds = 0.5
