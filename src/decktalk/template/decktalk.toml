# DeckTalk project. Paths are relative to this directory.
# Full reference: https://docs.decktalk.app/concepts/project-file

[project]
name = "__NAME__"
script = "script.md"   # narration, where "## N. Title" sections are the cut points
cues = "cues.json"     # which spoken phrase each visual lands on
build = "build"        # everything generated, and git-ignored

[voice]
# model = "eleven_multilingual_v2"   # the tool's default, which you can override per project here
stability = 0.55
similarity_boost = 0.75
style = 0.0
speaker_boost = true
speed = 1.0

# One [[section]] per "## N." section of the script, in order. A section is either a
# `page` (an HTML scene recorded and cut to the narration) or a `clip` (your own video
# with its own audio, where a titled slate plays if the file is missing).

# To open with a clip of your own, put the video at media/open.mp4, remove the leading
# "# " from the five lines below, add a "## 0. On camera" heading above section 1 in
# script.md, and set dips = [[0, 1]] under [transition] so the cut out of the clip dips
# to black.
# [[section]]
# number = 0
# title = "On camera"
# clip = "media/open.mp4"
# slate_seconds = 6       # a titled slate plays for this long when the file is missing

[[section]]
number = 1
title = "Open"
page = "deck/index.html"
scene = 1
extra_seconds = 0.3     # recorded past the narration, so the cut never lands on a frame that was never drawn

[[section]]
number = 2
title = "Three lines"
page = "deck/index.html"
scene = 2

[[section]]
number = 3
title = "Gradient descent"
page = "deck/index.html"
scene = 3

[[section]]
number = 4
title = "Before and after"
page = "deck/index.html"
scene = 4
ambience = false        # true plays the ambience bed under this section

[[section]]
number = 5
title = "Close"
page = "deck/index.html"
scene = 5
extra_seconds = 2
hold_seconds = 2        # allowed only on the last page section

[transition]
dips = []               # boundaries that dip to black, as [from, to] pairs. Omit the key to dip at every cut.
dip_seconds = 0.15
page_fades_in = true    # pages fade themselves up, so no fade-in is added on their side

[mix]
underscore = "build/music/underscore.mp3"
underscore_db = -24
underscore_duck_db = -6    # under speech
underscore_fade_in = 2
underscore_fade_out = 3
markers = "media/markers.json"
ambience = "build/sfx/ambience.mp3"
ambience_db = -20
# [[mix.sfx]]
# file = "build/sfx/tick.mp3"
# section = 2
# cue = "2.1d"
# db = -16

[mix.loudnorm]
I = -16
TP = -1.5
LRA = 11

[soundscape.music]
prompt = "calm, minimal instrumental underscore for a lesson: soft piano and warm pads, slow, no drums, no melody hooks, unobtrusive under a narrator"
seconds = 120
force_instrumental = true

# [soundscape.ambience]
# text = "quiet lecture hall room tone, distant HVAC, no voices, steady"
# duration_seconds = 25

# [soundscape.sfx.tick]
# text = "soft interface click, single, short, no reverb"

# Tool tuning lives in tables named after the settings sections and can also be set
# with DECKTALK_<SECTION>_<FIELD> environment variables. Examples:
# [video]
# preset = "veryfast"     # faster drafts
# [record]
# settle_seconds = 0.5
