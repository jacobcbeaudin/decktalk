# DeckTalk project. Paths are relative to this directory.
# Full reference: https://docs.decktalk.ai/reference/decktalk-toml

[project]
name = "__NAME__"
script = "script.md"   # narration, where "## N. Title" sections are the cut points
cues = "cues.json"     # which spoken phrase each visual lands on
build = "build"        # everything generated, and git-ignored

# One [[section]] per "## N." section of the script, in order. A page section records a scene
# of an HTML page. A section can also be a `clip` of your own video: see
# https://docs.decktalk.ai/guides/clip-section

[[section]]
number = 1
chapter = "Open"
page = "deck/index.html"
scene = 1

[[section]]
number = 2
chapter = "How it works"
page = "deck/index.html"
scene = 2

[[section]]
number = 3
chapter = "Close"
page = "deck/index.html"
scene = 3
hold_seconds = 1.5     # the last frame holds this long after the narration

[narration]
min_tail_seconds = 1.3  # silence kept after the last word of a section, so a cut breathes

[voice]
# model = "eleven_multilingual_v2"   # the tool's default, which you can override here
price_per_1000_characters = 0.30   # what your plan charges, which is what `narrate --dry-run` prices the run at
stability = 0.55
similarity_boost = 0.75
speed = 1.0

[transition]
dips = []               # boundaries that dip to black, as [from, to] pairs. Omit the key to dip at every cut.
dip_seconds = 0.15

[mix.loudness]
target_lufs = -16
true_peak_db = -1.5

# [output]
# timestamped_copy = true   # keep the previous cut, as a second mp4 named with the date and time

# Tool tuning lives in tables named after the settings sections, and can also be set with
# DECKTALK_<TABLE>_<FIELD> environment variables. https://docs.decktalk.ai/reference/configuration
# [video]
# preset = "veryfast"   # faster drafts
