#:schema https://decktalk.ai/schemas/v1/decktalk.json
# The project file. Every path is relative to this directory, and `decktalk schema settings` prints
# every key this file may carry with its default, its range and its sentence.

[project]
name = "__NAME__"
script = "script.md"   # what the voice says, where "## N. Title" starts section N
cues = "cues.json"     # which spoken phrase each moment on the page lands on
build = "build"        # everything generated, and git-ignored

# One [[section]] per "## N." section of the script, in order. A page section records one scene of
# an HTML page. A section can also be a `clip` of your own video, which names a file instead.

[[section]]
number = 1
chapter = "Open"
page = "deck/index.html"
scene = "1"

[[section]]
number = 2
chapter = "How it works"
page = "deck/index.html"
scene = "2"

[[section]]
number = 3
chapter = "Close"
page = "deck/index.html"
scene = "3"
hold_seconds = 1.5     # the last frame holds this long after the narration

[narration]
tail_min_seconds = 1.3  # silence kept after the last word of a section, so a cut breathes

[voice]
provider = "elevenlabs"
price_per_1000_characters = 0.30   # what your plan charges, which is what `decktalk check` prices a run at
stability = 0.55
similarity_boost = 0.75
speed = 1.0

[transition]
dips = []               # boundaries that dip to black, as [from, to] pairs. Omit the key to dip at every cut.
dip_seconds = 0.15

[mix.loudness]
target_lufs = -16
true_peak_max_dbtp = -1.5

# [output]
# timestamped_copy = true   # keep the previous cut, as a second mp4 named with the date and time

# Every other knob is a settings key. Run `decktalk config list` to see them with their layers, and
# `decktalk config explain video.crf` for one of them.
# [video]
# preset = "veryfast"   # faster drafts
