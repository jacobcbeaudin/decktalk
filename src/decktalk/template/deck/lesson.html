<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How AI learns</title>
<style>
  /* Bundled OFL fonts (deck/fonts/), so a recorder with no network never falls back to Helvetica. */
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 100 900; font-display: block; src: url("./fonts/InterTight-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: block; src: url("./fonts/Inter-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: block; src: url("./fonts/JetBrainsMono-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  /* Tokens. The accent belongs only to labels and to the thing being revealed right now. */
  :root {
    --ground: #ffffff; --ink: #0a0a0a; --mute: #71717a; --dim: #a3a3ad; --hair: #e4e4e7; --block: #f4f4f5; --accent: #2c1fea;
    --sans: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --tight: "Inter Tight", "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { width: 100vw; height: 100vh; overflow: hidden; }
  #dt-stage { background: var(--ground); }

  /* The lesson figure lives in the stage, under the runtime's slide layer, and is built before
     narration t=0. The slides themselves are empty, so nothing heavy is created or painted on a cue. */
  #rig, #rig .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #rig .layer { transform-origin: 0 0; }
  #rig .gpu { will-change: transform, opacity; }
  #rig svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #rig .full { width: 1920px; height: 1080px; }
  #rig .off { visibility: hidden !important; }
  #rig .abs { position: absolute; }

  /* Chrome */
  .eyebrow { position: absolute; left: 120px; top: 44px; margin: 0; font: 500 22px/28px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .title { position: absolute; left: 120px; top: 92px; margin: 0; font: 600 64px/1.1 var(--tight); letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
  .caption { position: absolute; left: 120px; top: 184px; margin: 0; font: 500 44px/1.2 var(--sans); color: var(--ink); white-space: nowrap; }
  .footer { position: absolute; left: 120px; right: 120px; top: 984px; height: 30px; display: flex; align-items: center; justify-content: space-between; }
  .footer .brand, .footer .track { display: flex; align-items: center; gap: 14px; font: 500 22px/28px var(--mono); letter-spacing: .14em; color: var(--mute); }
  .footer .mark line { stroke: var(--hair); stroke-width: 2.25; stroke-linecap: round; }
  .footer .mark .tall { stroke: var(--accent); }
  .footer .mark circle { fill: var(--accent); }
  .footer .ticks rect { fill: var(--hair); }
  .footer .ticks .cur { fill: var(--ink); }

  /* Pills: text labels are HTML, so no text is measured in script. */
  .pill { position: absolute; display: inline-block; white-space: nowrap; padding: 0 16px; border-radius: 10px; font: 500 30px/48px var(--sans); color: #fff; background: var(--ink); }
  .pill.acc { background: var(--accent); }
  .pill.mono { font-family: var(--mono); font-weight: 600; }
  .pill.big { font: 600 60px/100px var(--tight); padding: 0 30px; border-radius: 16px; }
  .ctr { transform: translateX(-50%); }

  /* Scene 3.1: rules, example tiles, the knob box and the meter */
  .rules { position: absolute; left: 120px; top: 250px; width: 560px; height: 300px; border-radius: 16px; background: var(--block); padding: 30px 32px; box-sizing: border-box; font: 500 30px/56px var(--mono); color: var(--ink); }
  .rules .h { font-size: 24px; line-height: 36px; color: var(--mute); }
  .tile { position: absolute; box-sizing: border-box; border: 5px solid var(--ink); border-radius: 18px; background: #fff; }
  #rig .tile svg.art { left: 14px; top: 8px; }
  .tile .lab { position: absolute; left: 14px; bottom: 12px; display: flex; align-items: center; gap: 22px; }
  .tile .lab .pill { position: static; }
  .tile .lab .ok-mark { display: none; }
  .tile.truth .lab .pill { box-shadow: 0 0 0 5px #fff, 0 0 0 10px var(--accent); }
  .tile.truth .lab .ok-mark { display: block; }
  .art path, .art ellipse, .art circle { fill: #fff; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .art .ln { fill: none; }
  .art .thin { fill: none; stroke-width: 4.5; }
  .art .dot { fill: var(--ink); stroke: none; }
  .boxlab { position: absolute; left: 560px; top: 280px; font: 600 38px/1 var(--tight); color: var(--ink); }
  .ans { position: absolute; left: 1340px; top: 505px; display: flex; align-items: center; gap: 20px; }
  .ans .pill { position: static; font-size: 36px; line-height: 66px; padding: 0 20px; border-radius: 12px; }
  .meter { position: absolute; left: 1660px; top: 300px; width: 74px; height: 340px; box-sizing: border-box; border: 5px solid var(--ink); border-radius: 12px; background: #fff; }
  .meter .fill { position: absolute; left: 5px; right: 5px; bottom: 5px; height: 320px; border-radius: 6px; background: var(--accent); transform-origin: 50% 100%; }
  .meter .tick { position: absolute; left: -22px; width: 108px; height: 5px; margin-bottom: -2px; background: var(--mute); }
  .counter { position: absolute; left: 580px; top: 762px; width: 760px; display: flex; align-items: center; justify-content: center; gap: 16px; font: 500 36px/1 var(--sans); color: var(--mute); }
  .counter b { font: 500 42px/64px var(--mono); color: var(--ink); background: var(--block); border: 4px solid var(--ink); border-radius: 12px; padding: 0 18px; }
  .counter.dim { opacity: .35; }

  /* Scenes 3.3 to 3.6: the floor, the bowl, the haze, and the landscape */
  .kmark { position: absolute; display: flex; align-items: center; gap: 10px; }
  .kmark .pill { position: static; }
  .kmark svg { position: static !important; }
  #haze { position: absolute; left: -1600px; top: -1600px; width: 3200px; height: 3200px; opacity: .01; will-change: transform, opacity; }
  #haze canvas { width: 3200px; height: 3200px; display: block; }
  #ring { position: absolute; left: -200px; top: -200px; width: 400px; height: 400px; box-sizing: border-box; border-radius: 50%; border: 3px dashed var(--ink); will-change: transform; }
  #ball { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px #fff; will-change: transform; }
  /* The step-size runs: a hollow ink ring, so it never reads as the main (solid accent) ball. */
  .ghost { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; border: 7px solid var(--ink); box-shadow: 0 0 0 3px #fff, inset 0 0 0 3px #fff; will-change: transform, opacity; }
  .slider-lab { position: absolute; left: 1530px; top: 300px; font: 500 32px/1 var(--sans); color: var(--mute); }

  /* Scenes 3.7 and 3.8 */
  .chat { position: absolute; left: 1060px; top: 220px; width: 740px; height: 370px; box-sizing: border-box; border: 5px solid var(--ink); border-radius: 26px; background: #fff; }
  .chat .q { position: absolute; right: 26px; top: 26px; padding: 0 24px; border-radius: 20px; background: var(--accent); color: #fff; font: 500 30px/64px var(--sans); white-space: nowrap; }
  .chat .a { position: absolute; left: 26px; top: 116px; width: 520px; height: 140px; border-radius: 20px; background: var(--block); }
  .chat .a i { position: absolute; left: 28px; height: 18px; border-radius: 9px; background: var(--dim); }
  .chat .in { position: absolute; left: 26px; right: 26px; bottom: 24px; height: 56px; box-sizing: border-box; border: 3px solid var(--hair); border-radius: 28px; padding-left: 28px; font: 400 26px/50px var(--sans); color: var(--mute); }

  /* 3.8out: a white sheet over the figure, under the eyebrow and footer, so the edit can open on white. */
  #rig .whiteout { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--ground); opacity: 0; }

  /* Freeze mode shows every end state at once. */
  .dt-frozen #rig *, .dt-frozen #rig { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<div id="dt-stage"><div id="rig"></div></div>
<script src="decktalk-runtime.js"></script>
<script>
"use strict";
// Scene 3 of the demo: "How AI learns". One scene, eight steps (3.1 to 3.8), one cue per stressed word.
//
// How this page differs from deck/index.html: the whole lesson is one figure that carries its state
// from the first cue to the last (the meter becomes the height axis, the bowl zooms out into the
// landscape, the landscape shrinks beside the chips). So the figure is built once, here, into
// #dt-stage under the runtime's slide layer, before narration t=0. Each step's slide is empty, and
// every cue only toggles or moves what already exists, so no cue creates DOM or paints a large
// layer for the first time. CUE[id](animate) holds each cue's change. With animate false (freeze
// mode) it shows the end state at once, and a frozen step first replays every earlier cue.
//
// Every picture is computed from a formula at load: the bowl is error = 0.5·knob1² + 1.5·knob2²,
// the paths are real gradient descent (knob ← knob − step size × slope), and the zoom-out landscape
// and its three walks use the same rule. Nothing is placed by hand.

// ---- Constants a fill script or an editor may change -------------------------------------------
// The two example classes. Swap the pair by editing these labels and the drawings in ANIMALS below.
const LABEL_A = "seal", LABEL_B = "otter";
const WRONG_GUESS = LABEL_B;                  // what the model answers for the first input
const METER_LABEL = "error";                  // the meter's label, which later names the height axis
// The four example tiles, in reading order: [drawing id, label].
const EXAMPLES = [["otterFloat", LABEL_B], ["sealRock", LABEL_A], ["sealSwim", LABEL_A], ["otterStand", LABEL_B]];
const FIRST_INPUT = ["sealRock", LABEL_A];    // the input on "box of knobs"
const NEXT_INPUT = ["otterStand", LABEL_B];   // the different animal on "example after example"
const STEP_MAIN = 0.25, STEP_LONG = 0.65, STEP_SHORT = 0.03; // step sizes: main path, too long, too short
const START = [-2.2, -1.05];                  // where the ball starts, on the wall facing the camera
const SECTION_NUMBER = 3, SECTIONS_TOTAL = 5; // the footer's "03 / 05" tracker, which matches index.html

// ---- Palette -------------------------------------------------------------------------------------
const INK = "#0a0a0a", ACC = "#2c1fea", MUTE = "#71717a", DIM = "#a3a3ad", HAIR = "#e4e4e7",
  BLOCK = "#f4f4f5", FLOORC = "#fafafa", GREY = "#b4b4bb";
const fx = (v) => (+v).toFixed(1);
const clamp01 = (k) => Math.min(1, Math.max(0, k));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---- Drawings: the example animals ------------------------------------------------------------------
// Black line art in one rounded stroke, white inside, ink only for eyes, noses, and spots. Each is a
// symbol in a 240 by 180 box, so a tile of any size can show it. Otters always show small round ears,
// paws, and a furry tail. Seals never have ears or paws; they have flippers and a spotted coat.
const WAVE = (x, y) => `<path class="ln" d="M${x} ${y}q7 -7 14 0t14 0t14 0"/>`;
const ANIMALS = {
  // Otter 1: floating on its back in the water, holding a shell on its chest with both paws.
  otterFloat: WAVE(14, 30) + WAVE(26, 50) + WAVE(168, 158) + WAVE(142, 172) +
    `<path d="M72 112C52 116 28 122 12 118C5 114 9 105 18 104C36 103 52 100 74 96Z"/>` +
    `<path class="thin" d="M30 106l-3 8M44 104l-3 8M58 102l-3 8"/>` +
    `<path d="M80 102C74 88 80 78 89 80C97 82 97 94 93 104"/>` +
    `<ellipse cx="128" cy="112" rx="64" ry="30" transform="rotate(-8 128 112)"/>` +
    `<path class="thin" d="M100 126q16 7 34 2"/>` +
    `<circle cx="168" cy="62" r="7"/><circle cx="216" cy="62" r="7"/><ellipse cx="192" cy="80" rx="32" ry="25"/>` +
    `<circle class="dot" cx="180" cy="76" r="4.5"/><circle class="dot" cx="204" cy="76" r="4.5"/>` +
    `<ellipse class="dot" cx="192" cy="86" rx="6" ry="4.5"/><path class="thin" d="M186 94q6 5 12 0M162 84l-14 -3M162 91l-14 3M222 84l14 -3M222 91l14 3"/>` +
    `<path d="M118 86C116 58 164 58 162 86Q140 96 118 86Z"/><path class="thin" d="M140 90l-12 -22M140 90l0 -26M140 90l12 -22"/>` +
    `<ellipse cx="118" cy="88" rx="10" ry="8"/><ellipse cx="162" cy="88" rx="10" ry="8"/>`,
  // Otter 2: standing upright on a rock, paws together, round ears, a thick furry tail.
  otterStand:
    `<path d="M50 170C52 150 74 140 106 138C140 136 172 140 186 152C193 159 194 166 194 170"/><path class="ln" d="M30 172H214"/>` +
    `<path d="M136 150C168 156 198 150 214 126C220 116 213 108 205 113C193 132 166 140 134 138Z"/>` +
    `<path class="thin" d="M176 142l4 8M194 132l6 6M206 120l7 3"/>` +
    `<path d="M120 58C98 58 91 82 91 106C91 132 100 150 120 150C140 150 149 132 149 106C149 82 142 58 120 58Z"/>` +
    `<ellipse cx="106" cy="149" rx="14" ry="6"/><ellipse cx="134" cy="149" rx="14" ry="6"/>` +
    `<path class="thin" d="M109 124q11 8 22 0"/>` +
    `<circle cx="95" cy="30" r="7"/><circle cx="145" cy="30" r="7"/><ellipse cx="120" cy="46" rx="31" ry="24"/>` +
    `<circle class="dot" cx="108" cy="42" r="4.5"/><circle class="dot" cx="132" cy="42" r="4.5"/>` +
    `<ellipse class="dot" cx="120" cy="52" rx="6" ry="4.5"/><path class="thin" d="M114 60q6 5 12 0M89 50l-14 -3M89 57l-14 3M151 50l14 -3M151 57l14 3"/>` +
    `<ellipse cx="111" cy="90" rx="10" ry="8"/><ellipse cx="129" cy="90" rx="10" ry="8"/>`,
  // Seal 1: lying on a rock, head raised, front flipper out, spotted coat, no ears.
  sealRock:
    `<path d="M20 172C22 150 44 136 80 134C130 130 180 132 206 144C223 152 226 164 226 172"/><path class="ln" d="M10 174H236"/>` +
    `<path d="M46 120C32 114 20 106 10 108C8 116 16 125 32 128Z"/><path d="M46 125C34 131 22 141 18 149C26 153 36 145 48 131Z"/>` +
    `<path d="M40 124C60 104 104 102 140 104C160 105 170 96 176 78C182 60 196 50 210 54C226 58 232 74 226 88C220 104 204 118 184 126C150 138 80 140 40 124Z"/>` +
    `<path d="M166 124C168 142 182 152 198 154C206 153 205 146 197 142C189 136 185 128 185 121Z"/>` +
    `<circle class="dot" cx="208" cy="70" r="4.5"/><ellipse class="dot" cx="227" cy="79" rx="4" ry="3.5"/>` +
    `<path class="thin" d="M224 90q-6 4 -12 1M218 84l16 7M216 88l12 9"/>` +
    [[74, 120, 4.5], [96, 112, 3.5], [110, 126, 3], [128, 114, 4.5], [148, 124, 3.5], [162, 106, 4], [58, 126, 3]].map(([x, y, r]) => `<circle class="dot" cx="${x}" cy="${y}" r="${r}"/>`).join(""),
  // Seal 2: swimming sideways, smooth teardrop body, rear flippers spread, spotted coat.
  sealSwim: WAVE(20, 36) + WAVE(176, 30) + WAVE(158, 162) + WAVE(34, 156) +
    `<path d="M58 92C44 84 28 70 14 64C8 76 14 90 30 96Z"/><path d="M58 96C44 104 28 118 14 124C8 112 14 100 30 94Z"/>` +
    `<path d="M50 94C80 66 140 60 180 66C210 70 224 84 224 96C224 110 208 122 178 124C138 128 80 122 50 94Z"/>` +
    `<path d="M148 118C140 134 126 144 108 148C104 142 112 134 122 128C130 122 134 116 136 112Z"/>` +
    `<circle class="dot" cx="200" cy="86" r="4.5"/><ellipse class="dot" cx="222" cy="94" rx="4" ry="3.5"/>` +
    `<path class="thin" d="M218 104q-6 3 -12 0M214 98l18 -4M214 102l18 4"/>` +
    [[92, 90, 4], [114, 80, 3.5], [124, 100, 4.5], [146, 86, 3], [162, 104, 4], [178, 82, 3], [80, 102, 3]].map(([x, y, r]) => `<circle class="dot" cx="${x}" cy="${y}" r="${r}"/>`).join(""),
};

// ---- Small SVG helpers ---------------------------------------------------------------------------------
function arrow(x1, y1, x2, y2, o = {}) {
  const { stroke = INK, w = 6 } = o, head = o.head ?? w * 2.8;
  const a = Math.atan2(y2 - y1, x2 - x1), c = Math.cos(a), s = Math.sin(a);
  const bx = x2 - c * head, by = y2 - s * head, px = -s * head * 0.6, py = c * head * 0.6;
  return `<g${o.cls ? ` class="${o.cls}"` : ""}><line x1="${fx(x1)}" y1="${fx(y1)}" x2="${fx(bx + c * 2)}" y2="${fx(by + s * 2)}" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"/><path d="M${fx(x2)} ${fx(y2)}L${fx(bx + px)} ${fx(by + py)}L${fx(bx - px)} ${fx(by - py)}Z" fill="${stroke}"/></g>`;
}
const polyPts = (pts) => pts.map((p) => fx(p[0]) + "," + fx(p[1])).join(" ");
const line = (p, q, stroke, w, extra = "") => `<line x1="${fx(p[0])}" y1="${fx(p[1])}" x2="${fx(q[0])}" y2="${fx(q[1])}" stroke="${stroke}" stroke-width="${w}" ${extra}/>`;
const dotG = (x, y, r = 9, c = INK, extra = "") => `<circle cx="${fx(x)}" cy="${fx(y)}" r="${r}" fill="${c}" ${extra}/>`;
const squareG = (x, y, s = 20, c = INK) => `<rect x="${fx(x - s / 2)}" y="${fx(y - s / 2)}" width="${s}" height="${s}" fill="${c}" stroke="#fff" stroke-width="2.5"/>`;
const triG = (x, y, s = 22, c = INK) => `<path d="M${fx(x)} ${fx(y - s * 0.62)}L${fx(x + s * 0.58)} ${fx(y + s * 0.42)}L${fx(x - s * 0.58)} ${fx(y + s * 0.42)}Z" fill="${c}" stroke="#fff" stroke-width="2"/>`;
const checkG = (x, y, c = ACC, k = 1) => `<path d="M${fx(x - 13 * k)} ${fx(y)}L${fx(x - 4 * k)} ${fx(y + 10 * k)}L${fx(x + 14 * k)} ${fx(y - 12 * k)}" fill="none" stroke="${c}" stroke-width="${7 * k}" stroke-linecap="round" stroke-linejoin="round"/>`;
const crossG = (x, y, c = INK, k = 1) => `<path d="M${fx(x - 11 * k)} ${fx(y - 11 * k)}L${fx(x + 11 * k)} ${fx(y + 11 * k)}M${fx(x + 11 * k)} ${fx(y - 11 * k)}L${fx(x - 11 * k)} ${fx(y + 11 * k)}" stroke="${c}" stroke-width="${7 * k}" stroke-linecap="round"/>`;
const markSvg = (inner, w = 40, h = 40) => `<svg class="ok-mark" width="${w}" height="${h}" viewBox="${-w / 2} ${-h / 2} ${w} ${h}" style="position:static;overflow:visible">${inner}</svg>`;
// A knob: a ring, and a pointer that turns about its centre (the pointer is its own element).
function knob(cx, cy, r, deg, o = {}) {
  const { stroke = INK, w = 6, fill = "#fff" } = o;
  return `<g${o.cls ? ` class="${o.cls}"` : ""}><circle cx="${fx(cx)}" cy="${fx(cy)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${w}"/>` +
    `<line class="ptr" x1="${fx(cx)}" y1="${fx(cy)}" x2="${fx(cx)}" y2="${fx(cy - (r - w * 0.4))}" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" transform="rotate(${fx(deg)} ${fx(cx)} ${fx(cy)})"/>` +
    `<circle cx="${fx(cx)}" cy="${fx(cy)}" r="${fx(w * 0.75)}" fill="${stroke}"/></g>`;
}
const setRot = (ptr, deg) => { const x = ptr.getAttribute("x1"), y = ptr.getAttribute("y1"); ptr.setAttribute("transform", `rotate(${fx(deg)} ${x} ${y})`); };

// ---- The bowl and its camera (the storyboard's projection) ------------------------------------------------
const E = 4.5, HK = 0.36, YAW = -0.32, PITCH = 0.95, DP = 16, SC = 130, CX = 960, CY = 570, FA = 3.3, FB = 2.0;
const err = (a, b) => 0.5 * a * a + 1.5 * b * b;
// Gradient descent on the bowl: the slope is (knob1, 3·knob2), and each step moves by step size × slope.
const descend = (eta, n, [a, b] = START) => { const o = [[a, b]]; for (let i = 0; i < n; i++) { a -= eta * a; b -= eta * 3 * b; o.push([a, b]); } return o; };
const MAIN = descend(STEP_MAIN, 7);   // p0..p6 are the six hops of 3.4; p7 is the one hop of 3.8
const LONG = descend(STEP_LONG, 16);  // too long: it overshoots the valley floor on every step
const SHORT = descend(STEP_SHORT, 6); // too short: the same six hops as the main path, barely moving
const rimPt = (th) => [Math.sqrt(2 * E) * Math.cos(th), Math.sqrt((2 * E) / 3) * Math.sin(th)];
function pj(a, b, e) {
  const y = e * HK, cy = Math.cos(YAW), sy = Math.sin(YAW);
  const x1 = cy * a + sy * b, z1 = -sy * a + cy * b;
  const cp = Math.cos(PITCH), sp = Math.sin(PITCH);
  const up = y * cp - z1 * sp, depth = y * sp + z1 * cp, k = DP / (DP - depth);
  return [CX + x1 * SC * k, CY - up * SC * k, depth];
}
const onS = ([a, b]) => pj(a, b, err(a, b));

// Height colour: an OKLab ramp from #8b83f3 at the bottom to #f6f6f9 at the rim, lighter only ever higher.
const s2l = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };

// ---- The frame clock: timed changes after a cue ---------------------------------------------------------------
// run(animate, delay, dur, fn) calls fn(k) with k from 0 to 1 over dur seconds, starting delay seconds

function buildLater() {
  // 3.5 slider, 3.4 label, 3.7 chat and sums, 3.8 tensor, chips, and the two chip blocks.
  const SX = { short: 1552, mid: 1656, long: 1760 };
  S.SX = SX;
  const slider = `<line x1="1536" y1="400" x2="1776" y2="400" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>` +
    triG(SX.short, 452, 24) + dotG(SX.mid, 452, 10) + squareG(SX.long, 452, 22) +
    `<circle class="thumb" cx="${SX.mid}" cy="400" r="24" fill="${ACC}" stroke="#fff" stroke-width="6"/>`;

  // Tiny grey cells with irregular spacing, in eight columns that fill from left to right.
  const r = rng(99), cols = 8, cellG = Array.from({ length: cols }, () => []);
  for (let y = 652; y < 860; y += 15) for (let x = 120; x < 1794; x += 15) {
    if (r() > 0.8) continue;
    const sz = 6 + r() * 6, jx = (r() - 0.5) * 7, jy = (r() - 0.5) * 7;
    cellG[Math.min(cols - 1, Math.floor(((x - 120) / 1680) * cols))].push(`<rect x="${fx(x + jx)}" y="${fx(y + jy)}" width="${fx(sz)}" height="${fx(sz)}" rx="1.5" fill="${GREY}"/>`);
  }
  const cells = cellG.map((g, i) => `<g class="cc cc${i} off">${g.join("")}</g>`).join("");

  const numGrid = (x, y, c, rows, cw, ch, o = {}) => {
    const rr = rng((o.seed ?? 1) * 7919 + 13), size = o.size ?? Math.round(ch * 0.42), sw = o.sw ?? 3;
    let s = `<rect x="${fx(x)}" y="${fx(y)}" width="${fx(c * cw)}" height="${fx(rows * ch)}" rx="4" fill="#fff" stroke="${INK}" stroke-width="${sw}"/>`;
    for (let i = 1; i < c; i++) s += line([x + i * cw, y], [x + i * cw, y + rows * ch], "#d4d4d8", Math.max(1.5, sw * 0.6));
    for (let j = 1; j < rows; j++) s += line([x, y + j * ch], [x + c * cw, y + j * ch], "#d4d4d8", Math.max(1.5, sw * 0.6));
    for (let j = 0; j < rows; j++) for (let i = 0; i < c; i++) {
      const v = rr() * 4 - 2, txt = (v < 0 ? "−" : "") + Math.abs(v).toFixed(size > 20 ? 2 : 1);
      s += `<text x="${fx(x + (i + 0.5) * cw)}" y="${fx(y + (j + 0.5) * ch + size * 0.36)}" font-family="JetBrains Mono, monospace" font-size="${size}" text-anchor="middle" fill="${INK}">${txt}</text>`;
    }
    return s;
  };
  const stackGrid = (x, y, c, rows, cw, ch, layers, o = {}) => {
    const off = o.off ?? Math.max(10, cw * 0.28);
    let s = "";
    for (let L = layers - 1; L >= 1; L--) s += `<rect x="${fx(x + L * off)}" y="${fx(y - L * off)}" width="${fx(c * cw)}" height="${fx(rows * ch)}" rx="4" fill="#fff" stroke="${INK}" stroke-width="${o.sw ?? 3}"/>`;
    return s + numGrid(x, y, c, rows, cw, ch, o);
  };
  const chip = (x, y, Sz, o = {}) => {
    const { cells: n = 6, pins = 5 } = o, sw = o.sw ?? Math.max(3, Sz * 0.016), pl = Sz * 0.075;
    let s = "";
    for (let i = 0; i < pins; i++) {
      const t = Sz * (0.18 + (0.64 * i) / (pins - 1));
      s += line([x + t, y - pl], [x + t, y], INK, sw) + line([x + t, y + Sz], [x + t, y + Sz + pl], INK, sw) + line([x - pl, y + t], [x, y + t], INK, sw) + line([x + Sz, y + t], [x + Sz + pl, y + t], INK, sw);
    }
    s += `<rect x="${fx(x)}" y="${fx(y)}" width="${fx(Sz)}" height="${fx(Sz)}" rx="${fx(Sz * 0.07)}" fill="#fff" stroke="${INK}" stroke-width="${fx(sw)}"/>`;
    const inset = Sz * 0.13, g = Sz - 2 * inset, gap = g * 0.06, c = (g - (n - 1) * gap) / n;
    let off = "", on = "";
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const cell = (fill) => `<rect x="${fx(x + inset + i * (c + gap))}" y="${fx(y + inset + j * (c + gap))}" width="${fx(c)}" height="${fx(c)}" rx="${fx(c * 0.12)}" fill="${fill}"/>`;
      off += cell(HAIR); on += cell(ACC);
    }
    return s + (o.lit ? on : `<g class="cellsoff">${off}</g><g class="cellson off">${on}</g>`);
  };

  const tensor = stackGrid(960, 350, 6, 4, 92, 64, 3, { seed: 3, size: 24, off: 26 });
  let chips = "";
  for (const [cx, label, seed] of [[1060, "GPU", 4], [1560, "TPU", 5]]) {
    const Sz = 290, x = cx - Sz / 2, y = 480;
    chips += stackGrid(x - 6, 290, 4, 3, 38, 30, 3, { seed, size: 13, off: 10, sw: 2.5 }) + stackGrid(x + 190, 290, 3, 3, 30, 30, 4, { seed: seed + 9, size: 11, off: 8, sw: 2.5 });
    chips += arrow(cx, 396, cx, 454, { w: 6 }) + chip(x, y, Sz, { cells: 8 });
  }
  let blocks = "";
  for (const x0 of [840, 1400]) for (let j = 0; j < 5; j++) for (let i = 0; i < 4; i++) blocks += chip(x0 + i * 94, 318 + j * 104, 70, { cells: 4, pins: 3, sw: 3, lit: true });

  rig.insertAdjacentHTML("beforeend", `
    <div id="ui" class="layer">
      <span class="pill acc big gd off" style="right:120px;left:auto;top:128px">gradient descent</span>
      <div class="sliderg off"><div class="slider-lab">step size</div><svg class="full">${slider}</svg></div>
      <div class="chat off"><span class="q">Write a short poem about rain</span><div class="a"><i style="top:30px;width:430px"></i><i style="top:62px;width:460px"></i><i style="top:94px;width:300px"></i></div><div class="in">Ask anything</div></div>
      <svg class="full cells">${cells}</svg>
      <div class="tensor off"><svg class="full">${tensor}</svg><span class="pill acc ctr" style="left:1236px;top:640px;font-size:36px;line-height:58px;font-weight:600">tensor</span></div>
      <div class="chips off"><svg class="full">${chips}</svg>
        <span class="pill mono ctr" style="left:1060px;top:814px">GPU</span><span class="pill mono ctr" style="left:1560px;top:814px">TPU</span></div>
      <div class="blocks off"><svg class="full">${blocks}</svg>
        <span class="pill mono ctr" style="left:1011px;top:236px">GPU</span><span class="pill mono ctr" style="left:1571px;top:236px">TPU</span></div>
    </div>
    <div id="chrome" class="layer">
      <div class="whiteout"></div>
      <p class="eyebrow">03 How AI learns</p>
      <h1 class="title">How does AI learn?</h1>
      <p class="caption off">For this lesson it is a bowl.</p>
      ${footer(SECTION_NUMBER, SECTIONS_TOTAL)}
    </div>`);
}

// The haze: one canvas baked before t=0, grey-white with soft texture and a clear hole in the middle.
// It moves only by transform, to the ball's spot on the ground after each landing, so nothing repaints.
function buildHaze() {
  const N = 1600, c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d"), r = rng(11);
  g.fillStyle = "rgba(244,245,247,.88)"; g.fillRect(0, 0, N, N);
  for (let i = 0; i < 700; i++) {
    const x = r() * N, y = r() * N, rad = 25 + r() * 110, light = r() < 0.45, a = 0.14 + r() * 0.26;
    const col = light ? "255,255,255" : "184,187,196", gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, 2 * rad, 2 * rad);
  }
  g.globalCompositeOperation = "destination-out";
  const h = g.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, 165);
  h.addColorStop(0, "rgba(0,0,0,1)"); h.addColorStop(95 / 165, "rgba(0,0,0,1)"); h.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = h; g.fillRect(0, 0, N, N);
  $("#haze").appendChild(c);
}

  "3.4see": (an) => { placeHaze(...onS(START)); S.haze.style.opacity = 1; show(S.haze, S.ring); },
  "3.4steps": (an) => { show(S.harrow); hops(an, 1, 1, 0.03); },
  "3.4again": (an) => { hide(S.harrow); hops(an, 2, 6, 0.02); },
  "3.4name": (an) => { hide(S.haze, S.ring); show(S.gd); },
  // 3.5 Step size
  "3.5setting": (an) => { hide(S.flines, S.drop, S.gd); show(S.sliderg); S.thumb.setAttribute("cx", S.SX.mid); },
  // A hollow ball runs each case beside the main path: fast hops for too long, a slow crawl for too short.
  "3.5long": (an) => { S.thumb.setAttribute("cx", S.SX.long); walk(an, RUNS.long, 0.04, LONG_HOP, LONG_REST, true); },
  "3.5short": (an) => {
    S.thumb.setAttribute("cx", S.SX.short); S.long.style.opacity = 0.35;
    const gl = RUNS.long.ball;
    run(an, 0, 0.3, (k) => { gl.style.opacity = (1 - k).toFixed(3); if (k >= 1) hide(gl); });
    walk(an, RUNS.short, 0.04, SHORT_HOP, SHORT_REST, false);
  },
  // 3.6 Many valleys
  "3.6zoom": (an) => {
    // Everything but the surface, its rim, the dots, and the ball leaves on the word, and a pure 3x pull-back about
    // the ball starts with it: the sharp bowl layer shrinks away while the landscape, drawn at its final scale, takes
    // over. The pull-back runs 2 s and the bowl is gone by 90 %, so the picture is still well before "each about as
    // low" arrives about 3 s after the word, and that reveal is measured against a quiet frame.
    hide(S.caption, S.sliderg, S.long, S.short, RUNS.long.ball, RUNS.short.ball, S.htick, S.axis, S.axlab, S.km1, S.km2, S.floor, S.flines, S.drop, S.gd, S.haze, S.ring);
    const [cx, cy] = CEND;
    run(an, 0, 2.0, (k) => {
      const ez = easeInOut(k), s = Math.pow(ZOOM, 1 - ez), f = s / ZOOM;
      S.L.style.transform = `translate(${fx(cx * (1 - s))}px, ${fx(cy * (1 - s))}px) scale(${s.toFixed(4)})`;
      S.L.style.opacity = Math.max(0.01, clamp01((k - 0.05) / 0.45)).toFixed(3);
      S.B.style.transform = `translate(${fx(cx * (1 - f))}px, ${fx(cy * (1 - f))}px) scale(${f.toFixed(4)})`;
      S.B.style.opacity = (1 - clamp01((k - 0.6) / 0.3)).toFixed(3);
      placeBall(cx, cy, lerp(1, BALL_WIDE, ez));
      if (k >= 1) { S.L.style.transform = "none"; S.L.style.opacity = 1; hide(S.B); }
    });
  },
  "3.6low": (an) => show(S.trails, S.levels),
  // 3.7 Today's AI
  "3.7ai": (an) => {
    hide(S.trails, S.levels); show(S.chat);
    run(an, 0, 0.6, (k) => { const e = easeInOut(k); S.world.style.transform = `translate(${fx(MINI.tx * e)}px, ${fx(MINI.ty * e)}px) scale(${lerp(1, MINI.sc, e).toFixed(4)})`; });
  },
  "3.7sums": (an) => S.cc.forEach((g, i) => at(an, 0.07 * i, () => show(g))),
  // 3.8 Tensors and chips
  "3.8tensor": (an) => { hide(S.chat, S.cc); show(S.tensor); },
  "3.8gpu": (an) => {
    // The chips take the grids, every cell lights on one frame, then the one ball makes one hop.
    hide(S.tensor); show(S.chips);
    at(an, 0.35, () => { hide($$(".chips .cellsoff")); show($$(".chips .cellson")); });
    at(an, 0.6, () => show(S.hopmark));
    const a = W(MAIN[6]), b = W(MAIN[7]);
    run(an, 0.6, 0.35, (k) => placeBall(lerp(a[0], b[0], k), lerp(a[1], b[1], k) - 40 * 4 * k * (1 - k), BALL_WIDE));
  },
  "3.8chips": (an) => { hide(S.chips); show(S.blocks); },
  // The end of speech: the figure and the title fade to white, and the eyebrow and footer stay. The edit
  // opens on this frame.
  "3.8out": (an) => run(an, 0, 0.3, (k) => { S.whiteout.style.opacity = k.toFixed(3); S.title.style.opacity = (1 - k).toFixed(3); }),
};

// The main path's hops: each hop leaves a dot, then the probe lines, the tick, and the haze move to the
// landing spot in a short rest. The ball arcs a little, and the haze glides along the ground with no arc.
const HOP = 0.3, REST = 0.22;
function hops(an, from, to, delay) {
  for (let i = from; i <= to; i++) {
    const d = delay + (i - from) * (HOP + REST), a = onS(MAIN[i - 1]), b = onS(MAIN[i]), h = 10 + 0.18 * Math.hypot(b[0] - a[0], b[1] - a[1]);
    run(an, d, HOP, (k) => placeBall(lerp(a[0], b[0], easeOut(k)), lerp(a[1], b[1], easeOut(k)) - h * 4 * k * (1 - k)));
    at(an, d + HOP, () => { show(S.md[i - 1]); setProbe(MAIN[i]); });
    run(an, d + HOP, REST * 0.9, (k) => { const e = easeInOut(k); placeHaze(lerp(a[0], b[0], e), lerp(a[1], b[1], e)); });
  }
}

// A step-size walk: its hollow ball moves between the computed landing points, the line grows under it, and
// each landing shows that path's marker. The long path's 16 hops take 0.15 s each and the short path's 6
// crawls 0.42 s each, so both finish about 2.5 s after the cue, well before the next cue and its control span.
// With animate false the walk is complete at once: every marker, the whole line, the ball on the last point.
const LONG_HOP = 0.12, LONG_REST = 0.03, SHORT_HOP = 0.32, SHORT_REST = 0.1;
const placeAt = (el, x, y) => { el.style.transform = `translate(${fx(x)}px, ${fx(y)}px)`; };
function walk(an, r, delay, hop, rest, arc) {
  const q = r.pts;
  hide(r.marks); r.line.setAttribute("points", polyPts(q.slice(0, 1)));
  r.ball.style.opacity = 1; placeAt(r.ball, q[0][0], q[0][1]); show(r.g, r.ball);
  for (let i = 1; i < q.length; i++) {
    const d = delay + (i - 1) * (hop + rest), a = q[i - 1], b = q[i], h = arc ? 8 + 0.12 * Math.hypot(b[0] - a[0], b[1] - a[1]) : 0;
    run(an, d, hop, (k) => {
      const e = arc ? easeOut(k) : easeInOut(k), x = lerp(a[0], b[0], e), y = lerp(a[1], b[1], e);
      placeAt(r.ball, x, y - h * 4 * k * (1 - k));
      r.line.setAttribute("points", polyPts([...q.slice(0, i), [x, y]]));
    });
    at(an, d + hop, () => show(r.marks[i - 1]));
  }
}

// ---- The scene --------------------------------------------------------------------------------------------------------
const STEPS = [
  { id: "3.1", hold: 20, cues: { "3.1examples": 2.6, "3.1rules": 3.4, "3.1box": 7.4, "3.1guess": 9.6, "3.1wrong": 12.2, "3.1turn": 14.0, "3.1again": 17.3 } },
  { id: "3.2", hold: 16.6, cues: { "3.2way": 0.5, "3.2one": 5.2, "3.2billions": 6.6, "3.2instead": 9.7, "3.2all": 13.8 } },
  { id: "3.3", hold: 12.4, cues: { "3.3two": 0.5, "3.3floor": 2.3, "3.3height": 5.5, "3.3bowl": 9.6 } },
  { id: "3.4", hold: 19.5, cues: { "3.4ball": 0.5, "3.4see": 4.8, "3.4steps": 10.4, "3.4again": 11.9, "3.4name": 17.4 } },
  { id: "3.5", hold: 10.7, cues: { "3.5setting": 0.5, "3.5long": 3.3, "3.5short": 7.0 } },
  { id: "3.6", hold: 7.6, cues: { "3.6zoom": 0.5, "3.6low": 4.1 } },
  { id: "3.7", hold: 11.5, cues: { "3.7ai": 0.5, "3.7sums": 5.2 } },
  { id: "3.8", hold: 12, cues: { "3.8tensor": 0.5, "3.8gpu": 2.3, "3.8chips": 8.2, "3.8out": 9.4 } },
];
const fire = (id, animate) => { finishJobs(); CUE[id](animate); };
DeckTalk.scene(3, { name: "How AI learns", steps: STEPS.map((st, n) => ({
  id: st.id, hold: st.hold, cues: st.cues,
  // A frozen step starts from every earlier cue's end state, because the figure carries over.
  enter: (slide, ctx) => { slide.rig = rig; if (ctx.frozen) STEPS.slice(0, n).forEach((prev) => Object.keys(prev.cues).forEach((id) => fire(id, false))); },
  on: Object.fromEntries(Object.keys(st.cues).map((id) => [id, (slide, ctx) => fire(id, !ctx.frozen)])),
})) });

// Narration t=0 waits until the fonts are in and the figure has been painted once, with the landscape and
// the bowl at opacity .003 so their rasters already exist when they first show. At .003 they round to
// nothing on white, so the first frame is clean (at .01 they left grey smudges right of the rules card).
document.addEventListener("DOMContentLoaded", () => {
  const faces = ['600 64px "Inter Tight"', '600 60px "Inter Tight"', '500 30px Inter', '500 44px Inter', '500 30px "JetBrains Mono"', '400 24px "JetBrains Mono"'];
  const painted = Promise.all(faces.map((f) => document.fonts.load(f))).then(() => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(r)))));
  window.__sceneReady = Promise.all([window.__sceneReady, painted]).then(([ready]) => ready);
});
</script>
