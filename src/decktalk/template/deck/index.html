<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__NAME__</title>
<!-- KaTeX typesets every [data-tex] element. Without it the element keeps its plain text.
     `decktalk init` copies the release DeckTalk ships into deck/katex/, so nothing loads from a CDN. -->
<link rel="stylesheet" href="./katex/katex.min.css">
<script src="./katex/katex.min.js"></script>
<style>
  /* Bundled OFL fonts (deck/fonts/), so a recorder with no network never falls back to Helvetica. */
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 100 900; font-display: block; src: url("./fonts/InterTight-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 100 900; font-display: block; src: url("./fonts/InterTight-greek.woff2") format("woff2"); unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: block; src: url("./fonts/Inter-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: block; src: url("./fonts/Inter-greek.woff2") format("woff2"); unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: block; src: url("./fonts/JetBrainsMono-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: block; src: url("./fonts/JetBrainsMono-greek.woff2") format("woff2"); unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }

  /* Tokens. The accent belongs only to the thing being revealed right now. */
  :root {
    --ground: #ffffff; --ink: #0a0a0a; --mute: #71717a; --dim: #a3a3ad; --hair: #e4e4e7; --block: #f4f4f5; --accent: #2c1fea;
    --sans: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --tight: "Inter Tight", "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { width: 100vw; height: 100vh; overflow: hidden; }
  #dt-stage { background: var(--ground); }
  .slide { position: absolute; inset: 0; }
  /* A scene cuts in on its first frame rather than fading up, so the cut and the poster frame are never blank. */
  #dt-pan > .dt-slide.dt-first { animation: none; }
  .slide * { box-sizing: border-box; }
  .stage-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .abs { position: absolute; }

  /* Type scale at 1920 by 1080. */
  .eyebrow { position: absolute; left: 120px; top: 44px; margin: 0; font: 500 22px/28px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .wordmark { margin: 0; font: 600 104px/1.1 var(--tight); letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
  .filelabel { font: 500 22px/28px var(--mono); color: var(--mute); }

  /* Footer: the mark at left, the section tracker at right. It never carries a cue. A footer that hands
     off between sections stacks one tracker per section in the same spot. */
  .footer { position: absolute; left: 120px; right: 120px; top: 984px; height: 30px; display: flex; align-items: center; justify-content: space-between; }
  .footer .brand, .footer .track { display: flex; align-items: center; gap: 14px; font: 500 22px/28px var(--mono); letter-spacing: .14em; color: var(--mute); }
  .footer .tracks { position: relative; }
  .footer .tracks .track ~ .track { position: absolute; right: 0; top: 0; }
  .footer .mark line { stroke: var(--hair); stroke-width: 2.25; stroke-linecap: round; }
  .footer .mark .tall { stroke: var(--accent); }
  .footer .mark circle { fill: var(--accent); }
  .footer .ticks rect { fill: var(--hair); }
  .footer .ticks .cur { fill: var(--ink); }

  /* Hand-offs. Every section opens on the frame the section before it ended on, so the cut never
     changes the picture and a word makes the first change. handoff() in the script fades out each
     element marked data-out="CUE" on that cue, and fades in each element marked data-in="CUE", which
     stays hidden until then. */
  [data-in] { opacity: 0; }
  @keyframes x-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes x-out { from { opacity: 1; } to { opacity: 0; } }
  /* Freeze mode (shots) shows every hand-off and move at its end state. */
  .dt-frozen .slide, .dt-frozen .slide * { animation-duration: 0s !important; animation-delay: 0s !important; transition-duration: 0s !important; transition-delay: 0s !important; }

  /* Scene 1 */
  .s1 .curve { fill: none; stroke: var(--ink); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
  .s1 .box { fill: var(--ground); stroke: var(--ink); stroke-width: 4; }
  .s1 .box.full { fill: var(--accent); stroke: var(--accent); }
  .s1 .lbl { font: 500 36px var(--sans); text-anchor: middle; fill: var(--ink); }
  .s1 .box.full + .lbl { fill: #ffffff; }
  .s1 .time { font: 500 30px var(--mono); text-anchor: middle; fill: var(--ink); }
  /* The balls are listed last position first, so a ball that has arrived hides every earlier one after it. */
  .s1 .ball.dt-on ~ .ball { visibility: hidden; }
  .s1-mark { position: absolute; left: 0; right: 0; top: 155px; text-align: center; }

  /* Scene 2 */
  /* It opens on scene 1's last frame. The wordmark starts where scene 1 left it and moves to the top on its word. */
  .s2-markfade, .s2-cardwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .s2-mark { position: absolute; left: 0; right: 0; top: 155px; text-align: center; transform-origin: 50% 50%; }
  .s2-mark.up { animation: s2-up .35s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes s2-up { from { transform: none; } to { transform: translateY(-92px) scale(.6923); } }
  .dt-frozen .s2-mark.up { animation: none; transform: translateY(-92px) scale(.6923); }
  .s2 .code { font: 500 25px var(--mono); fill: var(--ink); white-space: pre; }
  .s2 .code.m, .s2 .code .m { fill: var(--mute); }
  .s2 .code .new { fill: #ffffff; font-weight: 700; }
  .s2 .t { font: 500 22px var(--mono); fill: var(--ink); }
  .s2 .join { fill: none; stroke: var(--accent); stroke-width: 4; }
  .s2 .follow { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 0.6; }
  .s2 .follow.draw { animation: s2-draw .3s ease-out both; }
  @keyframes s2-draw { from { stroke-dashoffset: 0.6; } to { stroke-dashoffset: 0; } }
  .dt-frozen .s2 .follow { stroke-dashoffset: 0; }
  /* The slide card holds the lesson page's first frame at full size, scaled into the 800 by 450 card at
     1000, 250. On "lesson" it scales back to full size, so the section ends on the lesson's first frame. */
  .s2-push { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: translate(1000px, 250px) scale(0.41666667); }
  .s2-frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 4.8px solid var(--mute); border-radius: 38.4px; }
  /* The replica copies lesson.html's .title, and that page's text rendering. */
  .l0 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; text-rendering: auto; }
  .l0 .title { position: absolute; left: 120px; top: 92px; margin: 0; font: 600 64px/1.1 var(--tight); letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }

  /* The edit: outside the presentation. Scenes 4, 6 and 7 and both clips share one geometry at
     1920 by 1080, so every handoff between a page and a clip is pixel-exact: a player window with its title
     bar, the video area at exactly 0.6 scale, a progress line, five part chips and the script panel, on white
     with no eyebrow, footer or tracker. Every state change is a class swap on its cue frame. Motion rides
     after the snap as a CSS animation, which freeze mode runs at its end state. */
  .ed { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--ground); }
  .ed .off { visibility: hidden !important; }
  .ed .none { display: none !important; }
  .ed-inside { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .ed-video { position: absolute; left: 384px; top: 72px; width: 1152px; height: 648px; overflow: hidden; background: var(--ground); }
  .ed-video .lesson { position: absolute; left: -384px; top: -72px; width: 1920px; height: 1080px; transform-origin: 960px 180px; transform: scale(.6); will-change: transform; }
  .ed-video .lesson.shrink { animation: ed-shrink .7s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes ed-shrink { from { transform: scale(.9); } to { transform: scale(.6); } }
  .ed-video .frame { position: absolute; left: 0; top: 0; width: 1152px; height: 648px; }
  .ed-dim { position: absolute; left: 384px; top: 72px; width: 1152px; height: 648px; background: #ffffff; opacity: .6; }
  .ed-marks { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .ed-marks .ghost { fill: none; stroke: var(--accent); stroke-width: 4; stroke-dasharray: 9 7; }
  .ed-marks .pen { fill: none; stroke: var(--accent); stroke-width: 6; }
  .ed-marks .nbox { fill: none; stroke: var(--accent); stroke-width: 4; stroke-dasharray: 12 8; }
  .ed-marks .nlab { font: 500 22px var(--sans); text-anchor: middle; fill: var(--accent); }
  .ed-prog { position: absolute; left: 384px; top: 716px; width: 1152px; height: 4px; background: var(--hair); }
  .ed-prog .fill { position: absolute; left: 0; top: 0; height: 4px; width: 0; background: var(--accent); }
  .ed-prog .fill::after { content: ""; position: absolute; right: -10px; top: -8px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); }
  .ed-prog .fill.watched { animation: ed-watched .3s ease-out both; }
  @keyframes ed-watched { from { width: 20%; } to { width: 60%; } }
  .ed-prog .fill.full { width: 100%; animation: none; }
  .ed-win { position: absolute; left: 382px; top: 26px; width: 1156px; height: 696px; box-sizing: border-box; border: 2px solid var(--ink); border-radius: 14px; }
  .ed-bar { position: absolute; left: 384px; top: 28px; width: 1152px; height: 44px; box-sizing: border-box; border-bottom: 2px solid var(--hair); }
  .ed-bar .dots { position: absolute; left: 18px; top: 14px; display: flex; gap: 8px; }
  .ed-bar .dots i { width: 12px; height: 12px; box-sizing: border-box; border: 2px solid var(--hair); border-radius: 50%; }
  .ed-bar .name { position: absolute; left: 88px; top: 6px; font: 500 24px/30px var(--sans); color: var(--mute); }
  .ed-pill { position: absolute; width: 132px; height: 32px; box-sizing: border-box; border-radius: 16px; text-align: center; font: 600 22px/28px var(--sans); }
  .ed-bar .ed-pill { right: 8px; top: 5px; }
  .ed-pill.before { border: 2px solid var(--mute); color: var(--mute); }
  .ed-pill.after { border: 2px solid var(--accent); background: var(--accent); color: #ffffff; }
  .ed-chip { position: absolute; top: 744px; width: 220px; height: 52px; box-sizing: border-box; border: 2px solid var(--hair); border-radius: 10px; background: var(--ground); display: flex; align-items: center; gap: 10px; padding-left: 14px; white-space: nowrap; }
  .ed-chip b { font: 600 30px/1 var(--mono); color: var(--ink); }
  .ed-chip span { font: 500 22px/1 var(--sans); color: var(--ink); }
  .ed-chip .glyph { display: none; }
  .ed-chip.watched { background: var(--block); }
  .ed-chip.focus { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .ed-chip.new { background: var(--accent); border-color: var(--accent); }
  .ed-chip.new b, .ed-chip.new span { color: #ffffff; }
  .ed-chip.new .glyph.wave { display: block; }
  .ed-chip.new .nm, .ed-chip.kept .nm { display: none; }
  .ed-chip .say { display: none; }
  .ed-chip.new .say.v, .ed-chip.kept .say.k { display: inline; }
  .ed-chip.kept { background: var(--ground); }
  .ed-chip.kept .glyph.check { display: block; }
  .ed-chip.kept span, .ed-chip.kept b { color: var(--mute); }
  /* The checks land 0.1 s apart, the first on the cue frame. A chip that is already kept (a page that opens on
     that state) is marked still, so nothing replays when the page mounts. */
  .ed-chip.kept .glyph.check, .ed-chip.kept .say.k { animation: ed-show .01s linear both; animation-delay: calc(var(--i) * .1s); }
  @keyframes ed-show { from { opacity: 0; } to { opacity: 1; } }
  .ed-chip.still .glyph, .ed-chip.still .say { animation: none !important; }
  .ed-chip.lead { background: var(--accent); border-color: var(--accent); }
  .ed-chip.lead b, .ed-chip.lead span { color: #ffffff; }
  .ed-panel { position: absolute; left: 384px; top: 820px; width: 1152px; height: 232px; box-sizing: border-box; border: 2px solid var(--hair); border-radius: 14px; background: var(--ground); overflow: hidden; }
  .ed-panel.rise { animation: ed-rise .3s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes ed-rise { from { transform: translateY(28px); } to { transform: none; } }
  .ed-panel::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: linear-gradient(rgba(255, 255, 255, 0), #ffffff); }
  .ed-panel .tab { position: absolute; left: 22px; top: 8px; font: 500 22px/28px var(--sans); color: var(--mute); }
  .ed-panel .bp { position: absolute; right: 12px; top: 6px; width: 104px; height: 32px; box-sizing: border-box; border: 2px solid var(--mute); border-radius: 8px; text-align: center; font: 600 22px/28px var(--sans); color: var(--mute); }
  .ed-panel .bp.on { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  .ed-panel .lines { position: absolute; left: 32px; top: 52px; font: 500 36px/62px var(--mono); color: var(--ink); white-space: pre; }
  .ed-panel .l2 { display: inline-block; margin-left: -8px; padding: 0 8px; border-radius: 8px; line-height: 50px; }
  .ed-panel .l2.mark { box-shadow: inset 0 0 0 2px rgba(44, 31, 234, .35); }
  .ed-panel .l2 em { font-style: normal; color: var(--accent); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 7px; }
  .ed-panel .dev { position: absolute; left: 32px; top: 176px; font: 500 22px/28px var(--mono); color: var(--mute); white-space: pre; }
  .ed-panel .log { position: absolute; left: 32px; top: 46px; font: 500 22px/34px var(--mono); color: var(--mute); white-space: pre; }
  .ed-panel .log .hot { color: var(--accent); }
  /* 7.1box: before and after side by side, each with its count row. */
  .ed-still { position: absolute; top: 150px; width: 864px; height: 486px; }
  .ed-still img { position: absolute; left: 0; top: 0; width: 864px; height: 486px; }
  .ed-still::after { content: ""; position: absolute; left: -2px; top: -2px; width: 868px; height: 490px; box-sizing: border-box; border: 2px solid var(--ink); }
  .ed-proof .ed-pill { top: 104px; }
  .ed-cbox { position: absolute; top: 668px; width: 200px; height: 72px; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 12px; text-align: center; font: 500 32px/66px var(--sans); color: var(--ink); }
  .ed-cbox.add { border-color: var(--accent); color: var(--accent); }
  .ed-time { position: absolute; top: 762px; width: 200px; text-align: center; font: 500 36px/44px var(--mono); color: var(--mute); }
  .ed-time.a { color: var(--accent); }
  .ed-check { position: absolute; top: 816px; width: 200px; height: 40px; }
  .ed-note { position: absolute; left: 64px; top: 822px; font: 500 24px/30px var(--sans); color: var(--mute); }
  .ed-badge { position: absolute; left: 50%; top: 904px; transform: translateX(-50%); height: 52px; padding: 0 30px; box-sizing: border-box; border: 2px solid var(--accent); border-radius: 26px; font: 500 30px/48px var(--sans); color: var(--ink); white-space: nowrap; }
  .ed-vdev { position: absolute; left: 0; right: 0; top: 986px; text-align: center; font: 500 22px/28px var(--mono); color: var(--mute); }
  /* 7.1back: the Close's first frame in the player grows to full frame, and the chrome fades. */
  .ed-close { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--ground); transform-origin: 960px 180px; transform: scale(.6); }
  .ed-close.grow { animation: ed-grow .8s cubic-bezier(.65, 0, .35, 1) .2s both; will-change: transform; }
  /* Once grown, the frame drops its animation and layer, so its text is drawn exactly as the Close draws it. */
  .ed-close.grown { animation: none; transform: none; will-change: auto; }
  @keyframes ed-grow { from { transform: scale(.6); } to { transform: none; } }
  .ed-fade { animation: x-out .2s ease .2s both; }

  /* Scene 5: it opens on white with its eyebrow and tracker, the frame the edit's player grows into, then ends on
     the Open's composition with the count finished. */
  .s5-tag { position: absolute; left: 0; right: 0; top: 92px; margin: 0; text-align: center; white-space: nowrap; font: 600 44px/1.1 var(--tight); letter-spacing: -.01em; color: var(--ink); }
  .s5-mark { position: absolute; left: 0; right: 0; top: 155px; text-align: center; }
  .s5 .s5-lic { font: 500 26px var(--mono); text-anchor: middle; fill: var(--mute); }
  .s5 .s5-url { font: 600 44px var(--tight); letter-spacing: -.01em; text-anchor: middle; fill: #ffffff; }

  /* Keep-alive. The recorder's magenta cover spins until narration t=0, so the compositor is busy when the
     cover-off frame is stamped. A page that then goes still paints each later reveal on an idle compositor,
     which lands it a frame or two earlier than the cover-off frame suggests, so reveals read 50-90 ms early.
     This near-white 3 px square turns for the whole recording, so every frame is stamped the same way. */
  #dt-keepalive { position: fixed; right: 2px; bottom: 2px; width: 3px; height: 3px; background: #fefefe; pointer-events: none; animation: dt-keepalive .5s linear infinite; }
  @keyframes dt-keepalive { to { transform: rotate(360deg); } }
  .dt-frozen #dt-keepalive { display: none; }
  /* The t=0 underlay: the scene's first frame, drawn before narration t=0 under the runtime's slide layer. */
  #t0 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #t0 [data-cue] { visibility: hidden !important; }
</style>
</head>
<body>
<div id="dt-keepalive" aria-hidden="true"></div>
<div id="dt-stage"><div id="t0" aria-hidden="true"></div></div>
<script src="decktalk-runtime.js"></script>
<script>
// Scene numbers are the "## N." sections of script.md. Each step id is N.S and each cue id
// is the step id plus a short word. cues.json maps every cue id to the spoken phrase it
// lands on. Open this file with no query for an index of scenes and steps, and add
// ?step=ID to freeze one step with everything revealed. Scene 3 lives in lesson.html, and
// decktalk.toml says which page each section records.
//
// Each step is a { id, hold, cues, render } object. The HTML between the backticks of
// `render` is safe to edit freely. The `cues:` object and the data-cue attributes in that
// HTML must use the same ids, and cues.json names those same ids. A backslash inside the
// backticks must be written twice, so a data-tex value reads data-tex="\\frac{1}{2}".
// The `on:` block is JavaScript that runs when a cue fires. Each function receives the
// step's slide element and a context object { id, at, frozen, step }, so a handler finds its
// elements with slide.querySelector and needs no global. Copy a whole step object to add a step.
//
// Every reveal here uses data-fx="none", so each picture snaps in on the frame of its word.

// The footer of every slide: the four-tick mark and DECKTALK at left, the section tracker at right.
// It counts the sections of decktalk.toml, and each scene passes its section number. A section that
// hands off passes one entry per tracker instead, [section, cue it fades in on, cue it fades out on],
// and the trackers stack in one spot. The tracker is drawn exactly as lesson.html draws it, so a cut
// between the two pages does not move it.
const SECTIONS_TOTAL = 5;
const xattrs = (cueIn, cueOut) => `${cueIn ? ` data-in="${cueIn}"` : ""}${cueOut ? ` data-out="${cueOut}"` : ""}`;
function footer(...entries) {
  const track = (entry) => {
    const [n, cueIn, cueOut] = Array.isArray(entry) ? entry : [entry];
    const ticks = Array.from({ length: SECTIONS_TOTAL }, (_, i) => {
      const x = 1 + i * 12;
      return i + 1 === n
        ? `<rect class="cur" x="${x}" y="8" width="3" height="22"/><circle class="cur" cx="${x + 1.5}" cy="3" r="2"/>`
        : `<rect x="${x}" y="14" width="3" height="16"/>`;
    }).join("");
    const w = 12 * SECTIONS_TOTAL - 6;
    return `<div class="track"${xattrs(cueIn, cueOut)}><svg class="ticks" viewBox="0 0 ${w} 30" width="${w}" height="30" aria-hidden="true">${ticks}</svg><span>0${n} / 0${SECTIONS_TOTAL}</span></div>`;
  };
  return `
    <div class="footer">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <line x1="4" y1="12" x2="4" y2="20"/><line class="tall" x1="9.5" y1="8" x2="9.5" y2="20"/><circle cx="9.5" cy="3.75" r="2.25"/>
          <line x1="15" y1="12" x2="15" y2="20"/><line x1="20.5" y1="12" x2="20.5" y2="20"/>
        </svg>
        <span>DECKTALK</span>
      </div>
      ${entries.length > 1 ? `<div class="tracks">${entries.map(track).join("")}</div>` : track(entries[0])}
    </div>`;
}
// Eyebrows hand off the same way: each entry is [text, cue it fades in on, cue it fades out on].
const eyebrows = (...entries) => entries.map(([text, cueIn, cueOut]) => `<p class="eyebrow"${xattrs(cueIn, cueOut)}>${text}</p>`).join("");

// A hand-off on cue id: each element marked data-out="id" fades out and each marked data-in="id" fades
// in, over data-xdur seconds (0.3 by default) after data-xdelay seconds (none by default).
function handoff(slide, id) {
  const fade = (name) => (el) => { el.style.animation = `${name} ${el.dataset.xdur || 0.3}s ease ${el.dataset.xdelay || 0}s both`; };
  slide.querySelectorAll(`[data-out~="${id}"]`).forEach(fade("x-out"));
  slide.querySelectorAll(`[data-in~="${id}"]`).forEach(fade("x-in"));
}
// A step's on: object that runs the hand-off of every listed cue, then any extra move for that cue.
const handoffs = (ids, extra = {}) => Object.fromEntries(ids.map((id) => [id, (slide, ctx) => { handoff(slide, id); if (extra[id]) extra[id](slide, ctx); }]));
// Every scene is registered through scene(), which keeps its first step's render for the t=0 underlay
// and removes the underlay two frames after that step mounts (see the end of this script).
const T0_RENDER = {};
function dropUnderlay() { requestAnimationFrame(() => requestAnimationFrame(() => { const el = document.getElementById("t0"); if (el) el.remove(); })); }
function scene(n, def) {
  const first = def.steps[0], enter = first.enter;
  T0_RENDER[n] = first.render;
  first.enter = (slide, ctx) => { if (enter) enter(slide, ctx); dropUnderlay(); };
  DeckTalk.scene(n, def);
}
// A move on a cue: the element transitions from its stylesheet transform to none.
const settle = (el, seconds) => { el.style.transition = `transform ${seconds}s cubic-bezier(.65, 0, .35, 1)`; el.style.transform = "none"; };

// SVG fills take colors as strings, so these repeat the tokens above.
const INK = "#0a0a0a", ACCENT = "#2c1fea", MUTE = "#71717a", DIM = "#a3a3ad", HAIR = "#e4e4e7";
const f1 = (v) => (+v).toFixed(1);
const rng = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const wordKey = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");

// ---- The bowl still ---------------------------------------------------------------------
// Scenes 2 and 4 show a still of the lesson's bowl: the error 0.5 a^2 + 1.5 b^2 over a floor
// of two knob settings, drawn in perspective as depth-sorted SVG bands from pale at the rim to
// a soft accent at the bottom. bowlStill(x, y, w, h, path) fits it in a box and returns
// { svg, box }, where box is the drawn [x, y, w, h]. With path, it also draws the ball after
// six steps of gradient descent at step size 0.25, with a dot where each earlier step landed.
const bowlStill = (() => {
  const E = 4.5, HK = 0.36, YAW = -0.32, PITCH = 0.95, DP = 16, SC = 130, CX = 960, CY = 570, FA = 3.3, FB = 2.0;
  const clamp01 = (k) => Math.min(1, Math.max(0, k));
  const err = (a, b) => 0.5 * a * a + 1.5 * b * b;
  const rimPt = (th) => [Math.sqrt(2 * E) * Math.cos(th), Math.sqrt((2 * E) / 3) * Math.sin(th)];
  const pj = (a, b, e) => {
    const y = e * HK, x1 = Math.cos(YAW) * a + Math.sin(YAW) * b, z1 = -Math.sin(YAW) * a + Math.cos(YAW) * b;
    const up = y * Math.cos(PITCH) - z1 * Math.sin(PITCH), depth = y * Math.sin(PITCH) + z1 * Math.cos(PITCH), k = DP / (DP - depth);
    return [CX + x1 * SC * k, CY - up * SC * k, depth];
  };
  // The color ramp runs in OKLab, so each band is evenly lighter than the one below it.
  const s2l = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const l2s = (c) => Math.round(clamp01(c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055) * 255);
  const toOk = ([r, g, b]) => {
    r = s2l(r); g = s2l(g); b = s2l(b);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
  };
  const fromOk = ([L, A, B]) => {
    const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3, m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3, s = (L - 0.0894841775 * A - 1.291485548 * B) ** 3;
    return [l2s(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s), l2s(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s), l2s(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s)];
  };
  const OK_LOW = toOk([139, 131, 243]), OK_RIM = toOk([246, 246, 249]);
  const mixOk = (p, q, t) => fromOk(p.map((v, i) => v + (q[i] - v) * t));
  const ramp = (e) => `rgb(${mixOk(OK_LOW, OK_RIM, Math.min(8, Math.floor((Math.max(0, e) / E) * 9)) / 8)})`;
  const isoSegs = (c, levels) => {
    const segs = [];
    for (const L of levels) {
      const pts = [];
      for (let k = 0; k < 4; k++) { const p = c[k], q = c[(k + 1) % 4]; if ((p[2] - L) * (q[2] - L) < 0) { const t = (L - p[2]) / (q[2] - p[2]); pts.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, L]); } }
      if (pts.length === 2) segs.push(pts); else if (pts.length === 4) segs.push([pts[0], pts[1]], [pts[2], pts[3]]);
    }
    return segs;
  };
  // Quads of the bowl in polar rings, painted back to front, with iso-error contours on each.
  const surface = () => {
    const R = 14, TT = 40, items = [];
    const pt = (i, j) => { const r = i / R, [a, b] = rimPt((j / TT) * Math.PI * 2); return [a * r, b * r, E * r * r]; };
    for (let i = 0; i < R; i++) for (let j = 0; j < TT; j++) items.push({ corners: [pt(i, j), pt(i + 1, j), pt(i + 1, j + 1), pt(i, j + 1)], e: E * ((i + 0.5) / R) ** 2 });
    const ops = items.map(({ corners, e }) => {
      const p = corners.map(([a, b, h]) => pj(a, b, h));
      return { depth: (p[0][2] + p[1][2] + p[2][2] + p[3][2]) / 4, d: "M" + p.map((q) => f1(q[0]) + " " + f1(q[1])).join("L") + "Z", fill: ramp(e), segs: isoSegs(corners, [1, 2, 3, 4]).map((s) => s.map(([a, b, h]) => pj(a, b, h))) };
    });
    ops.sort((x, y) => x.depth - y.depth);
    const out = [];
    let cur = null;
    const push = (kind, style, d) => { if (cur && cur.kind === kind && cur.style === style) cur.d += d; else { cur = { kind, style, d }; out.push(cur); } };
    for (const o of ops) { push("f", o.fill, o.d); for (const s of o.segs) push("c", "", `M${f1(s[0][0])} ${f1(s[0][1])}L${f1(s[1][0])} ${f1(s[1][1])}`); }
    return out.map((o) => o.kind === "f" ? `<path d="${o.d}" fill="${o.style}" stroke="${o.style}" stroke-width="1.2"/>` : `<path d="${o.d}" fill="none" stroke="rgba(10,10,10,.15)" stroke-width="2"/>`).join("");
  };
  const line = (p, q, stroke, w) => `<line x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(q[0])}" y2="${f1(q[1])}" stroke="${stroke}" stroke-width="${w}"/>`;
  const corners = [[-FA, -FB], [FA, -FB], [FA, FB], [-FA, FB]].map(([a, b]) => pj(a, b, 0));
  const floor = () => {
    let s = `<path d="M${corners.map((q) => f1(q[0]) + " " + f1(q[1])).join("L")}Z" fill="#fafafa"/>`;
    for (let g = -3; g <= 3; g++) s += line(pj(g, -FB, 0), pj(g, FB, 0), "#d4d4d8", 2);
    for (let g = -1; g <= 1; g++) s += line(pj(-FA, g, 0), pj(FA, g, 0), "#d4d4d8", 2);
    return s;
  };
  const edges = () => {
    const [b0, b1, a1, c0] = corners;
    return line(b1, b0, "#d4d4d8", 2) + `<path d="M${f1(b0[0])} ${f1(b0[1])}L${f1(c0[0])} ${f1(c0[1])}L${f1(a1[0])} ${f1(a1[1])}L${f1(b1[0])} ${f1(b1[1])}" fill="none" stroke="${MUTE}" stroke-width="3" stroke-linejoin="round"/>`;
  };
  const rim = "M" + Array.from({ length: 97 }, (_, j) => { const [a, b] = rimPt((j / 96) * 2 * Math.PI); const q = pj(a, b, E); return f1(q[0]) + " " + f1(q[1]); }).join("L");
  const bb = (() => {
    const xs = corners.map((q) => q[0]), ys = corners.map((q) => q[1]);
    for (let j = 0; j < 64; j++) { const [a, b] = rimPt((j / 64) * 2 * Math.PI); const q = pj(a, b, E); xs.push(q[0]); ys.push(q[1]); }
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  })();
  const steps = (() => { let a = -2.2, b = -1.05; const o = [[a, b]]; for (let i = 0; i < 6; i++) { a -= 0.25 * a; b -= 0.25 * 3 * b; o.push([a, b]); } return o.map(([p, q]) => pj(p, q, err(p, q))); })();
  let painted = null;
  return (x, y, w, h, path) => {
    painted = painted || floor() + surface() + edges() + `<path d="${rim}" fill="none" stroke="${MUTE}" stroke-width="3"/>`;
    const sc = Math.min(w / (bb[2] - bb[0]), h / (bb[3] - bb[1]));
    const bw = (bb[2] - bb[0]) * sc, bh = (bb[3] - bb[1]) * sc, bx = x + (w - bw) / 2, by = y + (h - bh) / 2;
    let marks = "";
    if (path) {
      marks = steps.slice(0, 6).map((q) => `<circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="10" fill="${INK}"/>`).join("");
      const q = steps[6];
      marks += `<circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="30" fill="#ffffff"/><circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="24" fill="${ACCENT}"/>`;
    }
    const tr = `translate(${f1(bx - bb[0] * sc)} ${f1(by - bb[1] * sc)}) scale(${sc.toFixed(4)})`;
    return { svg: `<g transform="${tr}">${painted}${marks}</g>`, box: [bx, by, bw, bh] };
  };
})();

// ---- Scene 1: count down the bowl ------------------------------------------------------
// The scene counts the count words it hears: after "count", each next spoken word that is the next of
// "one", "two", "three", "four", "five" is one count, with its start time in seconds after the section
// starts. Each count draws one box, one dot and one step, so adding "four" to the script and one
// cues.json line for 1.1four is the whole edit. A recording of scene 1 reads the counts from the words
// the recorder passes (?words=), and scene 2, which opens on scene 1's last frame, reads the same counts
// from the Open's words (?prevwords=). Screenshots with no words fall back to these values, from
// build/audio/01-open.words.json as voiced.
const S1_COUNT_TIMES = [4.49, 5.26, 5.77];
const S1_COUNT_WORDS = ["one", "two", "three", "four", "five"];

// The bowl is y = 720 - 320 u^2 across x = 960 + 400 u. The ball starts at u = -0.96, and each
// count is a step of gradient descent on u^2 at step size 0.25, so each step is half the last.
const S1_STEPS = [-0.96, -0.48, -0.24, -0.12, -0.06, -0.03];
const S1_CUES = ["1.1ball", "1.1one", "1.1two", "1.1three", "1.1four", "1.1five"];
const s1x = (u) => 960 + 400 * u, s1y = (u) => 720 - 320 * u * u;
// A point r px off the curve along its normal, so a ball of radius r sits on the line.
const s1on = (u, r) => { const m = -1.6 * u, n = Math.hypot(m, 1); return [s1x(u) + (m / n) * (r + 7), s1y(u) - (1 / n) * (r + 7)]; };
// The start time of each count word in the words param `name`, in order. The first count must follow
// "count" within two words and each later count must be the very next word, so a later "one" in the
// section never counts. Fewer than three counts, or no param, gives the voiced fallback.
function s1countTimes(name = "words") {
  const raw = DeckTalk.params.get(name);
  if (!raw) return S1_COUNT_TIMES;
  const words = raw.split(",").map((item) => { const at = item.lastIndexOf("@"); return [wordKey(item.slice(0, at)), parseFloat(item.slice(at + 1))]; });
  const c = words.findIndex(([w]) => w === "count");
  if (c < 0) return S1_COUNT_TIMES;
  const out = [];
  let next = words.findIndex(([w], k) => k > c && k <= c + 2 && w === S1_COUNT_WORDS[0]);
  while (next >= 0 && next < words.length && out.length < S1_COUNT_WORDS.length && words[next][0] === S1_COUNT_WORDS[out.length] && !isNaN(words[next][1])) {
    out.push(words[next][1]);
    next += 1;
  }
  return out.length >= 3 ? out : S1_COUNT_TIMES;
}
// The count's box x: n boxes 200 wide and 40 apart, centred on the frame, so three boxes sit at 620, 860, 1100.
const s1boxX = (n, i) => 960 - (n * 240 - 40) / 2 + 240 * i;
const s1curve = () => { let d = ""; for (let i = 0; i <= 84; i++) { const u = -1.05 + (2.1 * i) / 84; d += (i ? "L" : "M") + f1(s1x(u)) + " " + f1(s1y(u)); } return d; };
const s1ball = (u) => { const [x, y] = s1on(u, 28); return `<circle cx="${f1(x)}" cy="${f1(y)}" r="34" fill="#ffffff"/><circle cx="${f1(x)}" cy="${f1(y)}" r="28" fill="${ACCENT}"/>`; };
// With carry, the drawing is scene 1's last frame with every cue already shown, for scene 2 to open on.
function s1svg(carry = false) {
  const times = s1countTimes(carry ? "prevwords" : "words"), n = times.length, words = S1_COUNT_WORDS.slice(0, n);
  // Each dot marks where the ball stood, and appears as the ball leaves it. The ball stands at n + 1 places.
  const dots = S1_STEPS.slice(0, n).map((u, i) => { const [x, y] = s1on(u, 11); return `<circle data-cue="${S1_CUES[i + 1]}" data-fx="none" cx="${f1(x)}" cy="${f1(y)}" r="11" fill="${INK}"/>`; }).join("");
  const balls = S1_STEPS.slice(0, n + 1).map((u, i) => `<g class="ball" data-cue="${S1_CUES[i]}" data-fx="none">${s1ball(u)}</g>`).reverse();
  const box = (i, full) => `<rect class="box${full ? " full" : ""}" x="${s1boxX(n, i)}" y="790" width="200" height="80" rx="14"/><text class="lbl" x="${s1boxX(n, i) + 100}" y="843">${words[i]}</text>`;
  const svg = `
    <svg class="stage-svg" viewBox="0 0 1920 1080" aria-hidden="true">
      <path class="curve" data-cue="1.1bowl" data-fx="none" d="${s1curve()}"/>
      ${dots}
      ${carry ? balls[0] : balls.join("")}
      <g data-cue="1.1count" data-fx="none">${words.map((_, i) => box(i, false)).join("")}</g>
      ${words.map((_, i) => `<g data-cue="${S1_CUES[i + 1]}" data-fx="none">${box(i, true)}</g>`).join("")}
      <g data-cue="1.1word" data-fx="none">${times.map((t, i) => `<text class="time" x="${s1boxX(n, i) + 100}" y="926">${t.toFixed(2)} s</text>`).join("")}</g>
    </svg>`;
  return carry ? svg.replace(/ data-cue="[^"]*" data-fx="none"/g, "") : svg;
}
// Step 1.1's cue map for autoplay and screenshots, with one entry per count heard, 0.5 s apart after "three".
function s1cues() {
  const cues = { "1.1bowl": 0.3, "1.1ball": 1.6, "1.1count": 4.4, "1.1one": 5.4, "1.1two": 6.3, "1.1three": 6.6, "1.1word": 12.4 };
  s1countTimes().slice(3).forEach((_, i) => { cues[S1_CUES[4 + i]] = 7.1 + 0.5 * i; });
  return cues;
}

// ---- Scene 2: how it works --------------------------------------------------------------
// Real values, in seconds after section 3 starts: the start of each word of "For this lesson it

const S2_CW = 15, S2_X = 152, S2_EDIT_Y = 506, S2_FOCUS_Y = 556;
const S2_LINES = [

const s2code = (y, str, muted) => `<text class="code${muted ? " m" : ""}" x="${S2_X}" y="${y}">${str.split(/(\[[^\]]+\])/).filter(Boolean).map((part) => part.startsWith("[") ? `<tspan class="m">${part}</tspan>` : part).join("")}</text>`;
// "Change the script, and the video follows": an accent arrow from the script card, under both cards, up
// into the slide card. Its tail dot and first stretch snap in on the cue frame, and the rest draws in 0.3 s.
const S2_ARROW = "M530 712C530 860 1400 860 1400 722";
function s2line(times) {

  // the times are drawn bold enough that decktalk verify, which compares downscaled frames, sees
  // them arrive.
  const r = rng(21);

  for (let px = S2_X; px < S2_X + text.length * S2_CW; px += 7) {

    const h = inWord ? 12 + r() * 28 : 3 + r() * 3;

  }
  const stamps = words.map((w, k) => `<text class="t" x="${x(w.ci)}" y="${652 + (k % 2) * 30}">${times[k].toFixed(2)}</text>`).join("");
  svg += `<g data-cue="2.1aloud" data-fx="none">${wave}${stamps}</g>`;

  const bowl = words[words.length - 1], wx = S2_X + bowl.ci * S2_CW - 7, ww = 4 * S2_CW + 14;
  const [bx, by, , bh] = s2bowl.box, rx = bx - 12, ry = by - 12, x1 = wx + ww, y1 = S2_FOCUS_Y - 8, y2 = ry + bh / 2 + 12;

    `<path class="join" d="M${f1(x1)} ${y1}C${f1(x1 + 160)} ${y1} ${f1(rx - 160)} ${f1(y2)} ${f1(rx)} ${f1(y2)}"/>` +
    `<circle cx="${f1(x1)}" cy="${y1}" r="6" fill="${ACCENT}"/><circle cx="${f1(rx)}" cy="${f1(y2)}" r="6" fill="${ACCENT}"/>`;
  svg += `<g data-cue="2.1word" data-fx="none">${join}</g>`;
  return svg;
}

      ${eyebrows(["01 Open", "", "2.1mark"], ["02 How it works", "2.1mark", "2.1lesson"], ["03 How AI learns", "2.1lesson", ""])}
      <div class="s1" data-out="2.1mark">${s1svg(true)}</div>
      <div class="s2-markfade" data-out="2.1lesson" data-xdur="0.2"><p class="wordmark s2-mark">DeckTalk</p></div>
      <svg class="stage-svg" viewBox="0 0 1920 1080" aria-hidden="true" data-out="2.1lesson" data-xdur="0.2">
        <g data-cue="2.1script" data-fx="none">
          <text class="filelabel" x="120" y="230" fill="${MUTE}">script.md</text>
          <text class="filelabel" x="1000" y="230" fill="${MUTE}">deck/lesson.html</text>
          <rect x="120" y="250" width="820" height="450" rx="16" fill="#f4f4f5"/>
          ${S2_LINES.map(([y, str, muted]) => s2code(y, str, muted)).join("")}
          ${s2code(S2_EDIT_Y, S2_HEIGHT)}${s2line(S2_LINE_TIMES)}
        </g>
      </svg>
      <div class="s2-cardwrap" data-cue="2.1script" data-fx="none">
        <div class="s2-push"><div class="s2-frame" data-out="2.1lesson" data-xdur="0.15" data-xdelay="0.4"></div>${LESSON_T0}</div>
      </div>
      <svg class="stage-svg" viewBox="0 0 1920 1080" aria-hidden="true" data-out="2.1lesson" data-xdur="0.2">
        <g data-cue="2.1script" data-fx="none">${s2bowl.svg}</g>
        <rect data-cue="2.1word" data-fx="none" x="${f1(bx - 12)}" y="${f1(by - 12)}" width="${f1(bw + 24)}" height="${f1(bh + 24)}" rx="14" fill="none" stroke="${ACCENT}" stroke-width="4"/>
        <g data-cue="2.1follows" data-fx="none">
          <circle cx="530" cy="712" r="12" fill="${ACCENT}"/>
          <path class="follow" pathLength="1" d="${S2_ARROW}"/>
          <path d="M1382 744L1400 716L1418 744" fill="none" stroke="${ACCENT}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      ${footer([1, "", "2.1mark"], [2, "2.1mark", "2.1lesson"], [3, "2.1lesson", ""])}
    </div>`;
    } },
]});

// ---- The edit: step out, before, the change, after, step back in ------------------------------------
// Sections 4 to 8 of decktalk.toml are page 4 (scene 4), the BEFORE clip, page 6 (scene 6), the AFTER clip and
// page 8 (scene 7). Each clip is the page's last frame with the real footage in the player's video area, so
// each page opens and ends on exactly the frame its clip shares.
//
// Real values from the voiced demo video, copied from its build outputs: the start of each count word in its
// build/audio/01-open.words.json (before), and in a rebuild with ", four" added to the Open (after), that
// rebuild's narrate lines as `decktalk build` printed them (its sections numbered as the five parts, so the
// file numbers match the chips), and its verify totals. A build of this scaffold makes different values, so
// set them from your own builds.
const ED_BEFORE_TIMES = [4.49, 5.26, 5.77];
const ED_AFTER_TIMES = [4.42, 5.11, 5.62, 6.18];
const ED_LOG = [
  "[tts ] 01-open.mp3  30 words, est 12.9s ...",
  "[skip] 02-how-it-works.mp3  unchanged (15.05s)",
  "[skip] 03-how-ai-learns.mp3  unchanged (115.07s)",
  "[skip] 04-the-edit.mp3  unchanged (23.72s)",
  "[skip] 05-close.mp3  unchanged (10.06s)",
];
const ED_VERIFY = { pass: 67, total: 67, maxMs: 50 };
// The script panel quotes part 1 of script.md without its [beat] directions, and the one cues.json line.
const ED_LINE1 = "A bowl. A ball. Watch it step down on my count.";
const ED_LINE2 = "One. Two, three", ED_ADD = ", four";
const ED_CUE_LINE = 'cues.json  + { "cue": "1.1four", "on": "four" }';
const ED_PARTS = ["Open", "How it works", "How AI learns", "The edit", "Close"];
// Stills of the voiced demo's recordings and clips, as lossless WebP in deck/edit/. They show this scaffold's
// lesson and Open, so they match a fresh build. After you change either one, cut the stills again from your build.
const ED_IMG = {
  lesson: "edit/s3-last.webp",            // section 3's last frame, 1920 by 1080
  before0: "edit/before-first.webp",      // the BEFORE clip's first and last frames, 1152 by 648
  before1: "edit/before-last.webp",
  after0: "edit/after-first.webp",        // the AFTER clip's first and last frames, 1152 by 648
  after1: "edit/after-last.webp",
  beforeS: "edit/before-last-864.webp",   // the same last frames, 864 by 486, for the side by side
  afterS: "edit/after-last-864.webp",
};
// A point of the Open's 1920 by 1080 picture, placed in the player's video area at 0.6 scale.
const edV = (x, y) => [384 + 0.6 * x, 72 + 0.6 * y];

const edWave = `<svg class="glyph wave" width="26" height="22" viewBox="0 0 26 22" aria-hidden="true">${[6, 14, 20, 12, 8].map((h, i) => `<rect x="${1 + i * 5}" y="${11 - h / 2}" width="3" height="${h}" rx="1.5" fill="#ffffff"/>`).join("")}</svg>`;
const edTick = (color, w = 22) => `<svg class="glyph check" width="${w}" height="${w}" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 11.5L8.5 17L19 5" fill="none" stroke="${color}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function edChips(states = []) {
  return ED_PARTS.map((name, i) => `<div class="ed-chip c${i + 1} ${states[i] || ""}" style="left:${384 + 233 * i}px;--i:${Math.max(0, i - 1)}"><b>${i + 1}</b>${edWave}${edTick(MUTE)}<span class="nm">${name}</span><span class="say v">new voice</span><span class="say k">kept</span></div>`).join("");
}
function edBar(pill) {
  return `<div class="ed-bar"><div class="dots"><i></i><i></i><i></i></div><div class="name">decktalk-demo.mp4</div>` +
    `<div class="ed-pill before${pill === "before" ? "" : " off"}">Before</div><div class="ed-pill after${pill === "after" ? "" : " off"}">After</div></div>`;
}
// The script panel. `four` shows the added word, `mark` outlines line 2, and `dev` shows the cues.json line.
function edPanel({ four = false, mark = false, dev = false, cls = "" } = {}) {
  return `<div class="ed-panel ${cls}">
      <div class="tab ts">script · 1. Open</div><div class="tab tb off">build</div><div class="bp">Build</div>
      <div class="lines">${ED_LINE1}\n<span class="l2${mark ? " mark" : ""}">${ED_LINE2}<em class="${four ? "" : "none"}">${ED_ADD}</em>.</span></div>
      <div class="dev${dev ? "" : " off"}">${ED_CUE_LINE}</div>
      <div class="log off">${ED_LOG.map((line, i) => `<div class="${i ? "" : "lfirst"}">${line}</div>`).join("")}</div>
    </div>`;
}
// The player: video area (with the layers given), progress line, window outline and title bar.
function edPlayer(video, { pill = "", fill = "" } = {}) {
  return `<div class="ed-video">${video}</div>
      <div class="ed-prog"><i class="fill ${fill}"></i></div>
      <div class="ed-win"></div>
      ${edBar(pill)}`;
}
const edFrame = (key, cls = "") => `<img class="frame ${cls}" src="${ED_IMG[key]}" alt="">`;
// A class change on the slide: add or remove `cls` on every element matching `sel`.
const edAdd = (slide, sel, cls) => slide.querySelectorAll(sel).forEach((el) => el.classList.add(cls));
const edDel = (slide, sel, cls) => slide.querySelectorAll(sel).forEach((el) => el.classList.remove(cls));

scene(4, { name: "The edit", steps: [
  // It opens on the lesson's last frame, full frame with its chrome.
  { id: "4.1", hold: 12.4,
    cues: { "4.1out": 1.78, "4.1video": 4.88, "4.1parts": 6.66, "4.1script": 8.6, "4.1start": 10.16 },
    on: {
      // "step out": the whole frame, chrome and all, snaps to 90 % inside the player and eases into it.
      "4.1out": (slide) => { edAdd(slide, ".ed-inside", "off"); edDel(slide, ".ed-player", "off"); edAdd(slide, ".lesson", "shrink"); },
      // "one video": the progress line fills to the end of the lesson.
      "4.1video": (slide) => edAdd(slide, ".ed-prog .fill", "watched"),
      // "five parts": five chips, the three watched parts filled.
      "4.1parts": (slide) => edDel(slide, ".ed-chips", "off"),
      // "one script": the script panel rises under the chips.
      "4.1script": (slide) => { edDel(slide, ".ed-panel", "off"); edAdd(slide, ".ed-panel", "rise"); },
      // "how it started": back to 0, part 1 outlined, the Open's first frame of the clip, the Before pill.
      "4.1start": (slide) => {
        edDel(slide, ".ed-prog .fill", "watched"); edDel(slide, ".before0", "off"); edAdd(slide, ".lesson", "off");
        edAdd(slide, ".ed-chip.c1", "focus"); edDel(slide, ".ed-pill.before", "off"); edAdd(slide, ".l2", "mark");
      },
    },
    render: () => `
    <div class="slide ed">
      <img class="ed-inside" src="${ED_IMG.lesson}" alt="">
      <div class="ed-player off">${edPlayer(`<img class="lesson" src="${ED_IMG.lesson}" alt="">${edFrame("before0", "before0 off")}`)}</div>
      <div class="ed-chips off">${edChips(["watched", "watched", "watched"])}</div>
      ${edPanel({ cls: "off" })}
    </div>` },
]});

// The ghost ball where the Open's next step would land, and the new box where a fourth count would sit,
// both drawn in the player over the paused picture.
function edMarks() {
  // The pen circle rings the ball and its ghost together, so the mark is big enough to see at phone size.
  const [gx, gy] = edV(...s1on(-0.06, 28)), [bx0, by0] = edV(...s1on(-0.12, 28)), [bx, by] = edV(s1boxX(3, 3), 790);
  return `<svg class="ed-marks" viewBox="0 0 1920 1080" aria-hidden="true">
      <g class="mk-ghost off"><circle class="ghost" cx="${f1(gx)}" cy="${f1(gy)}" r="17"/><ellipse class="pen" cx="${f1((gx + bx0) / 2)}" cy="${f1((gy + by0) / 2 - 4)}" rx="92" ry="56"/></g>
      <g class="mk-box off"><rect class="nbox" x="${f1(bx)}" y="${f1(by)}" width="120" height="48" rx="8"/><text class="nlab" x="${f1(bx + 60)}" y="${f1(by + 32)}">four</text></g>
    </svg>`;
}

scene(6, { name: "The edit", steps: [
  // It opens on the BEFORE clip's last frame, with the player as page 4 left it.
  { id: "6.1", hold: 17.1,
    cues: { "6.1step": 1.03, "6.1four": 3.52, "6.1box": 5.14, "6.1build": 7.48, "6.1aloud": 10.32, "6.1kept": 12.2, "6.1new": 14.87 },
    on: {
      "6.1step": (slide) => edDel(slide, ".mk-ghost", "off"),
      "6.1four": (slide) => edDel(slide, ".l2 em", "none"),
      "6.1box": (slide) => { edDel(slide, ".mk-box", "off"); edDel(slide, ".ed-panel .dev", "off"); },
      // "press build": the Build pill fills, the player dims, and the panel shows the rebuild's real log.
      "6.1build": (slide) => {
        edAdd(slide, ".ed-panel .bp", "on"); edDel(slide, ".ed-dim", "off");
        edAdd(slide, ".ed-panel .lines, .ed-panel .dev, .ed-panel .ts", "off"); edDel(slide, ".ed-panel .log, .ed-panel .tb", "off");
      },
      "6.1aloud": (slide) => { edDel(slide, ".ed-chip.c1", "focus"); edAdd(slide, ".ed-chip.c1", "new"); edAdd(slide, ".ed-panel .log .lfirst", "hot"); },
      "6.1kept": (slide) => [2, 3, 4, 5].forEach((n) => { edDel(slide, `.ed-chip.c${n}`, "watched"); edAdd(slide, `.ed-chip.c${n}`, "kept"); }),
      // "new start": the script again with the new line, the After pill, and the AFTER clip's first frame.
      "6.1new": (slide) => {
        edDel(slide, ".ed-panel .bp", "on"); edAdd(slide, ".ed-dim, .mk-ghost, .mk-box, .before1", "off");
        edDel(slide, ".ed-panel .lines, .ed-panel .dev, .ed-panel .ts", "off"); edAdd(slide, ".ed-panel .log, .ed-panel .tb", "off");
        edDel(slide, ".after0", "off"); edAdd(slide, ".ed-pill.before", "off"); edDel(slide, ".ed-pill.after", "off");
      },
    },
    render: () => `
    <div class="slide ed">
      ${edPlayer(`${edFrame("before1", "before1")}${edFrame("after0", "after0 off")}`, { pill: "before" })}
      <div class="ed-dim off"></div>
      ${edMarks()}
      <div class="ed-prog-top"></div>
      <div class="ed-chips">${edChips(["watched focus", "watched", "watched"])}</div>
      ${edPanel({ four: false, mark: true })}
    </div>` },
]});

// The proof: before and after side by side, with each count's time under its box.
function edProof() {
  const row = (left, words, times, after) => words.map((w, i) => {
    const x = left + 216 * i;
    return `<div class="ed-cbox${after && i === 3 ? " add" : ""}" style="left:${x}px">${w}</div>` +
      `<div class="ed-time${after ? " a" : ""} p-times off" style="left:${x}px">${times[i].toFixed(2)}</div>` +
      (after ? `<div class="ed-check p-checks off" style="left:${x}px"><svg width="200" height="40" viewBox="0 0 200 40" aria-hidden="true"><path d="M86 20L96 30L116 8" fill="none" stroke="${ACCENT}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>` : "");
  }).join("");
  return `<div class="ed-proof p-proof off">
      <div class="ed-pill before" style="left:64px">Before</div><div class="ed-pill after" style="left:992px">After</div>
      <div class="ed-still" style="left:64px"><img src="${ED_IMG.beforeS}" alt=""></div>
      <div class="ed-still" style="left:992px"><img src="${ED_IMG.afterS}" alt=""></div>
      ${row(64, S1_COUNT_WORDS.slice(0, ED_BEFORE_TIMES.length), ED_BEFORE_TIMES, false)}
      ${row(992, S1_COUNT_WORDS.slice(0, ED_AFTER_TIMES.length), ED_AFTER_TIMES, true)}
      <div class="ed-note p-times off">seconds: when each count is heard</div>
      <div class="ed-badge p-checks off">each picture on its word, within ±${ED_VERIFY.maxMs} ms</div>
      <div class="ed-vdev p-checks off">decktalk verify · ${ED_VERIFY.pass} of ${ED_VERIFY.total} pass</div>
    </div>`;
}

scene(7, { name: "The edit", steps: [
  // It opens on the AFTER clip's last frame, with the player as page 6 left it.
  { id: "7.1", hold: 10.2,
    cues: { "7.1box": 1.32, "7.1moved": 3.34, "7.1checked": 6.27, "7.1back": 7.73 },
    on: {
      "7.1box": (slide) => { edAdd(slide, ".p-player", "off"); edDel(slide, ".p-proof", "off"); },
      "7.1moved": (slide) => edDel(slide, ".p-times", "off"),
      "7.1checked": (slide) => edDel(slide, ".p-checks", "off"),
      // "step back": the player returns on the Close's first frame, then grows into it while the chrome fades.
      "7.1back": (slide, ctx) => {
        edAdd(slide, ".p-proof", "off"); edDel(slide, ".p-back", "off");
        const close = slide.querySelector(".ed-close");
        close.addEventListener("animationend", () => { close.classList.remove("grow"); close.classList.add("grown"); }, { once: true });
        close.classList.add(ctx.frozen ? "grown" : "grow"); edAdd(slide, ".p-back .ed-fade-me", "ed-fade");
      },
    },
    render: () => `
    <div class="slide ed">
      <div class="p-player">
        ${edPlayer(edFrame("after1"), { pill: "after" })}
        <div class="ed-chips">${edChips(["new still", "kept still", "kept still", "kept still", "kept still"])}</div>
        ${edPanel({ four: true, dev: true, mark: true })}
      </div>
      ${edProof()}
      <div class="p-back off">
        <div class="ed-close">${eyebrows(["05 Close", "", ""])}${footer(5)}</div>
        <div class="ed-fade-me"><div class="ed-prog"><i class="fill full"></i></div><div class="ed-win"></div>${edBar("")}<div class="ed-chips">${edChips(["", "", "", "", "lead"])}</div></div>
      </div>
    </div>` },
]});

// ---- Scene 5: close ---------------------------------------------------------------------
// It opens on white with its eyebrow and tracker, the frame the edit's player grows into. "video" brings
// in the tagline and the Open's bowl with
// the count finished: all four dots and the ball at the bottom, u = 0. The wordmark lands where the
// Open's did, the licence sits in the Open's row of times, and the address in its row of count boxes.
const s5bowl = () => {
  const dots = S1_STEPS.slice(0, 4).map((u) => { const [x, y] = s1on(u, 11); return `<circle cx="${f1(x)}" cy="${f1(y)}" r="11" fill="${INK}"/>`; }).join("");
  return `<path class="curve" d="${s1curve()}"/>${dots}${s1ball(0)}`;
};

scene(5, { name: "Close", steps: [
  { id: "5.1", hold: 14, cues: { "5.1clear": 0.6, "5.1made": 3.0, "5.1cap": 3.8, "5.1url": 7.7 },
    on: handoffs(["5.1clear"]),
    render: () => `
    <div class="slide s5">
      ${eyebrows(["05 Close", "", ""])}
      <p class="s5-tag" data-in="5.1clear" data-xdur="0.15">Update your video the way you update a doc.</p>
      <svg class="stage-svg s1" viewBox="0 0 1920 1080" aria-hidden="true" data-in="5.1clear" data-xdur="0.15">
        ${s5bowl()}
        <g data-cue="5.1cap" data-fx="none"><text class="s5-lic" x="960" y="926">Apache-2.0 · github.com/jacobcbeaudin/decktalk</text></g>
        <g data-cue="5.1url" data-fx="none"><rect x="720" y="790" width="480" height="80" rx="14" fill="${ACCENT}"/><text class="s5-url" x="960" y="846">decktalk.app</text></g>
      </svg>
      <p class="wordmark s5-mark" data-cue="5.1made" data-fx="none">DeckTalk</p>
      ${footer(5)}
    </div>` },
]});
// Narration t=0 waits until every face this page uses has loaded and been painted once. The fonts use
// font-display: block, and nothing asks for them before the first step mounts, so without this a section
// that opens on text (every hand-off does) records its first frame with the text still invisible.
document.addEventListener("DOMContentLoaded", () => {
  // The runtime mounts a scene's first step at narration t=0, and the recorder can capture that frame
  // before the step paints, which leaves one blank frame on the cut. So the first step is drawn here
  // first, with every cued element hidden, which is exactly its t=0 frame, and the mounted step covers
  // it. Freeze mode and the index page draw no underlay.
  const params = new URLSearchParams(location.search), n = params.get("scene"), under = document.getElementById("t0");
  if (under && n && !params.has("step") && T0_RENDER[n]) under.innerHTML = T0_RENDER[n]({ frozen: false }); else if (under) under.remove();
  const faces = ['600 104px "Inter Tight"', '500 22px "JetBrains Mono"', '700 25px "JetBrains Mono"', '600 40px "JetBrains Mono"', '500 36px Inter', '600 28px Inter',
    '500 36px "JetBrains Mono"', '600 30px "JetBrains Mono"', '500 24px Inter', '600 22px Inter', '500 30px Inter', '500 32px Inter'];
  // The edit's stills are decoded before t=0, so a still that shows on a cue is never drawn late.
  const stills = n && Number(n) >= 4 && Number(n) <= 7 ? Object.values(ED_IMG).map((src) => { const img = new Image(); img.src = src; return img.decode().catch(() => {}); }) : [];
  const painted = Promise.all([...faces.map((f) => document.fonts.load(f)), ...stills]).then(() => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(r)))));
  window.__sceneReady = Promise.all([window.__sceneReady, painted]).then(([ready]) => ready);
});
</script>
