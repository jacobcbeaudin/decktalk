<style>

  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: block; src: url("./fonts/JetBrainsMono-greek.woff2") format("woff2"); unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }

  .footer .brand, .footer .track { display: flex; align-items: center; gap: 14px; font: 500 22px/28px var(--mono); letter-spacing: .14em; color: var(--mute); }

  /* Scene 1 */

  .ghostchip { transition: opacity .6s ease; }

<script src="decktalk-runtime.js"></script>
<script>
// Scene numbers are the "## N." sections of script.md. Each step id is N.S and each cue id
// is the step id plus a short word. cues.json maps every cue id to the spoken phrase it
// lands on. Open this file with no query for an index of scenes and steps, and add
// ?step=ID to freeze one step with everything revealed.
//
// Each step is a { id, hold, cues, render } object. The HTML between the backticks of
// `render` is safe to edit freely. The `cues:` object and the data-cue attributes in that
// HTML must use the same ids, and cues.json names those same ids. A backslash inside the
// backticks must be written twice, so a data-tex value reads data-tex="\\frac{1}{2}".
// The `enter:` and `on:` blocks are JavaScript that runs when the step mounts and when a
// cue fires. Each function receives the step's slide element and a context object
// { id, at, frozen, step }, so a handler finds its elements with slide.querySelector and
// needs no global. A scene that needs neither block can delete both whole. Copy a whole
// step object to add a step.

// The footer of every slide: the four-tick mark and DECKTALK at left, the scene tracker at right.
const SCENES_TOTAL = 5;
function footer(n) {
  const ticks = Array.from({ length: SCENES_TOTAL }, (_, i) => {
    const x = 1 + i * 12;
    return i + 1 === n
      ? `<rect class="cur" x="${x}" y="8" width="3" height="22"/><circle class="cur" cx="${x + 1.5}" cy="3" r="2"/>`
      : `<rect x="${x}" y="14" width="3" height="16"/>`;
  }).join("");
  return `
    <div class="footer">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <line x1="4" y1="12" x2="4" y2="20"/><line class="tall" x1="9.5" y1="8" x2="9.5" y2="20"/><circle cx="9.5" cy="3.75" r="2.25"/>
          <line x1="15" y1="12" x2="15" y2="20"/><line x1="20.5" y1="12" x2="20.5" y2="20"/>
        </svg>
        <span>DECKTALK</span>
      </div>
      <div class="track">
        <svg class="ticks" viewBox="0 0 54 30" width="54" height="30" aria-hidden="true">${ticks}</svg>
        <span>0${n} / 0${SCENES_TOTAL}</span>
      </div>
    </div>`;
}

// ---- Scene 1: cold open ---------------------------------------------------------------
// Ticks sit under each word of the script line. JetBrains Mono advances 0.6 em, so at 32 px a
// character is 19.2 px and a word's centre is (start + length / 2) characters in.
const S1_WORDS = [[0, 3], [4, 5], [10, 6], [17, 4], [22, 3], [26, 6], [33, 6]];
const s1ticks = S1_WORDS.map(([start, len], i) => {
  const x = Math.round((start + len / 2) * 19.2) - 1;
  const cue = i === 1 ? "1.1curve" : i === 5 ? "1.1number" : null;
  return `<i style="left:${x}px"></i>` + (cue ? `<i class="on" style="left:${x}px" data-cue="${cue}" data-fx="fade"></i>` : "");
}).join("");

DeckTalk.scene(1, { name: "Open", steps: [
  { id: "1.1", hold: 22, cues: { "1.1curve": 0.4, "1.1number": 2.2, "1.1mark": 4.5, "1.1cap": 17 }, render: () => `
    <div class="slide">
      <p class="eyebrow">Scene 01</p>
      <div class="panel" style="left:120px;top:240px;width:800px;height:400px">
        <div class="filelabel abs" style="left:24px;top:40px">script.md</div>
        <div class="s1-line">
          <span class="mono" data-at="0" data-sync>The curve rises, then the number lands.</span><span class="cursor"></span>
        </div>
        <div class="s1-ticks">${s1ticks}</div>
      </div>
      <div class="panel s1-fig" style="left:1016px;top:240px;width:784px;height:400px">
        <svg class="abs" style="left:40px;top:40px" viewBox="0 0 440 320" width="440" height="320">
          <line class="ax" x1="20" y1="290" x2="420" y2="290"/>
          <line class="ax" x1="20" y1="20" x2="20" y2="290"/>
          <path class="curve" pathLength="1" data-cue="1.1curve" data-fx="draw" data-dur="1.2" d="M20,270 C150,268 250,240 420,40"/>
        </svg>
        <div class="s1-big" data-cue="1.1number" data-fx="pop">3×</div>
      </div>
      <div class="s1-mark">
        <span class="wordmark" data-cue="1.1mark">DeckTalk</span>
        <span class="body" data-cue="1.1cap" style="color:var(--mute)">One script, one voice, one mp4.</span>
      </div>
      ${footer(1)}
    </div>` },
]});

// ---- Scene 2: four files, one number --------------------------------------------------
DeckTalk.scene(2, { name: "Four files", steps: [
  { id: "2.1", hold: 28, cues: { "2.1script": 2.5, "2.1words": 5, "2.1cue": 8, "2.1slide": 11, "2.1one": 14 },
    on: { "2.1one": (slide) => slide.classList.add("lit") },
    render: () => `
    <div class="slide">
      <p class="eyebrow">Scene 02</p>
      <h1 class="title">A project is four files that refer to each other by one number.</h1>
      <div class="col" data-cue="2.1script" style="left:120px;top:360px">
        <div class="filelabel">script.md</div>
        <pre class="snippet">Take a step, and the
<span class="k">learning rate</span>, eta,
scales its length.</pre>
      </div>
      <div class="col" data-cue="2.1words" style="left:1020px;top:360px">
        <div class="filelabel">03.words.json</div>
        <pre class="snippet"><span class="k">{"word": "learning", "start": 15.66}
{"word": "rate",     "start": 16.18}</span>
{"word": "eta",      "start": 16.70}</pre>
      </div>
      <div class="col" data-cue="2.1cue" style="left:120px;top:598px">
        <div class="filelabel">cues.json</div>
        <pre class="snippet">{ "cue": <span class="k">"3.1eq"</span>,
  "on": <span class="k">"learning rate"</span> }</pre>
      </div>
      <div class="col" data-cue="2.1slide" style="left:1020px;top:598px">
        <div class="filelabel">index.html</div>
        <pre class="snippet">&lt;span class="chip"
      <span class="k">data-cue="3.1eq"</span>
      data-tex="\\eta = 0.9"&gt;</pre>
      </div>
      ${footer(2)}
    </div>` },
]});

// ---- Scene 3: gradient descent on a three-dimensional loss surface ----------------------
// The surface, the contours, the ball, its trail, the two arrows, the overshoot ghost, and the
// minimum ring are three.js objects. Cue handlers drive every animation from DeckTalk's clock.
// s3figure builds the renderer and every object without touching the page, and returns
// { warm, attach }, or null without three.js or WebGL. attach(slide) puts the canvas in the
// slide's figure and returns the cue handlers, which the step's enter stores on its slide as
// slide.s3. A frozen figure returns no handlers.
function s3figure(frozen) {
  const T = window.THREE;
  if (!T) { console.warn("decktalk: three.js missing, so the scene 3 figure is empty"); return null; }
  let renderer;
  try {
    renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) { console.warn("decktalk: no WebGL, so the scene 3 figure is empty"); return null; }
  const W = 960, H = 570, R = 0.22, ACCENT = 0x2c1fea, INK = 0x0a0a0a;
  // three.js takes colours as numbers, so these repeat the --hair and --dim tokens above.
  const SURFACE = 0xe4e4e7, DIM = 0xa3a3ad;
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.setClearColor(0xffffff, 0);
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(32, W / H, 0.1, 100);
  camera.position.set(5.77, 6.47, 6.77);
  camera.lookAt(0, 1.2, 0);
  // r160 lights are physical, so the legacy intensities carry a factor of pi. Low ambient and a
  // stronger key light keep the top of the bowl pale and shade the walls, so the form reads.
  scene.add(new T.AmbientLight(0xffffff, 0.25 * Math.PI));
  const sun = new T.DirectionalLight(0xffffff, 0.75 * Math.PI);
  sun.position.set(3, 6, 2);
  scene.add(sun);
  const fill = new T.DirectionalLight(0xffffff, 0.35 * Math.PI);
  fill.position.set(-3, 4, -2);
  scene.add(fill);

  const h = (x, z) => 0.18 * (x * x + 0.6 * z * z) + 0.15 * Math.sin(x) * Math.cos(z);
  const grad = (x, z) => [0.36 * x + 0.15 * Math.cos(x) * Math.cos(z), 0.216 * z - 0.15 * Math.sin(x) * Math.sin(z)];
  const normalAt = (x, z) => { const [gx, gz] = grad(x, z); return new T.Vector3(-gx, 1, -gz).normalize(); };
  const MIN = [-0.3860, 0.0];
  const clamp01 = (k) => Math.min(1, Math.max(0, k));
  const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
  const easeOut = (k) => 1 - Math.pow(1 - k, 3);

  // Every material carries a base opacity, a fade (0..1) and the scene-wide dim factor. A
  // material at zero opacity is hidden outright, so it never writes depth over the surface.
  const mats = [];
  const track = (m, base) => { m.transparent = true; m.userData.base = base; m.userData.fade = 1; m.opacity = base; mats.push(m); return m; };
  let dimK = 1;
  const apply = () => mats.forEach((m) => { m.opacity = m.userData.base * m.userData.fade * dimK; m.visible = m.opacity > 0.002; });

  // The surface, shaded pale, with iso-loss contours lifted just above it.
  const N = 60;
  const geo = new T.PlaneGeometry(6, 6, N, N);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, h(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  const surfMat = track(new T.MeshLambertMaterial({ color: SURFACE, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }), 1);
  surfMat.userData.fade = 0;
  scene.add(new T.Mesh(geo, surfMat));

  // Contours by marching squares over the height grid, twelve levels from the minimum to the rim.
  const contours = (() => {
    const G = 90, step = 6 / G, LIFT = 0.01, out = [];
    const grid = [];
    for (let i = 0; i <= G; i++) { grid.push([]); for (let j = 0; j <= G; j++) grid[i].push(h(-3 + i * step, -3 + j * step)); }
    const lo = h(MIN[0], MIN[1]), hi = 2.4, levels = 12;
    for (let L = 1; L <= levels; L++) {
      const c = lo + (hi - lo) * L / (levels + 0.5);
      for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) {
        const x0 = -3 + i * step, z0 = -3 + j * step, x1 = x0 + step, z1 = z0 + step;
        const a = grid[i][j], b = grid[i + 1][j], d = grid[i + 1][j + 1], e = grid[i][j + 1]; // corners: (x0,z0) (x1,z0) (x1,z1) (x0,z1)
        const idx = (a > c ? 1 : 0) | (b > c ? 2 : 0) | (d > c ? 4 : 0) | (e > c ? 8 : 0);
        if (idx === 0 || idx === 15) continue;
        const lerp = (p, q, vp, vq) => p + (q - p) * (c - vp) / (vq - vp);
        const top = [lerp(x0, x1, a, b), z0], right = [x1, lerp(z0, z1, b, d)], bottom = [lerp(x0, x1, e, d), z1], left = [x0, lerp(z0, z1, a, e)];
        const seg = (p, q) => out.push(p[0], c + LIFT, p[1], q[0], c + LIFT, q[1]);
        switch (idx) {
          case 1: case 14: seg(left, top); break;
          case 2: case 13: seg(top, right); break;
          case 3: case 12: seg(left, right); break;
          case 4: case 11: seg(right, bottom); break;
          case 5: seg(left, top); seg(right, bottom); break;
          case 6: case 9: seg(top, bottom); break;
          case 7: case 8: seg(left, bottom); break;
          case 10: seg(top, right); seg(left, bottom); break;
        }
      }
    }
    const g = new T.BufferGeometry();
    g.setAttribute("position", new T.Float32BufferAttribute(out, 3));
    return g;
  })();
  const contourMat = track(new T.LineBasicMaterial({ color: INK }), 0.22);
  contourMat.userData.fade = 0;
  // The contours draw after the surface. Drawn first, a contour pixel stays see-through, and the
  // axes under the canvas show through the bowl as a row of dashes.
  const contourLines = new T.LineSegments(contours, contourMat);
  contourLines.renderOrder = 1;
  scene.add(contourLines);

  // Iterates of gradient descent, and the overshoot ghost's.
  const iterate = (x, z, lr, n) => { const p = [[x, z]]; for (let i = 0; i < n; i++) { const [gx, gz] = grad(x, z); x -= lr * gx; z -= lr * gz; p.push([x, z]); } return p; };
  const P = iterate(-2.4, 1.9, 0.9, 12);
  const GH = iterate(-2.4, 1.9, 4.5, 4);
  const lifted = (x, z, lift) => new T.Vector3(x, h(x, z) + lift, z);
  const chord = (a, b, lift, n) => { const pts = []; for (let i = 0; i <= n; i++) { const s = i / n; pts.push(lifted(a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s, lift)); } return pts; };

  // A trail is a line that grows as its ball moves, hugging the surface.
  function makeTrail(material, capacity, dashed) {
    const g = new T.BufferGeometry();
    g.setAttribute("position", new T.BufferAttribute(new Float32Array(capacity * 3), 3));
    g.setDrawRange(0, 0);
    const line = new T.Line(g, material);
    line.frustumCulled = false;
    scene.add(line);
    const done = [];
    const tr = { line, done, active: null };
    tr.write = (extra) => {
      const all = done.concat(extra);
      const arr = g.attributes.position.array;
      all.forEach((p, i) => { arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z; });
      g.setDrawRange(0, all.length);
      g.attributes.position.needsUpdate = true;
      if (dashed) line.computeLineDistances();
      tr.active = extra;
    };
    tr.commit = (pts) => { done.push(...pts); tr.active = null; tr.write([]); };
    return tr;
  }
  const trail = makeTrail(track(new T.LineBasicMaterial({ color: INK }), 0.7), 400, false);
  const ghostTrail = makeTrail(track(new T.LineDashedMaterial({ color: INK, dashSize: 0.12, gapSize: 0.08 }), 0.4), 200, true);
  ghostTrail.line.computeLineDistances();

  // The ball, with a soft accent halo on the surface under it that marks the current point.
  const ballMat = track(new T.MeshLambertMaterial({ color: ACCENT }), 1);
  const ball = new T.Mesh(new T.SphereGeometry(R, 32, 24), ballMat);
  ball.scale.setScalar(0.001);
  scene.add(ball);
  const haloMat = track(new T.MeshBasicMaterial({ color: ACCENT, depthWrite: false }), 0.4);
  const halo = new T.Mesh(new T.CircleGeometry(0.36, 48), haloMat);
  halo.scale.setScalar(0.001);
  scene.add(halo);
  const placeBall = (x, z, scale) => {
    ball.position.copy(lifted(x, z, R));
    const n = normalAt(x, z);
    halo.position.copy(lifted(x, z, 0)).addScaledVector(n, 0.03);
    halo.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), n);
    if (scale !== undefined) { ball.scale.setScalar(scale); halo.scale.setScalar(scale); }
  };
  placeBall(P[0][0], P[0][1]);
  const ghostMat = track(new T.MeshLambertMaterial({ color: ACCENT }), 0.35);
  ghostMat.userData.fade = 0;
  const ghost = new T.Mesh(new T.SphereGeometry(R, 32, 24), ghostMat);
  ghost.position.copy(lifted(GH[0][0], GH[0][1], R));
  scene.add(ghost);

  // The two arrows at the first point: grey uphill along the gradient, accent the other way.
  function arrow(color, dir, origin) {
    const m = track(new T.MeshBasicMaterial({ color }), 1);
    m.userData.fade = 0;
    const g = new T.Group();
    const shaft = new T.Mesh(new T.CylinderGeometry(0.03, 0.03, 0.7, 12), m);
    shaft.position.y = 0.35;
    const head = new T.Mesh(new T.ConeGeometry(0.08, 0.22, 16), m);
    head.position.y = 0.81;
    g.add(shaft, head);
    g.position.copy(origin);
    g.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), dir.clone().normalize());
    scene.add(g);
    m.userData.group = g;
    return m;
  }
  const [g0x, g0z] = grad(P[0][0], P[0][1]);
  const upDir = new T.Vector3(g0x, g0x * g0x + g0z * g0z, g0z).normalize();
  const arrowOrigin = lifted(P[0][0], P[0][1], R + 0.02);
  const upMat = arrow(DIM, upDir, arrowOrigin);
  const downMat = arrow(ACCENT, upDir.clone().negate(), arrowOrigin);

  // The minimum ring, popped in with the final settle.
  const ringMat = track(new T.MeshBasicMaterial({ color: ACCENT }), 0.7);
  const ring = new T.Mesh(new T.TorusGeometry(0.42, 0.03, 12, 64), ringMat);
  ring.position.copy(lifted(MIN[0], MIN[1], 0.03));
  ring.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), normalAt(MIN[0], MIN[1]));
  ring.scale.setScalar(0.001);
  scene.add(ring);

  // The input plane is DOM, drawn from 3D points projected on every render, so it adds no WebGL
  // draw. The floor sits just below the lowest point of the surface. Its two axes run from the
  // far corner, behind the bowl, out past the left and right corners, and the loss axis rises
  // from that corner. The floor dot, the θ tag, and the drop line follow the ball.
  const FLOOR = -0.12, AX = 3.3, TOP = 3.5;
  let host = null; // the slide's .fig3, set by attach
  camera.updateMatrixWorld();
  const pv = new T.Vector3();
  const toScreen = (x, y, z) => { pv.set(x, y, z).project(camera); return [(pv.x + 1) / 2 * W, (1 - pv.y) / 2 * H]; };
  // A value is written only when it changes, so a still frame costs the page no style work.
  const q = (sel) => host.querySelector(sel);
  const written = new Map();
  const put = (el, key, value, style) => {
    const prev = written.get(el) || {};
    if (prev[key] === value) return;
    prev[key] = value; written.set(el, prev);
    if (style) el.style[key] = value; else el.setAttribute(key, value);
  };
  const segment = (el, a, b) => put(el, "d", `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`);
  const at = (el, p) => { put(el, "left", `${p[0].toFixed(1)}px`, true); put(el, "top", `${p[1].toFixed(1)}px`, true); };
  let dropK = frozen ? 1 : 0;
  const place = () => {
    const corner = toScreen(-3, FLOOR, -3);
    segment(q(".ax.t1"), corner, toScreen(-3, FLOOR, AX));
    segment(q(".ax.t2"), corner, toScreen(AX, FLOOR, -3));
    segment(q(".ax.l"), corner, toScreen(-3, TOP, -3));
    at(q(".lab.t1"), toScreen(-3, FLOOR, AX + 0.45));
    at(q(".lab.t2"), toScreen(AX + 0.45, FLOOR, -3));
    at(q(".lab.l"), toScreen(-3, TOP, -3));
    const bx = ball.position.x, bz = ball.position.z;
    const f = toScreen(bx, FLOOR, bz), s = toScreen(bx, h(bx, bz), bz);
    const top = [f[0] + (s[0] - f[0]) * dropK, f[1] + (s[1] - f[1]) * dropK];
    const dot = q(".dot"), drop = q(".drop");
    put(dot, "cx", f[0].toFixed(1)); put(dot, "cy", f[1].toFixed(1));
    put(drop, "x1", f[0].toFixed(1)); put(drop, "y1", f[1].toFixed(1));
    put(drop, "x2", top[0].toFixed(1)); put(drop, "y2", top[1].toFixed(1));
    at(q(".tag"), f);
    at(q(".lossl"), [(f[0] + s[0]) / 2, (f[1] + s[1]) / 2]);
    put(q(".under"), "opacity", dimK.toFixed(3), true);
    put(q(".over"), "opacity", dimK.toFixed(3), true);
    if (!host.classList.contains("placed")) host.classList.add("placed");
  };

  // Animation: every active animation ticks from DeckTalk's clock; the scene renders while any
  // is active and once after each state change otherwise.
  const clock = () => window.__decktalk.now();
  const anims = new Set();
  let raf = 0, inStep = false;
  const render = () => { apply(); renderer.render(scene, camera); if (host) place(); };
  const loop = () => {
    if (raf || inStep) return;
    raf = requestAnimationFrame(() => {
      raf = 0; inStep = true;
      const t = clock();
      for (const a of [...anims]) {
        const k = clamp01((t - a.t0) / a.dur);
        a.tick(k);
        if (k >= 1) { anims.delete(a); if (a.done) a.done(); }
      }
      inStep = false;
      render();
      if (anims.size) loop();
    });
  };
  // A cue takes effect on its own frame: the first tick runs now and one render follows at the end
  // of the task, however many animations the cue started.
  let pending = false;
  const renderSoon = () => { if (pending) return; pending = true; queueMicrotask(() => { pending = false; render(); }); };
  const add = (dur, tick, done, owner) => { const a = { t0: clock(), dur, tick, done, owner }; if (!isFinite(a.t0)) a.t0 = 0; anims.add(a); tick(0); renderSoon(); loop(); return a; };
  const fadeTo = (m, target, dur, done) => { const from = m.userData.fade; add(dur, (k) => { m.userData.fade = from + (target - from) * easeOut(k); }, done); };
  const dimTo = (target, dur) => { const from = dimK; add(dur, (k) => { dimK = from + (target - from) * easeOut(k); }); };
  // Move a ball from where it is to b over dur seconds along the chord lifted to the surface,
  // growing its trail. The move eases out, so the ball leaves on the cued word and settles after
  // it, and the first recorded frame after the cue already shows the departure. A move that
  // arrives while another is under way takes over from there.
  const move = (mesh, tr, b, dur, done, place) => {
    anims.forEach((x) => { if (x.owner === mesh) anims.delete(x); });
    if (tr.active && tr.active.length) tr.commit(tr.active);
    const a = [mesh.position.x, mesh.position.z];
    const pts = chord(a, b, R, 20), tpts = chord(a, b, 0.02, 20);
    add(dur, (k) => {
      const s = easeOut(k), f = s * 20, i = Math.floor(f), u = f - i;
      const p = i >= 20 ? pts[20] : pts[i].clone().lerp(pts[i + 1], u);
      if (place) place(p.x, p.z); else mesh.position.copy(p);
      const tp = i >= 20 ? tpts[20] : tpts[i].clone().lerp(tpts[i + 1], u);
      tr.write(tpts.slice(0, Math.min(i + 1, 21)).concat(i >= 20 ? [] : [tp]));
    }, () => { tr.commit(tpts); if (done) done(); }, mesh);
  };
  const walk = (mesh, tr, path, from, to, dur, done, place) => {
    if (from >= to) { if (done) done(); return; }
    move(mesh, tr, path[from + 1], dur, () => walk(mesh, tr, path, from + 1, to, dur, done, place), place);
  };
  const pop = (mesh, dur) => add(dur, (k) => { const s = k < 0.45 ? 1.08 * easeOut(k / 0.45) : 1.08 - 0.08 * ((k - 0.45) / 0.55); mesh.scale.setScalar(Math.max(0.001, s)); });
  const ballTo = (x, z) => placeBall(x, z);

  // Warm up: SwiftShader, the software WebGL of headless Chromium, does slow first-time work
  // the first time it draws each object in each drawing state, and on CI one first draw can
  // take 200 ms. So one frame draws every object at its real material settings, with the
  // surface, contours, arrows, ghost, and ring faded in, the ball, halo, and ring at full size,
  // and both trails many points long, while the canvas is off the page. A one-pixel read waits
  // for the frame to finish. Then every object goes back to its opening state and draws again.
  const warm = () => {
    const fades = mats.map((m) => m.userData.fade);
    const sized = [ball, halo, ring];
    mats.forEach((m) => { m.userData.fade = 1; });
    sized.forEach((o) => o.scale.setScalar(1));
    trail.write(chord(P[0], P[1], 0.02, 20));
    ghostTrail.write(chord(GH[0], GH[1], 0.02, 20));
    const gl = renderer.getContext(), px = new Uint8Array(4);
    render();
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    mats.forEach((m, i) => { m.userData.fade = fades[i]; });
    sized.forEach((o) => o.scale.setScalar(0.001));
    [trail, ghostTrail].forEach((tr) => { tr.done.length = 0; tr.write([]); tr.active = null; });
    render();
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    renderer.domElement.dataset.warm = "1";
  };
  const attach = (slide) => {
    host = slide.querySelector(".fig3");
    host.appendChild(renderer.domElement);
    if (frozen) {
      // The end state at once: surface and contours up, the trail through every iterate, the
      // ball at the minimum, the ring in place, the ghost and the arrows gone.
      surfMat.userData.fade = 1; contourMat.userData.fade = 1;
      for (let i = 0; i < 12; i++) trail.commit(chord(P[i], P[i + 1], 0.02, 20));
      placeBall(P[12][0], P[12][1], 1);
      ring.scale.setScalar(1);
      render();
      return {};
    }
    render();
    return handlers;
  };
  const handlers = {
    "3.1bowl": () => { surfMat.userData.fade = contourMat.userData.fade = 0.4; fadeTo(surfMat, 1, 0.4); fadeTo(contourMat, 1, 0.4); },
    "3.1p0": () => add(0.3, (k) => placeBall(P[0][0], P[0][1], Math.max(0.001, easeOut(k)))),
    "3.1height": () => add(0.45, (k) => { dropK = 0.25 + 0.75 * easeOut(k); }),
    "3.1up": () => { fadeTo(upMat, 1, 0.3); fadeTo(downMat, 1, 0.3); },
    "3.1neg": () => add(0.5, (k) => downMat.userData.group.scale.setScalar(1 + 0.3 * Math.sin(Math.PI * k))),
    "3.1p1": () => { fadeTo(upMat, 0, 0.3); fadeTo(downMat, 0, 0.3); move(ball, trail, P[1], 0.9, null, ballTo); },
    "3.1p2": () => move(ball, trail, P[2], 0.9, null, ballTo),
    "3.1p3": () => walk(ball, trail, P, 2, 4, 0.5, null, ballTo),
    "3.1think": () => dimTo(0.35, 0.6),
    "3.1over": () => { ghostMat.userData.fade = 1; dimTo(1, 0.3); walk(ghost, ghostTrail, GH, 0, 4, 0.7); },
    "3.1min": () => {
      fadeTo(ghostMat, 0, 0.6); fadeTo(ghostTrail.line.material, 0, 0.6);
      walk(ball, trail, P, 4, 12, 0.4, () => pop(ring, 0.5), ballTo);
    },
  };
  return { warm, attach };
}

// A page that will play scene 3 builds and warms its figure while it loads, before narration
// t=0, and __sceneReady, which the recorder awaits before it starts the clock, waits for the
// warm-up too. This listener runs after the runtime's, so the runtime's promise already exists.
// A frozen step builds its figure when the step enters.
let s3prebuilt;
document.addEventListener("DOMContentLoaded", () => {
  const p = DeckTalk.params;
  const plays3 = !p.has("step") && (p.has("scene") ? p.get("scene") === "3" : (p.get("beats") || "").startsWith("3."));
  if (!plays3) return;
  const warmed = new Promise((resolve) => {
    s3prebuilt = s3figure(false);
    if (s3prebuilt) s3prebuilt.warm();
    resolve();
  });
  window.__sceneReady = Promise.all([window.__sceneReady, warmed]).then(([ready]) => ready);
});
