# Every host DeckTalk contacts, and what each request carries.
#
# This file is the whole source of docs/reference/what-leaves-your-machine.mdx. Add a host here,
# then run `uv run scripts/build_outbound_reference.py --write`. A host that is not in this file is
# a host DeckTalk does not contact, and a reviewer reads the generated page as the complete list.
#
# `[[service]]` rows are requests that carry the project's own content to a service.
# `[[download]]` rows are one-time fetches of a tool, and they carry nothing of the project.
# `[[page]]` rows are requests a recorded page makes itself, which `[record] page_policy` lets
# through or refuses. Their host is whatever the page names, so the row says who sends them and
# under which policy rather than naming a host.
#
# The `#:schema` line `decktalk init` writes names a file on raw.githubusercontent.com. DeckTalk never
# fetches it, so it has no row here. An editor that understands the line fetches the schema on its
# own, and that request carries nothing of the project.

[[service]]
host = "api.elevenlabs.io"
name = "Narration"
sent_by = "`decktalk narrate`, and `decktalk build` on a voiced run"
body = "The section's spoken text, the voice id, the model name and the audio format, together with up to `narration.context_characters` characters of the previous section and up to the same of the next section as speaking context. The default is 1500 characters, and `narration.context_characters = 0` keeps the neighbouring sections on your machine."
credential = "The request carries the value of `ELEVENLABS_API_KEY` in a header, to the host `[elevenlabs] base_url` names. Only this machine's own file, environment or `--set` can name it, and a project file that sets it is refused, because the key goes wherever it points."
note = "Rebuilding one section still sends that section's neighbours, because the voice reads them for intonation. A run with `--no-spend` sends nothing at all."

[[service]]
host = "api.elevenlabs.io"
name = "Sound effects and ambience"
sent_by = "`decktalk score`"
body = "The prompt string written in the `[score.ambience]` or a `[score.effects.<name>]` table, the length you asked for and the audio format. No part of `script.md` is sent."
credential = "The request carries the value of `ELEVENLABS_API_KEY` in a header."
note = "The prompt is text you wrote in `decktalk.toml`, so you decide what it describes."

[[service]]
host = "api.elevenlabs.io"
name = "Music"
sent_by = "`decktalk score`"
body = "The prompt string written in the `[score.music]` table, the length you asked for and the audio format. No part of `script.md` is sent."
credential = "The request carries the value of `ELEVENLABS_API_KEY` in a header."
note = "The music file is generated once and then reused from `build/`."

[[download]]
host = "cdn.playwright.dev"
name = "Headless Chromium"
sent_by = "the first command that opens a page, or `decktalk install`"
body = "A download request for the pinned browser build, and nothing else."
note = "This is Playwright's own download host. `PLAYWRIGHT_DOWNLOAD_HOST` points it at a mirror, and `[tools] chromium` skips the download by recording with a browser the machine already has."

[[download]]
host = "github.com"
name = "ffmpeg and ffprobe on Linux and on Windows"
sent_by = "the first command that encodes, or `decktalk install`"
body = "A download request for one pinned release archive, and nothing else."
note = "GitHub answers a release download with a redirect to its asset host, so a proxy rule needs both. The archive is checked against a pinned SHA-256 digest and discarded when the digest does not match."

[[download]]
host = "evermeet.cx"
name = "ffmpeg and ffprobe on an Intel Mac"
sent_by = "the first command that encodes, or `decktalk install`"
body = "A download request for two pinned archives, and nothing else."
note = "The archives are checked against pinned SHA-256 digests and discarded when a digest does not match."

[[download]]
host = "ffmpeg.martin-riedl.de"
name = "ffmpeg and ffprobe on an Apple silicon Mac"
sent_by = "the first command that encodes, or `decktalk install`"
body = "A download request for two pinned archives, and nothing else."
note = "The archives are checked against pinned SHA-256 digests and discarded when a digest does not match."

[[page]]
host = "Any host the page names"
name = "A page's own requests"
sent_by = "`decktalk record`, `decktalk check` and `decktalk storyboard`, and `decktalk assemble` when it draws the poster, so `decktalk build` too"
body = "Whatever the page asks for, such as a font, a script, an image or a call to an API its author wrote. DeckTalk adds nothing to the request. The browser that makes it is started with paths, locale and proxy settings alone, so `ELEVENLABS_API_KEY` and every other key the process holds are not in its environment."
policy = "Under the default `record.page_policy = \"trusted\"` the request goes to the network the way it would in the author's browser, through the machine's own proxy. Under `untrusted` it is refused before it leaves the browser, whatever its scheme."
note = "Either way the run names every other origin the page reached for, as [`PAGE_CDN_ASSET`](/reference/findings/PAGE_CDN_ASSET), so a reviewer reads which hosts a deck depends on from `decktalk check --json` before anything is recorded."
