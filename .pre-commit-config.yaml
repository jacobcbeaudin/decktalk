# Install once per clone: `uvx pre-commit install` (installs both the pre-commit and commit-msg hooks).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Commit messages must follow Conventional Commits (https://www.conventionalcommits.org).
  # release-please reads them to pick the next version and write CHANGELOG.md:
  #   fix: -> patch   feat: -> minor   feat!: / BREAKING CHANGE: -> major (minor while 0.x)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Same lint + format rules CI enforces (config in pyproject.toml).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # JavaScript lint + format, as CI does (config in biome.json). Keep rev in step with the version
  # pinned in biome.json's $schema and in ci.yml.
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.13
    hooks:
      - id: biome-check

  # The same check CI runs over site/install.sh. shellcheck-py ships the binary as a wheel, so the hook
  # needs no docker; -s sh holds the installer to POSIX sh, as tests/test_installer.py does.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-s, sh]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^src/decktalk/template/examples/[^/]+/deck/fonts/
      - id: trailing-whitespace
        exclude: ^src/decktalk/template/examples/[^/]+/deck/fonts/
      - id: check-toml
      - id: check-yaml

  # Type check with ty, as CI does. ty publishes no pre-commit hook repo, and it needs the project's
  # installed dependencies to resolve imports, so it runs from the project environment through uv.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false
