# The one place a lint rule, its arguments and its pin are written. prek runs these hooks at every
# commit, and the lint row in scripts/check.py runs them over every file and runs nothing else, so
# a commit and CI judge a change by the same rules. `pixi run setup` installs prek from pixi.lock
# and runs `prek install --prepare-hooks`, which writes the pre-commit and commit-msg hooks into the
# clone and fetches the two hook repositories, so a later commit needs no network.
#
# Each tool hook enters the Pixi environment through `pixi run --locked`, so it finds the ruff, ty
# and Node that pixi.lock pins from a plain terminal, and never rewrites pixi.lock in the middle of a
# commit. A commit needs only Pixi on PATH.
#
# Each fetched repository is pinned by commit SHA, because a tag can move to other code after review.
# The tag sits beside it as `# frozen: <tag>`, the one SHA form Renovate's pre-commit manager reads,
# so its pull request moves the SHA and the tag together.

# The prek that pixi.lock holds, so a prek installed outside the environment that is older than the
# one the lint row runs refuses the config rather than judging a commit by rules CI may not share.
minimum_prek_version: "0.5.9"
default_install_hook_types: [pre-commit, commit-msg]
# A hook with no stages of its own runs at pre-commit only, rather than a second time at commit-msg.
default_stages: [pre-commit]

repos:
  # Commit messages must follow Conventional Commits (https://www.conventionalcommits.org).
  # release-please reads them to pick the next version and write CHANGELOG.md:
  #   fix: -> patch   feat: -> minor   feat!: / BREAKING CHANGE: -> major (minor while 0.x)
  # No built-in hook knows the format, so prek fetches this one and its Python by the rev.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # pixi.lock pins ruff and ty, and package-lock.json pins Biome, so each hook runs the copy the
  # environment holds. Their rules are in pyproject.toml and biome.json.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: pixi run --locked ruff check --fix --force-exclude
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        language: system
        entry: pixi run --locked ruff format --force-exclude
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
      # The copy `npm ci` installed, started through the Node launcher the package ships. npm's
      # `node_modules/.bin/biome` is a sh script on Windows, which a Windows commit cannot run, and
      # `npm exec` costs a quarter second more on every commit. `npm ci` comes before `prek install`
      # in `pixi run setup`.
      - id: biome-check
        name: biome check
        language: system
        entry: pixi run --locked node node_modules/@biomejs/biome/bin/biome check --write --no-errors-on-unmatched
        types_or: [javascript, ts, json]
      # ty resolves imports against the installed packages, so it checks the three roots at once
      # rather than the files a commit touches.
      - id: ty
        name: ty check
        language: system
        entry: pixi run --locked ty check src tests scripts
        types: [python]
        pass_filenames: false
      # The lock is checked against the manifest whenever either is committed. prek sets aside what
      # is not staged before a hook runs, so a manifest committed without the lock it needs fails
      # here, even when a plain `pixi run` has already rewritten the lock in the working tree.
      - id: pixi-lock
        name: pixi lock --check
        language: system
        entry: pixi lock --check
        files: ^(pyproject\.toml|pixi\.lock)$
        pass_filenames: false
      # pixi.lock pins zizmor. It audits every workflow and the local action, and a new release can
      # add an audit, so a bump is a pull request of its own.
      - id: zizmor
        name: zizmor
        language: system
        entry: pixi run --locked zizmor
        files: ^\.github/(workflows|actions)/.*\.ya?ml$
      # The house rules for prose, vocabulary and numbers read the files prek passes, so a commit
      # judges what it stages and the lint row, which passes every tracked file, judges the tree.
      # A rule about the tree itself, such as a baseline entry whose file is gone, runs in any commit
      # that stages a file. A commit that only deletes files stages none, so prek runs no hook, and
      # the lint row judges it.
      - id: house-rules
        name: house rules for prose, vocabulary and numbers
        language: system
        entry: pixi run --locked python tests/house_rules.py
        require_serial: true

  # shellcheck-py ships the binary as a wheel, so the hook needs no docker, and this rev is the one
  # shellcheck pin. -s sh holds the installer and scripts/shell/ to POSIX sh, as
  # tests/contract/test_installer.py does.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x follows the setup each installer scenario sources, so shellcheck reads its functions.
        args: [-s, sh, -x]

  # prek's own copies of the pre-commit-hooks checks, so they need no clone and no rev of their own.
  - repo: builtin
    hooks:
      - id: end-of-file-fixer
        exclude: ^src/decktalk/template/examples/[^/]+/deck/fonts/
      - id: trailing-whitespace
        exclude: ^src/decktalk/template/examples/[^/]+/deck/fonts/
      - id: check-toml
      - id: check-yaml
