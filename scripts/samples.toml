# Every docs sample `scripts/build_samples.py` writes, keyed by the id its page names in a
# `{/* sample: <id> */}` comment above the block, or `<!-- sample: <id> -->` in the README. A comment
# whose id has no row here is refused.
#
# A row says how the project was made, what ran on it and what the block shows:
#   page      the page whose block this row fills
#   what      the run, in a sentence, which is what a reader of the page source sees in this file
#   edits     find and replace pairs applied to the fresh `decktalk init my-lesson`, each [file, find, replace]
#   voice     "dtsp" to read the script with the loopback fake voice, which needs no key and spends nothing
#   env       variables every command of the row sees, where {empty} is an empty folder
#   init      false to run in an empty folder rather than in a fresh starter
#   folder    true to run in the folder that holds my-lesson rather than in my-lesson
#   run       the steps, in order: a command as its argv after `decktalk`, `{ edit = [file, find, replace] }`
#             or `{ delete = file }`. A command before the last may exit 0 or 1, since 1 is a finding
#   exit      the exit the last command must end with, 0 when it is not given
#   file      the file the block shows, project-relative, where {digest} is section 1's take digest and
#             {run} is the run of the newest events file, which is the last command's
#   listing   instead of a file, the names in this project-relative folder, as `ls` prints them into a pipe
#   stream    instead of a file, what the last command printed: "stdout", "stderr" or "both" in order
#   lines     for a last command that serves until stopped, read this many lines of the stream and stop it
#   fence     the block's language, from the file's suffix or "text" when it is not given. A "json"
#             block is parsed, cut and printed again, and any other is the printed text
#   head      keep the first N lines of a text block
#   grep      keep the lines of a text block this pattern finds
#   hide      write each match of these patterns as ..., so a text block names no path of the machine that ran it
#   key       show one part of a json block, by a dotted path where a number is a list index
#   fragment  true to write that part as the `"key": value` entry a reader pastes into the file
#   only      keep these keys of a json block, in this order
#   keep      how many items to keep of each named list, by a dotted path, so a long file is cut to its first rows
#   varies    the json keys whose values a run decides, which `--check` holds by key and not by value
#   masks     the patterns whose matches a run decides, which `--check` holds by place and not by value
#
# Rows that begin with the same steps share the project those steps made, and run only the steps
# after them in a copy of it.

[takes-json]
page = "docs/reference/artifacts.mdx"
what = "build/narrate/takes.json after decktalk narrate --no-spend on a fresh decktalk init my-lesson read by a local dtsp voice, cut to the first section"
edits = [
    ["decktalk.toml", 'provider = "elevenlabs"', 'provider = "dtsp"'],
    ["decktalk.toml", 'id = ""', 'id = "af_heart"'],
]
voice = "dtsp"
run = [["narrate", "--no-spend"]]
file = "build/narrate/takes.json"
keep = { sections = 1 }
varies = ["duration_seconds", "sound_end_seconds", "audio_blake3"]

[words-json]
page = "docs/reference/artifacts.mdx"
what = "the words file of section 1's take after the same run, cut to its first three words"
edits = [
    ["decktalk.toml", 'provider = "elevenlabs"', 'provider = "dtsp"'],
    ["decktalk.toml", 'id = ""', 'id = "af_heart"'],
]
voice = "dtsp"
run = [["narrate", "--no-spend"]]
file = "takes/{digest}.words.json"
keep = { words = 3 }
varies = ["bytes", "blake3"]

