# ---- commands that serve until stopped ---------------------------------------------------------

[serve]
page = "docs/quickstart.mdx"
what = "decktalk serve, in a fresh decktalk init my-lesson, the line it prints before it is stopped"
run = [["serve"]]
stream = "stdout"
lines = 1
masks = ['(?<=127\.0\.0\.1:)\d+']

[build-watch]
page = "docs/guides/rebuild-one-section.mdx"
what = "decktalk build --watch, on a fresh decktalk init my-lesson, the lines it prints before its first build"
run = [["build", "--watch"]]
stream = "stderr"
lines = 2
masks = ['(?<=127\.0\.0\.1:)\d+']

[page-cdn-asset]
page = "docs/help/troubleshooting.mdx"
what = "decktalk check, on a fresh decktalk init my-lesson whose page links https://fonts.example.com/inter.css, the finding line"
edits = [["deck/index.html", "</head>", "<link rel=\"stylesheet\" href=\"https://fonts.example.com/inter.css\">\n</head>"]]
run = [["check"]]
exit = 1
stream = "both"
grep = "PAGE_CDN_ASSET"
