# Dependabot keeps the GitHub Actions, the locked Python dependencies, and the media Worker's npm packages current.
# Updates arrive as one grouped pull request per ecosystem, once a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /workers/media
    schedule:
      interval: weekly
    groups:
      worker:
        patterns: ["*"]
