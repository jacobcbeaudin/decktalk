# Dependabot keeps the GitHub Actions and the locked Python dependencies current.
# Updates arrive as one grouped pull request per ecosystem, once a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # esbuild and Biome are pinned by package-lock.json, because a lockfile is the only way to make the
  # byte-for-byte bundle check mean anything.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      node:
        patterns: ["*"]
    # release-please is pinned to the version release-please-action bundles, so the next version the
    # rehearsal computes is the one the release computes. It moves by hand with the action's pin.
    ignore:
      - dependency-name: release-please
