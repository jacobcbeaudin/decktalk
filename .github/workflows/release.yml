# Release: release-please keeps a "release PR" open against main. It bumps the version in
# pyproject.toml and uv.lock, writes CHANGELOG.md, and picks the semver bump from the
# Conventional Commits landed since the last release. Merging that PR creates the vX.Y.Z tag
# and GitHub release; this same workflow run then builds the wheel and sdist, publishes them
# to PyPI through trusted publishing (no API token stored anywhere), and attaches the files
# to the release. Config: release-please-config.json and .release-please-manifest.json.
# (The uv.lock entry there uses `@.name.value` because release-please parses TOML into tagged
# {value,start,end} nodes; a plain `@.name` filter silently matches nothing.)
#
# One-time setup on PyPI (before the first release):
#   pypi.org -> your account -> Publishing -> "Add a new pending publisher":
#     PyPI project name: decktalk
#     Owner: jacobcbeaudin   Repository: decktalk
#     Workflow name: release.yml   Environment name: pypi
# One-time setup on GitHub:
#   Settings -> Environments -> New environment "pypi" (optionally require your own approval)
#   Settings -> Actions -> General -> Workflow permissions ->
#     tick "Allow GitHub Actions to create and approve pull requests"
#
# Cutting a release: merge the release PR. That is the whole procedure. The workflow file name release.yml
# and the environment name pypi are registered with PyPI's trusted publisher, so neither may be renamed.
# To force a specific version (e.g. the jump to 1.0.0), put `Release-As: 1.0.0` in a commit body.
name: release

on:
  push:
    branches: [main]

# Every job reads the repository. A job that needs a write grants it itself.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  changelog-page:
    # CHANGELOG.md changed with the release, so regenerate the docs changelog page from it.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true # the step below pushes the regenerated page
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv run scripts/build_changelog.py
      - name: Commit the regenerated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.mdx
          git diff --cached --quiet || git commit -m "docs: regenerate the changelog page for ${{ needs.release-please.outputs.tag_name }}"
          git push

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Tag must match pyproject version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="$(uv version --short)"
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "pyproject version $version does not match tag $tag" >&2
            exit 1
          fi
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests && uv run ty check src && uv run pytest -q
      - run: uv build
      - name: Smoke-test the built wheel from a clean environment
        run: uv run --isolated --no-project --with dist/decktalk-*.whl -- decktalk init /tmp/wheelcheck --name wheelcheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  cross-platform:
    # The browser, media and pipeline suites on macOS and Windows, so a platform regression stops the publish.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/cross-platform.yml

  publish:
    needs: [release-please, build, cross-platform]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
      contents: write   # attach files to the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Attach wheel and sdist to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* --clobber
