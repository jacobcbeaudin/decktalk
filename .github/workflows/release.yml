# Release: release-please keeps a release pull request open against `main`. It bumps the version in
# pyproject.toml, uv.lock and the runtime's TypeScript source, writes CHANGELOG.md, and picks the
# semver bump from the Conventional Commits landed since the last release. Merging that pull request
# creates the vX.Y.Z tag and the GitHub release, and this workflow then builds the wheel and the
# sdist from that tag, publishes them to PyPI through trusted publishing, and attaches them to the
# release. Config: release-please-config.json and .release-please-manifest.json.
# (The uv.lock entry there uses `@.name.value` because release-please parses TOML into tagged
# {value,start,end} nodes, and a plain `@.name` filter silently matches nothing.)
#
# This workflow runs no check of its own. It starts from a completed run of `ci` and releases only
# when that run was green, was a push and was on `main`, so what ships is what ci judged. A
# `workflow_dispatch` run on `main` is also a success, which is why the event is checked too.
#
# No generated file is written here. ci.yml regenerates every file the bump made stale on
# release-please's own pull request branch, so the merge commit already carries them and no bot ever
# writes to `main`.
#
# One-time setup on PyPI (before the first release):
#   pypi.org -> your account -> Publishing -> "Add a new pending publisher":
#     PyPI project name: decktalk
#     Owner: jacobcbeaudin   Repository: decktalk
#     Workflow name: release.yml   Environment name: pypi
# One-time setup on GitHub:
#   Settings -> Environments -> New environment "pypi", with yourself as a required reviewer,
#     because a PyPI version can never be re-uploaded and this is the one step with no undo.
#   Settings -> Actions -> General -> Workflow permissions ->
#     tick "Allow GitHub Actions to create and approve pull requests"
#
# Cutting a release: merge the release pull request. That is the whole procedure. The workflow file
# name release.yml and the environment name pypi are registered with PyPI's trusted publisher, so
# neither may be renamed. To name a version, put `Release-As: 0.5.0-rc1` in a commit body, with the
# hyphen, because release-please parses semver and would silently drop a bare `rc1` suffix.
name: release

# `workflow_run` is the trigger this design needs and the usual objection to it does not apply here.
# The objection is that a run started by an untrusted pull request inherits write permissions, so
# the first job below refuses anything but a successful push on `main`, no job checks out a ref that
# a contributor controls, and the only artifact published is built from the tag.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]

# Every job reads the repository. A job that needs a write grants it itself.
permissions:
  contents: read

# Two releases never run at once, and a queued one is never cancelled, because cancelling a run that
# has already reached PyPI would leave a version published and no release to attach it to.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # All three conditions are load bearing. A green ci is not enough: a manual run and a run on a
    # pull request branch are both green runs that must not release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release pull request is opened with the changelog app's token rather than the workflow's
      # own, because GitHub holds every workflow on a pull request the workflow token opens until a
      # person approves it, and a release pull request nobody has to approve is the point of the app.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # release-please reads the history of `main` through the API and needs no checkout of its own.
      # `workflow_run` runs the default branch's copy of this file and github.sha is that tip rather
      # than the commit ci tested, so no job below reads github.sha and every checkout names a ref.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          token: ${{ steps.token.outputs.token }}

  build:
    # The artifact that goes to PyPI is built from the tag and from nothing else.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - id: tag
        name: The tag and the package version are the same version
        # The tag is semver and the package is PEP 440, so `v0.5.0-rc1` and `0.5.0rc1` are one
        # version spelled two ways and a string comparison would refuse every release candidate.
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PACKAGED="$(uv version --short)" uv run --isolated --no-project --with packaging python - <<'PY'
          import os
          import sys
          from packaging.version import Version

          tag = Version(os.environ["TAG"].removeprefix("v"))
          packaged = Version(os.environ["PACKAGED"])
          if tag != packaged:
              sys.exit(f"the tag is {tag} and the package is {packaged}, so the wheel would carry the wrong version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"prerelease={str(tag.is_prerelease).lower()}\n")
          PY
      - run: uv build
      - name: Open the built wheel on a machine that has only the wheel
        run: uv run --isolated --no-project --with dist/decktalk-*.whl -- decktalk init "${RUNNER_TEMP}/wheelcheck"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    # The one job that talks to PyPI holds the OIDC token and nothing else, because this is the only
    # step in the system with no undo.
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach:
    # Attaching the files and flagging a prerelease are repository writes, so they sit in a job that
    # holds no PyPI credential of any kind.
    needs: [release-please, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Attach the wheel and the sdist, and flag a release candidate
        # release-please-action v5 exposes no prerelease output, so the flag is derived from the tag
        # the build job already parsed.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --prerelease
          fi
