# Release: release-please keeps a release pull request open against `main`. It bumps the version in
# pyproject.toml, the README's pinned blocks and the runtime's TypeScript source, writes
# CHANGELOG.md, and picks the semver bump from the Conventional Commits landed since the last
# release. Merging that pull request creates the vX.Y.Z tag and the GitHub release, and this
# workflow then builds the wheel, the sdist and the conda package from that tag. A final release
# goes to DeckTalk's conda channel, which `pixi global install` reads, and then to PyPI, each
# through trusted publishing, and the files are attached to the release after both. The channel
# comes first because prefix.dev can delete a package and PyPI can never take a version back, so an
# upload that fails stops the release before the step that has no undo. A candidate goes to PyPI
# alone. Config: release-please-config.json and .release-please-manifest.json. pixi.lock holds no
# version of the package itself, so the bump leaves it as it is.
#
# This workflow runs no check of its own. It starts from a completed run of `ci` and releases only
# when that run was green, was a push and was on `main`, so what ships is what ci judged. A
# `workflow_dispatch` run on `main` is also a success, which is why the event is checked too. The
# builds are rows of scripts/check.py, `wheel` and `conda`, which every pull request runs.
#
# No generated file is written here. ci.yml regenerates every file the bump made stale on
# release-please's own pull request branch, so the merge commit already carries them and no bot ever
# writes to `main`.
#
# RELEASING.md holds the one-time setup on PyPI, on prefix.dev and on GitHub, and the procedure. The
# workflow file name release.yml and the environment names `pypi` and `conda` are registered with
# the two trusted publishers, so none of them may be renamed.
name: release

# `workflow_run` is the trigger this design needs and the usual objection to it does not apply here.
# The objection is that a run started by an untrusted pull request inherits write permissions, so
# the first job below refuses anything but a successful push on `main`, no job checks out a ref that
# a contributor controls, and the only artifact published is built from the tag.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]

# Every job reads the repository. A job that needs a write grants it itself.
permissions:
  contents: read

# Two releases never run at once, and a queued one is never cancelled, because cancelling a run that
# has already reached PyPI would leave a version published and no release to attach it to.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # All three conditions are load bearing. A green ci is not enough: a manual run and a run on a
    # pull request branch are both green runs that must not release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release pull request is opened with the changelog app's token rather than the workflow's
      # own, because GitHub holds every workflow on a pull request the workflow token opens until a
      # person approves it, and a release pull request nobody has to approve is the point of the app.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # release-please reads the history of `main` through the API and needs no checkout of its own.
      # `workflow_run` runs the default branch's copy of this file and github.sha is that tip rather
      # than the commit ci tested, so no job below reads github.sha and every checkout names a ref.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          token: ${{ steps.token.outputs.token }}

  build:
    # The artifact that goes to PyPI is built from the tag and from nothing else.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      pixi: ${{ steps.pixi.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # The build is the `wheel` row of scripts/check.py, which every pull request runs, in the
      # default environment with the hatchling pixi.lock pins at the tag. No cache is read, so
      # nothing a cache could hold reaches the artifact PyPI publishes. The job
      # reads the Pixi version from pyproject.toml at the tag, as the plan job of ci.yml does.
      - id: pixi
        name: Read the Pixi version pyproject.toml requires
        run: echo "version=$(python3 scripts/check.py --pixi-version)" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup
        with:
          pixi-version: ${{ steps.pixi.outputs.version }}
          environments: default
          cache: false
      - name: Build the wheel, open it on its own and hold the tag to the version in it
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: python scripts/check.py --group wheel
      - id: tag
        name: A tag with a prerelease part is a candidate
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: case "$TAG" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    # The one job that talks to PyPI holds the OIDC token and nothing else, because this is the only
    # step in the system with no undo. It is the last upload: it waits for the conda package to be
    # built and judged, and for a final release to be on the channel, so a failure before it leaves
    # PyPI as it was. A candidate has no channel upload, so the job reads the upload's result rather
    # than needing it to succeed.
    needs: [release-please, build, conda, publish-conda]
    if: >-
      !cancelled() && needs.conda.result == 'success' &&
      (needs.publish-conda.result == 'success' || needs.build.outputs.prerelease == 'true')
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # A run again after an upload that stopped between the wheel and the sdist passes over the
      # file PyPI already has, as `publish-conda` does.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  attach:
    # Attaching the files and setting the release's flag and notes are repository writes, so they
    # sit in a job that holds no PyPI credential of any kind. A job with no `if:` runs only when
    # every job before it succeeded, the ones it does not name included, so on a candidate the
    # skipped `publish-conda` would skip this job too. The `if:` asks for the PyPI upload alone.
    needs: [release-please, build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attach the wheel and the sdist, and mark the release a candidate or the latest
        # The tag decides the flag in both directions. release-please flags every release below 1.0
        # as a prerelease, a final one included, and v5 of its action exposes no output that says
        # which a release is. A final release also carries the notes of its whole series, because
        # release-please wrote only what changed after the last candidate.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --prerelease --latest=false
          else
            python3 scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --prerelease=false --latest --notes-file "$RUNNER_TEMP/notes.md"
          fi

  conda:
    # The conda package, built from the tag by the `conda` row of scripts/check.py, which every pull
    # request runs: `pixi publish` builds it, and `pixi global install` installs it into an empty
    # Pixi home and runs it. The `playwright-pair` row comes first, which asks anaconda.org whether
    # conda-forge holds the Playwright client and its driver on every platform a user installs on.
    # Both run for every release, before any upload, so a package that cannot be built or solved
    # stops the release while nothing has been published. Only a final release is uploaded, by
    # `publish-conda`.
    needs: [release-please, build]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          pixi-version: ${{ needs.build.outputs.pixi }}
          environments: default
          cache: false
      - run: python scripts/check.py --group playwright-pair,conda
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda
          path: dist-conda/

  publish-conda:
    # The one job that talks to prefix.dev holds the OIDC token and nothing else, as `publish` does
    # for PyPI, so no long-lived prefix.dev key exists anywhere. It runs in the `conda` environment,
    # whose required reviewer approves the upload, and prefix.dev's trusted publisher names that
    # environment, so no other job of any branch can upload. It runs before PyPI, because a package
    # on prefix.dev can be deleted and a PyPI version cannot, and for a final release only, so
    # `pixi global install` never meets a version the docs call a candidate.
    needs: [release-please, build, conda]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-26.04
    environment: conda
    permissions:
      # prefix.dev exchanges this GitHub OIDC token for a short upload token, and Sigstore signs the
      # attestation with the same identity.
      id-token: write
    env:
      # `pixi upload prefix` reads its channel from this variable, as `<namespace>/<channel>`.
      # install-docs:upload-channel:start
      PREFIX_CHANNEL: jcbcodes/decktalk
      # install-docs:upload-channel:end
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda
          path: dist-conda/
      - uses: $/.github/actions/setup
        with:
          pixi-version: ${{ needs.build.outputs.pixi }}
      # No API key is given, so `pixi upload prefix` asks prefix.dev for a token through trusted
      # publishing. `--generate-attestation` signs a Sigstore attestation of the file and uploads it
      # with the package, and it works only with trusted publishing. `--skip-existing` makes a run
      # again after a partial upload pass over the file that already arrived, so `attach-conda`
      # still runs.
      - name: Upload the package to the conda channel
        run: |
          if ! pixi upload prefix --skip-existing --generate-attestation dist-conda/*.conda; then
            echo "::error::The upload to $PREFIX_CHANNEL failed. RELEASING.md, under The conda channel, names the trusted publisher prefix.dev needs."
            exit 1
          fi

  attach-conda:
    # A repository write, so it sits apart from the job that publishes with the OIDC token. It waits
    # for PyPI too, so the release shows its files only once both uploads have them. A candidate
    # skips `publish-conda`, so it skips this job too.
    needs: [release-please, publish-conda, publish]
    if: ${{ !cancelled() && needs.publish-conda.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda
          path: dist-conda/
      - name: Attach the conda package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist-conda/*.conda --clobber
