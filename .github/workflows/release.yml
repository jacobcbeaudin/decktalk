# Release: release-please keeps a release pull request open against `main`. It bumps the version in
# pyproject.toml, the README's pinned blocks and the runtime's TypeScript source, writes
# CHANGELOG.md, and picks the semver bump from the Conventional Commits landed since the last
# release. Merging that pull request creates the vX.Y.Z tag and the GitHub release, and this
# workflow then builds the wheel and the sdist from that tag, publishes them to PyPI through
# trusted publishing, and attaches them to the release. A final release also goes to the conda
# channel https://prefix.dev/jacobcbeaudin/jcbcodes, which `pixi global install` reads: the `conda` job builds
# the noarch package from the tag with `pixi build`, and `publish-conda` uploads it after PyPI has
# the same version. A candidate stays on PyPI alone. Config: release-please-config.json and
# .release-please-manifest.json. pixi.lock holds no version of the package itself, so the bump
# leaves it as it is.
#
# This workflow runs no check of its own. It starts from a completed run of `ci` and releases only
# when that run was green, was a push and was on `main`, so what ships is what ci judged. A
# `workflow_dispatch` run on `main` is also a success, which is why the event is checked too.
#
# No generated file is written here. ci.yml regenerates every file the bump made stale on
# release-please's own pull request branch, so the merge commit already carries them and no bot ever
# writes to `main`.
#
# One-time setup on PyPI (before the first release):
#   pypi.org -> your account -> Publishing -> "Add a new pending publisher":
#     PyPI project name: decktalk
#     Owner: jacobcbeaudin   Repository: decktalk
#     Workflow name: release.yml   Environment name: pypi
# One-time setup on prefix.dev (before the first final release):
#   prefix.dev -> New channel "jcbcodes" in the namespace jacobcbeaudin, public. Its page is
#     https://prefix.dev/channels/@jacobcbeaudin/jcbcodes and its URL https://prefix.dev/jacobcbeaudin/jcbcodes.
#   channel page -> Settings -> Repository Access -> Add access:
#     Source: GitHub   Owner: jacobcbeaudin   Repository: decktalk
#     Workflow file: release.yml   Environment: (empty, any environment)
#     Access: Read/write   Upload access: All packages
#   The entry then reads "jacobcbeaudin / decktalk, READ/WRITE, release.yml, Any environment".
# One-time setup on GitHub:
#   Settings -> Environments -> New environment "pypi", with yourself as a required reviewer,
#     because a PyPI version can never be re-uploaded and this is the one step with no undo.
#   Settings -> Actions -> General -> Workflow permissions ->
#     tick "Allow GitHub Actions to create and approve pull requests"
#
# Cutting a release: merge the release pull request. That is the whole procedure. Every release is a
# candidate, 0.5.0-rc1, 0.5.0-rc2, until a pull request carries a `Release-As: 0.5.0` footer and the
# next release pull request is the final one, as RELEASING.md describes under "Candidates and
# finals". The workflow file name release.yml and the environment name pypi are registered with
# PyPI's trusted publisher, and release.yml is also registered with the trusted publisher of the
# jacobcbeaudin/jcbcodes channel, so neither may be renamed.
name: release

# `workflow_run` is the trigger this design needs and the usual objection to it does not apply here.
# The objection is that a run started by an untrusted pull request inherits write permissions, so
# the first job below refuses anything but a successful push on `main`, no job checks out a ref that
# a contributor controls, and the only artifact published is built from the tag.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]

# Every job reads the repository. A job that needs a write grants it itself.
permissions:
  contents: read

# Two releases never run at once, and a queued one is never cancelled, because cancelling a run that
# has already reached PyPI would leave a version published and no release to attach it to.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # All three conditions are load bearing. A green ci is not enough: a manual run and a run on a
    # pull request branch are both green runs that must not release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release pull request is opened with the changelog app's token rather than the workflow's
      # own, because GitHub holds every workflow on a pull request the workflow token opens until a
      # person approves it, and a release pull request nobody has to approve is the point of the app.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # release-please reads the history of `main` through the API and needs no checkout of its own.
      # `workflow_run` runs the default branch's copy of this file and github.sha is that tip rather
      # than the commit ci tested, so no job below reads github.sha and every checkout names a ref.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          token: ${{ steps.token.outputs.token }}

  build:
    # The artifact that goes to PyPI is built from the tag and from nothing else.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # The build runs in the default environment, with the hatchling pixi.lock pins at the tag, as
      # the `wheel` row of scripts/check.py does on every pull request. No cache is read, so nothing
      # a cache could hold reaches the artifact PyPI publishes. tests/scripts/test_check.py holds
      # `pixi-version` to the `requires-pixi` floor, and the two build steps to the `wheel` row.
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          environments: default
          locked: true
          activate-environment: true
          cache: false
      - run: python -m build --no-isolation
      - name: Open the built wheel on its own and hold the tag to the version in it
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: python scripts/check_wheel.py --tag "$TAG"
      - id: tag
        name: A tag with a prerelease part is a candidate
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: case "$TAG" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    # The one job that talks to PyPI holds the OIDC token and nothing else, because this is the only
    # step in the system with no undo.
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach:
    # Attaching the files and setting the release's flag and notes are repository writes, so they
    # sit in a job that holds no PyPI credential of any kind.
    needs: [release-please, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attach the wheel and the sdist, and mark the release a candidate or the latest
        # The tag decides the flag in both directions. release-please flags every release below 1.0
        # as a prerelease, a final one included, and v5 of its action exposes no output that says
        # which a release is. A final release also carries the notes of its whole series, because
        # release-please wrote only what changed after the last candidate.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --prerelease --latest=false
          else
            python3 scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --prerelease=false --latest --notes-file "$RUNNER_TEMP/notes.md"
          fi

  conda:
    # The conda package, built from the tag and from nothing else, for a final release only. A
    # candidate stays on PyPI, so `pixi global install` never meets a version the docs call a candidate.
    needs: [release-please, build]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # `pixi build` solves its own build environment from conda-forge, so no workspace environment
      # is installed. tests/scripts/test_check.py holds `pixi-version` to the `requires-pixi` floor.
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          run-install: false
          cache: false
      - run: pixi build --output-dir dist-conda
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda
          path: dist-conda/

  publish-conda:
    # The one job that talks to prefix.dev holds the OIDC token and nothing else, as `publish` does
    # for PyPI, so no long-lived prefix.dev key exists anywhere. It runs after PyPI has the version,
    # so the conda package never names a release PyPI refused. It uploads the file the `conda` job
    # built, which is the file `attach-conda` puts on the release.
    needs: [release-please, conda, publish]
    runs-on: ubuntu-latest
    permissions:
      # prefix.dev exchanges this GitHub OIDC token for a short upload token, and Sigstore signs the
      # attestation with the same identity.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda
          path: dist-conda/
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          run-install: false
          cache: false
      # No API key is given, so `pixi upload prefix` asks prefix.dev for a token through trusted
      # publishing. `--generate-attestation` signs a Sigstore attestation of the file and uploads it
      # with the package, and it works only with trusted publishing. Without a registered trusted
      # publisher prefix.dev gives no token, the upload fails, and the error names the fix. The channel
      # lives in the namespace jacobcbeaudin, so `--channel` takes `<namespace>/<channel>`: that is
      # the path after the host of the channel URL, which `pixi publish --to <url>` passes to the
      # same upload call.
      - name: Upload the package to the jacobcbeaudin/jcbcodes channel
        run: |
          if ! pixi upload prefix --channel jacobcbeaudin/jcbcodes --generate-attestation dist-conda/*.conda; then
            echo "::error::The upload to https://prefix.dev/jacobcbeaudin/jcbcodes failed. If the log above says that no prefix.dev API key was found or that trusted publishing failed, the channel has no trusted publisher for this workflow: on https://prefix.dev/channels/@jacobcbeaudin/jcbcodes open Settings -> Repository Access -> Add access and add Source GitHub, owner jacobcbeaudin, repository decktalk, workflow file release.yml, environment empty, access Read/write, upload access All packages, then re-run this job."
            exit 1
          fi

  attach-conda:
    # A repository write, so it sits apart from the job that publishes with the OIDC token.
    needs: [release-please, publish-conda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda
          path: dist-conda/
      - name: Attach the conda package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist-conda/*.conda --clobber
