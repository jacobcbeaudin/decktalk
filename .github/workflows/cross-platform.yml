# The browser, media and pipeline suites on macOS and Windows. ci.yml calls it on every push to main and
# from the Actions tab, and release.yml calls it before publish, so a release never ships a platform
# regression. It never runs on the tag release-please creates, because that tag triggers no workflow.
# On these runners the pipeline test reports OFF CUE instead of failing on it, and asserts the wider limits
# of four offset frames and five a/v frames; the test decides that from sys.platform itself.
name: cross-platform

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Cache Chromium, ffmpeg and KaTeX
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/ms-playwright
            ~/AppData/Local/decktalk
            ~/Library/Caches/ms-playwright
            ~/Library/Caches/decktalk
            .venv/lib/*/site-packages/static_ffmpeg/bin
            .venv/Lib/site-packages/static_ffmpeg/bin
          key: tools-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run decktalk setup
      - run: uv run decktalk doctor
      - run: uv run pytest -q -m "browser or media or e2e" --durations=10
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            tests/out/e2e/pipeline/verify.json
            tests/out/e2e/pipeline/build/rec/*.json
            tests/out/e2e/pipeline/build/audio/*.json
            tests/out/e2e/pipeline/build/shots/
            tests/out/e2e/pipeline/build/out/*.mp4
          if-no-files-found: ignore
