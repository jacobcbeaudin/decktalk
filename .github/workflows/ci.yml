# The only workflow that runs a check. Every check DeckTalk has is a row in the `GROUPS` table in
# scripts/check.py, and this file reads that table at runtime, so a workflow cannot disagree with it
# and no check is spelled twice. The table decides which groups gate at which moment, which runner
# each one needs and how long it may take, and nothing here adds a rule of its own.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The container installer runs and the scaffold build runs once a week, because both judge the
    # world outside this repository and both are too slow to gate a pull request.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Every workflow reads the repository and nothing more. A job that needs a write grants it itself.
permissions:
  contents: read

# One run per branch, the tip's. A second push supersedes the first rather than racing it, on
# `main` as well: GitHub keeps one queued run per group and drops the older one when a third
# arrives, which once dropped the tip's run and left release.yml with no verdict to consume. The
# tip is the only commit release.yml reads, so its run is the one worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # The matrix is read from the check table rather than written here. `coverage` is emitted
    # separately because it combines what the other legs produced and therefore has to run after
    # them, which a single matrix cannot express.
    name: plan
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.table.outputs.groups }}
      coverage: ${{ steps.table.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - id: table
        name: Read the check table
        env:
          # A pull request gates on `pr`, the weekly run gates on `schedule`, and a push to `main`
          # and a manual run gate on `main`. There is no trigger for `release`, because a release
          # runs no check of its own: release.yml consumes this run's verdict for the tip of `main`
          # through `workflow_run`, so the `release` column of the table is the set a release must
          # already have green rather than a second run of the same commit.
          MOMENT: >-
            ${{ github.event_name == 'pull_request' && 'pr'
            || github.event_name == 'schedule' && 'schedule'
            || 'main' }}
        run: |
          rows="$(uv run scripts/check.py --json --when "$MOMENT")"
          echo "groups=$(printf '%s' "$rows" | jq -c '[.[] | select(.group != "coverage")]')" >> "$GITHUB_OUTPUT"
          echo "coverage=$(printf '%s' "$rows" | jq -c '[.[] | select(.group == "coverage")]')" >> "$GITHUB_OUTPUT"
          uv run scripts/check.py --list

  run:
    name: ${{ matrix.leg }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    runs-on: ${{ matrix['runs-on'] }}
    timeout-minutes: ${{ matrix['timeout-minutes'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # Node is installed on the legs whose row lists it, which the matrix row carries, so a leg
      # that runs no JavaScript spends none of its minutes on a toolchain it never calls.
      - if: contains(matrix.tools, 'npm')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Cache Chromium and ffmpeg
        # The three platforms keep a per-user cache in three places, so all six are named and the
        # ones this runner does not have are simply not there.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/decktalk
            ~/Library/Caches/ms-playwright
            ~/Library/Caches/decktalk
            ~/AppData/Local/ms-playwright
            ~/AppData/Local/decktalk
          key: tools-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Run the group
        # check.py opens its own log with the group name and the one local command that reproduces
        # it, so a reader who finds this job red never has to open a workflow file.
        #
        # The shell is named because the default on a Windows runner is PowerShell, where `$GROUP`
        # is not a reference to an environment variable and expands to nothing. Every Windows leg
        # therefore asked for no group at all and ran every group that gates the current moment,
        # starting with a lint group that is a Linux row.
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: uv run scripts/check.py --group "$GROUP"
      - name: Keep the coverage this leg measured
        # Only the Linux legs reach the floor, and the coverage job selects them by name.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.group }}-${{ matrix['runs-on'] }}-${{ matrix.python }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    # One floor, measured on Linux, because three platforms with different skip sets give a floor
    # nobody can satisfy and hide the platform-only branches inside a combined report.
    name: ${{ matrix.leg }}
    needs: [plan, run]
    if: always() && needs.plan.outputs.coverage != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.coverage) }}
    runs-on: ${{ matrix['runs-on'] }}
    timeout-minutes: ${{ matrix['timeout-minutes'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*-ubuntu-latest-*
          path: coverage-legs
          merge-multiple: false
      - name: Gather what the Linux legs measured
        # Each group names its own data file, so a whole run on one machine combines. Two legs of
        # one group differ only by the Python they ran, and a suite that spawned subprocesses may
        # have left more than one file, so each is renamed after the leg it came from and counted.
        run: |
          gathered=""
          count=0
          for path in coverage-legs/*/.coverage*; do
            [ -e "$path" ] || continue
            leg="$(basename "$(dirname "$path")")"
            leg="${leg#coverage-}"
            count=$((count + 1))
            mv "$path" "./.coverage.$leg.$count"
            gathered="$gathered $leg"
          done
          if [ -z "$gathered" ]; then
            echo "no leg uploaded any coverage data, so this run measured nothing to hold to a floor" >&2
            exit 1
          fi
          echo "gathered the coverage of:$gathered"
      - name: Run the group
        env:
          GROUP: ${{ matrix.group }}
        run: uv run scripts/check.py --group "$GROUP"

  regenerate:
    # Everything release-please's own bump makes stale is regenerated on its pull request branch, so
    # the merge commit already carries it, every `--check` is true on `main` at every instant and no
    # bot ever writes to `main`. The push uses an app token because a push made with GITHUB_TOKEN
    # starts no workflow, and the required check would then never report on the commit that merges.
    #
    # Every generator in the `generated` group runs in write mode, read from the same row the check
    # reads, so this job cannot forget a file the bump made stale. Every tracked file that changed is
    # committed, together with any new file in the directories those generators write. The
    # `rehearsal` group makes a throwaway bump and runs this same command on every pull request, so a
    # generator that cannot write fails there first rather than here.
    name: regenerate what the version bump made stale
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ vars.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          # The token writes to one branch, so it is granted the contents scope alone.
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: uv run scripts/check.py --group generated --write
      - name: Commit what the bump made stale
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "decktalk-changelog[bot]"
          git config user.email "decktalk-changelog[bot]@users.noreply.github.com"
          git add -u
          git add assets docs schemas site src/decktalk
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate what the version bump made stale"
          git push origin "HEAD:$BRANCH"

  ci:
    # A generated matrix cannot be a required check, because a ruleset names a check by literal
    # string and `run (browser, macos-latest, 3.12)` does not exist until the plan job has run. This
    # job is that literal string, and a `needs` on a matrix job aggregates every one of its legs, so
    # requiring `ci` on `main` requires all of them.
    name: ci
    needs: [plan, run, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every group the table selected was run and passed
        env:
          GROUPS: ${{ needs.plan.outputs.groups }}
          COVERAGE: ${{ needs.plan.outputs.coverage }}
          RUN_RESULT: ${{ needs.run.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$(printf '%s' "$GROUPS" | jq 'length')" -eq 0 ]; then
            echo "the check table selected no group, so this run proves nothing" >&2
            exit 1
          fi
          if [ "$RUN_RESULT" != "success" ]; then
            echo "the check groups ended in $RUN_RESULT" >&2
            exit 1
          fi
          if [ "$(printf '%s' "$COVERAGE" | jq 'length')" -gt 0 ] && [ "$COVERAGE_RESULT" != "success" ]; then
            echo "the coverage floor ended in $COVERAGE_RESULT" >&2
            exit 1
          fi
