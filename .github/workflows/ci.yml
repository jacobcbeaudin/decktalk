name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms run the browser tests and the smoke build"
        type: choice
        default: all
        options: [all, ubuntu, macos, windows]

jobs:
  checks:
    name: checks (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: uv run pytest -q
      - run: uv run scripts/build_config_reference.py --check

  lint:
    name: lint (JavaScript and shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      # The same versions as .pre-commit-config.yaml. The runner's own shellcheck is older, so the
      # pinned build comes from shellcheck-py.
      - run: npx --yes @biomejs/biome@2.5.13 ci .
      - run: git ls-files -z '*.sh' | xargs -0 uvx --from shellcheck-py==0.11.0.1 shellcheck

  worker:
    name: media worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/media
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: workers/media/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the canary on every push and pull request. Tags run every platform, and
        # the Actions tab can run any platform on demand, so the macOS and Windows minutes
        # are spent only when a release is cut or someone asks.
        os: ${{ startsWith(github.ref, 'refs/tags/') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || (github.event_name == 'workflow_dispatch' && inputs.platforms == 'all') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || (github.event_name == 'workflow_dispatch' && inputs.platforms == 'macos') && fromJSON('["macos-latest"]') || (github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows') && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Cache Chromium and ffmpeg
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
            .venv/lib/*/site-packages/static_ffmpeg/bin
          key: browsers-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run decktalk setup
      - run: uv run decktalk doctor
      - run: uv run pytest -q -m "browser or media"
      # Headless Chromium draws the page in software, and the hosted macOS and Windows runners do it
      # more slowly than a laptop, so a reveal on the demo's busiest scenes can land two or three
      # frames late there. Those runners measure with a wider window. smoke.sh reports the scaffold's
      # OFF CUE rows without failing, because a runner presents frames late while a large layer moves.
      - name: Widen the sync tolerance on the slower runners
        if: runner.os != 'Linux'
        run: |
          echo "DECKTALK_VERIFY_MAX_OFFSET_FRAMES=4" >> "$GITHUB_ENV"
          echo "DECKTALK_VERIFY_MAX_AV_FRAMES=5" >> "$GITHUB_ENV"
          echo "DECKTALK_ALIGN_STALL_MS=400" >> "$GITHUB_ENV"
      # A small deck of still pages whose reveals snap in. Any verify finding fails it, OFF CUE included.
      # It gates the job on Linux. The slower runners run it with the wider window and only report.
      - name: Cue timing gate
        continue-on-error: ${{ runner.os != 'Linux' }}
        run: bash tests/timing.sh
      - run: bash tests/smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            tests/out/smoke/build/out/smoke.mp4
            tests/out/smoke/build/shots/
            tests/out/smoke/build/rec/*.json
            tests/out/smoke/build/audio/beats.json
            tests/out/smoke/build/audio/timeline.json
            tests/out/timing/build/out/timing.mp4
            tests/out/timing/build/rec/*.json
            tests/out/timing/verify.json
          if-no-files-found: ignore
