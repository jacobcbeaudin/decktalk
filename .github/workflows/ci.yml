name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every workflow reads the repository and nothing more. A job that needs a write grants it itself.
permissions:
  contents: read

# One run per branch. A second push supersedes the first rather than racing it, which on a
# public repository costs no money but does cost the wait for a green tick. `main` is never
# cancelled: its runs are the record of what shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  checks:
    name: checks (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run ty check src
      - run: uv run pytest -q

  docs:
    # Every generated page, and every link between the pages. A page whose source moved on without
    # it fails here, so no pull request can leave the docs describing code that is gone.
    name: docs (generated pages and links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run scripts/build_cli_reference.py --check
      - run: uv run scripts/build_settings_reference.py --check
      - run: uv run scripts/build_outbound_reference.py --check
      - run: uv run scripts/build_skills_list.py --check
      - run: uv run scripts/build_contributing.py --check
      - run: uv run scripts/build_changelog.py --check
      - run: uv run scripts/check_docs_links.py --check

  lint:
    name: lint (JavaScript and shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same version as .pre-commit-config.yaml and biome.json.
      - run: npx --yes @biomejs/biome@2.5.13 ci .
      # The installer is `#!/bin/sh`, and -s sh is what makes shellcheck say so: without it a bashism
      # passes here and fails on the busybox sh of whoever pasted the one-liner. The runner ships
      # shellcheck, and .pre-commit-config.yaml runs the same check before the commit.
      - run: shellcheck -s sh site/install.sh

  e2e:
    # The browser, media and pipeline suites on Linux, with coverage over the whole suite. The pipeline test
    # builds tests/e2e/fixture silently in about a minute here and gates cue timing on this platform. macOS and
    # Windows run the same suites in cross-platform.yml, on pushes to main and before a release is published.
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Cache Chromium and ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/decktalk
          key: tools-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run decktalk install
      - run: uv run decktalk doctor
      - name: Unit, browser, media and pipeline tests with coverage
        run: uv run pytest -q -m "not scaffold" --cov --cov-report=term --cov-report=xml --durations=10 | tee pytest.log
      - name: Coverage in the job summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            sed -n '/^---------- coverage/,$p' pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-ubuntu
          path: |
            tests/out/e2e/pipeline/verify.json
            tests/out/e2e/pipeline/build/recordings/*.json
            tests/out/e2e/pipeline/build/narration/*.json
            tests/out/e2e/pipeline/build/screenshots/
            tests/out/e2e/pipeline/build/preflight/
            tests/out/e2e/pipeline/build/out/*.mp4
            tests/out/e2e/pipeline/build/out/*.srt
            pytest.log
          if-no-files-found: ignore

  cross-platform:
    # A regression on macOS or Windows should land on one commit, not on the release, so the job runs on every
    # push to main. Pull requests stay on Linux, which keeps them to about five minutes.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/cross-platform.yml

  installer:
    # site/install.sh installed for real in Debian, Ubuntu, Fedora and Alpine containers. Same rule as
    # cross-platform: every push to main, not every pull request. A pull request that edits the installer
    # runs the matrix from installer.yml's own paths filter, so the one that needs it still gets it.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/installer.yml
