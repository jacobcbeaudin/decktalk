name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms run the browser tests and the smoke build"
        type: choice
        default: all
        options: [all, ubuntu, macos, windows]

jobs:
  checks:
    name: checks (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: uv run pytest -q
      - run: uv run scripts/build_config_reference.py --check

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the canary on every push and pull request. Tags run every platform, and
        # the Actions tab can run any platform on demand, so the macOS and Windows minutes
        # are spent only when a release is cut or someone asks.
        os: ${{ startsWith(github.ref, 'refs/tags/') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || (github.event_name == 'workflow_dispatch' && inputs.platforms == 'all') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || (github.event_name == 'workflow_dispatch' && inputs.platforms == 'macos') && fromJSON('["macos-latest"]') || (github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows') && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Cache Chromium and ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
            .venv/lib/*/site-packages/static_ffmpeg/bin
          key: browsers-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run decktalk setup
      - run: uv run decktalk doctor
      - run: uv run pytest -q -m "browser or media"
      # Headless Chromium draws the page in software, and the hosted macOS and Windows runners do it
      # more slowly than a laptop, so a reveal on the demo's busiest scenes can land two or three
      # frames late there. Those runners measure with a wider window. On every runner, smoke.sh reports
      # OFF CUE rows without failing until a lighter timing test exists.
      - name: Widen the sync tolerance on the slower runners
        if: runner.os != 'Linux'
        run: |
          echo "DECKTALK_VERIFY_MAX_OFFSET_FRAMES=4" >> "$GITHUB_ENV"
          echo "DECKTALK_VERIFY_MAX_AV_FRAMES=5" >> "$GITHUB_ENV"
          echo "DECKTALK_ALIGN_STALL_MS=400" >> "$GITHUB_ENV"
      - run: bash tests/smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            tests/out/smoke/build/out/smoke.mp4
            tests/out/smoke/build/shots/
            tests/out/smoke/build/rec/*.json
            tests/out/smoke/build/audio/beats.json
            tests/out/smoke/build/audio/timeline.json
          if-no-files-found: ignore
