name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: uv run pytest -q

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # pull requests: Linux only (fast feedback); main and tags: every platform
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run decktalk setup
      - run: uv run decktalk doctor
      - run: uv run pytest -q -m browser
      - run: bash tests/smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            tests/out/smoke/build/out/smoke.mp4
            tests/out/smoke/build/shots/
          if-no-files-found: ignore
