# PR titles must be Conventional Commits, because a squash-merge turns the PR title into
# the commit on main that release-please reads. (Repo setting to pair with this:
# Settings -> General -> Pull Requests -> default squash message = "Pull request title".)
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# One run per branch. A second push supersedes the first rather than racing it, which on a
# public repository costs no money but does cost the wait for a green tick. `main` is never
# cancelled: its runs are the record of what shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
