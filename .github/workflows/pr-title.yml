# PR titles must be Conventional Commits, because a squash-merge turns the PR title into
# the commit on main that release-please reads. (Repo setting to pair with this:
# Settings -> General -> Pull Requests -> default squash message = "Pull request title".)
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# One run per pull request. A second push supersedes the first rather than racing it, which on a
# public repository costs no money but does cost the wait for a green tick.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
