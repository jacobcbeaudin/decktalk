name: Bug report
description: Something built the wrong thing, or nothing at all.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got. Paste the command output, with the key redacted if it appears (it should not).
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `decktalk doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: sections
    attributes:
      label: The `[[section]]` tables from decktalk.toml, and the cues for the section involved
      render: toml
  - type: dropdown
    id: silent
    attributes:
      label: Does it also happen with `decktalk build --silent`?
      options: ["Yes", "No", "Did not try"]
